const beforeSemesterTimetable=timetable,beforeSemesterActivities=schoolActivities,beforeSemesterGrowth=growth,beforeSemesterMe=schoolMe,beforeSemesterEnding=ending,beforeSemesterBind=bindSchoolForms;
function semesterNotice(){const s=game.school;return `<section class="semester-notice"><b>${Sim.profile(s).name} · ${s.grade}</b><span>9/12 运动会　9/23 期中考试　9/25 校园祭　10/15 期末</span>${s.day<Sim.SPECIAL_DAYS.exam?`<p>期中预测 <strong>${Sim.midtermScore(s)} / 750</strong>，450 分合格。正常进度下，两科合计约7节即可合格；选得极少才可能退学。</p>`:s.exam?`<p>期中成绩 ${s.exam.score} / 750 · ${s.exam.passed?'合格':'未合格'}</p>`:''}</section>`}
nextDayButton=function(){const s=game.school,d=schoolDate(),can=Sim.ready(s);return `<div class="school-next"><button class="campus-primary" id="nextSchoolDay" ${s.completed||!can?'disabled':''}>${s.completed?s.expelled?'退学结局 · 本轮已结束':'本轮校历已完成':d.last?'完成本轮校历':'进入下一天　→'}</button><p>${s.completed?'可以查看记录、导出存档或开始新的故事。':!can?Sim.special(s.day)?'完成今日特别活动与剧情选择后进入下一天。':'完成今天的四节课后进入下一天。':'当天未选择的活动将被跳过。'}</p></div>`};
timetable=function(){const s=game.school,d=schoolDate();if(s.completed)return ending();if(Sim.special(s.day))return schoolBanner()+specialSchoolDay()+nextDayButton();if(d.weekend)return schoolBanner()+statStrip()+`<div class="campus-card weekend-card"><span class="eyebrow">ONE DAY, ONE CHOICE</span><h3>约会，或认真工作。</h3><p>一天只能选一个。发出约会邀请后，即使被婉拒，也不能再安排打工。</p><button class="campus-secondary" data-school-tab="活动">去安排周末</button></div>`+jobPanel()+nextDayButton();return beforeSemesterTimetable().replace('<div class="school-section-heading">',semesterNotice()+'<div class="school-section-heading">')};
schoolActivities=function(){const s=game.school;if(s.completed)return ending();if(Sim.special(s.day))return schoolBanner()+specialSchoolDay()+nextDayButton();let html=beforeSemesterActivities();const current=s.weekendActivities[s.day];if(current?.type==='work')html=html.replace(/(<form class="campus-form" id="dateForm">)([\s\S]*?)(<\/form>)/,(all,start,body,end)=>start+'<fieldset disabled class="semester-fieldset">'+body.replace('发出约会邀请','今天已经完成工作')+'</fieldset>'+end);return html.replace('<section class="school-activity-section"><span class="eyebrow">SATURDAY & SUNDAY</span>',jobPanel()+'<section class="school-activity-section"><span class="eyebrow">SATURDAY & SUNDAY</span>')};
function jobPanel(){const s=game.school,p=Sim.profile(s),work=s.weekendActivities[s.day],allowed=schoolDate().weekend&&!s.completed&&!work;return `<section class="campus-card semester-job"><span class="eyebrow">WEEKEND WORK</span><h3>${p.job}</h3><p>${p.name} · 本次收入 <strong>${money(p.pay)}</strong></p><small>${s.identity==='ordinary'?'咖啡店工作时，也许会遇见熟悉的同学。':'完成身份对应的周末工作后，收入直接进入零用钱。'}</small><button class="campus-secondary" data-weekend-work ${allowed?'':'disabled'}>${work?.type==='work'?'今天已完成工作':work?.type==='date'?'今天已安排约会':schoolDate().weekend?'开始今天的工作':'周末开放'}</button>${work?.type==='work'?`<div class="school-settlement"><strong>${money(work.pay)} 已到账</strong><p>${work.id?`在咖啡店遇到了${C[work.id].name}，聊了一会儿。好感 +${work.gains.affection}。`:'今天的工作顺利结束了。'}</p></div>`:''}</section>`}
function specialSchoolDay(){const type=Sim.special(game.school.day);return type==='sports'?sportsPage():type==='exam'?examPage():festivalPage()}
function sportsPage(){const s=game.school,r=s.sports;const list=`<p class="school-copy">体育课累计 ${s.attendance['体育']} 节。上满 4 节得第三名（₩150,000），7 节得第二名（₩300,000），10 节得第一名（₩500,000）。</p>`;if(!r)return `<div class="semester-event-heading"><span class="eyebrow">9.12 / SPORTS DAY</span><h3>跑道边，<br>有你想被看见的人。</h3><p>今天不排普通课程。你可以报名比赛，也可以在场边为大家加油。</p></div>${list}<form class="campus-form" id="sportsForm"><label class="semester-choice"><input type="radio" name="sportsJoin" value="yes" checked>报名参加运动会</label><label class="semester-choice"><input type="radio" name="sportsJoin" value="no">不报名，在场边观看</label><button class="campus-primary">开始运动会</button></form>`;
 if(r.legacySkipped)return '<div class="school-tip">运动会已随旧校历结束，原有进度已保留。</div>';
 const event=r.featured;return `<div class="semester-event-heading"><span class="eyebrow">SPORTS DAY / RESULTS</span><h3>${r.registered?r.rank?'你的努力被看见了。':'这一次，跑到了终点。':'在看台上，也留下了回忆。'}</h3></div>${list}<div class="school-settlement"><strong>${r.rank?'获得第 '+r.rank+' 名':r.registered?'完成比赛，未获得名次':'本次没有报名参赛'}</strong><p>${r.reward?`奖金 ${money(r.reward)}。${Object.entries(r.gains).map(([id,change])=>C[id].name+'：'+relationText(change)).join('；')}`:'没有扣除金钱或好感。'}</p></div><div class="semester-sport-members">${Sim.IDS.map(id=>`<span>${av(id)}<small>${C[id].name}</small></span>`).join('')}</div><article class="campus-card semester-story"><header>${av(event.id)}<strong>${C[event.id].name}</strong></header>${event.type==='award'?`<h3>他也站上了领奖台。</h3><p>${C[event.id].name}拿到了第 ${event.rank} 名。人群的掌声里，他朝看台望了一眼。</p><button class="campus-secondary" data-school-chat="${event.id}">去和他说句话</button>`:`<h3>比赛后，他停在了跑道边。</h3><p>${C[event.id].name}在比赛中受了伤，需要到医务室处理。你可以陪他过去，或者请校医来照看。</p>${event.helped===null?`<button class="campus-primary" data-sports-help="yes">送他去医务室</button><button class="campus-secondary" data-sports-help="no">请校医前来照看</button>`:`<div class="school-settlement">${event.helped?'你陪他去了医务室。'+relationText(event.gains):'校医已经前来照看他。'}</div>`}`}</article>`}
function examPage(){const s=game.school,r=s.exam;return `<div class="semester-event-heading"><span class="eyebrow">9.23 / MIDTERM</span><h3>试卷翻开之前，<br>那些努力都有痕迹。</h3><p>今天不排普通课程，期中满分 750，450 分为合格线。未合格会被退学，本轮校园生活立即结束。</p></div><div class="semester-exam-score"><small>${r?'期中成绩':'根据当前成长预测'}</small><strong>${r?r.score:Sim.midtermScore(s)}<span>/ 750</span></strong><p>学识 ×3.4 + 逻辑 ×2 + 情商 ×2</p></div>${r?`<div class="school-settlement"><strong>${r.passed?'考试合格，继续你的校园生活。':'考试未合格，已触发退学结局。'}</strong></div>`:`<button class="campus-primary" data-take-exam>参加期中考试并结算</button>`}`}
function festivalPage(){const s=game.school,r=s.festival;if(r)return `<div class="semester-event-heading"><span class="eyebrow">9.25 / SCHOOL FESTIVAL</span><h3>把今天，<br>夹进学期的书页里。</h3></div><div class="school-settlement"><strong>${r.id?C[r.id].name+'和你一起去了'+r.stall:'今天独自逛了逛校园祭'}</strong><p>${r.id?`好感 +${r.gains.affection}，警戒 −${r.gains.guard}。`:'自由逛逛也很好。'}</p></div>`;return `<div class="semester-event-heading"><span class="eyebrow">9.25 / SCHOOL FESTIVAL</span><h3>期中考完两天后，<br>校园热闹了起来。</h3><p>期中考试两天后的校园祭。今天不排普通课程，可以找一位同学一起逛，也可以独自走走。</p></div><form class="campus-form" id="festivalForm"><label for="festivalWho">和谁一起<select id="festivalWho">${Sim.IDS.map(id=>`<option value="${id}">${C[id].name}</option>`).join('')}<option value="solo">独自逛逛</option></select></label><label for="festivalStall">想去哪里<select id="festivalStall"><option>舞台演出</option><option>摄影摊位</option><option>校园小吃</option></select></label><small>把这一天安排成你想留下的回忆。</small><button class="campus-primary">留下这一天的回忆</button></form>`}
growth=function(){const s=game.school;let html=beforeSemesterGrowth();html=html.replace('<h3>今天的你</h3>',semesterNotice()+'<h3>今天的你</h3><p class="school-copy">体育课累计 '+s.attendance['体育']+' 节 · 入学身份：'+Sim.profile(s).name+'</p>');for(const id of Sim.IDS){const c=C[id],r=s.relations[id];html=html.replace(`<small>${c.grade} · ${Sim.stage(r)}</small>`,`<small>${c.grade} · ${Sim.stage(r)} · 称呼：${escapeHTML(Sim.address(s,id,game.player.name).preferred)}</small>`)}html=html.replace(/<details class="school-rules">[\s\S]*?<\/details>/,`<details class="school-rules"><summary>查看属性与关系规则</summary><p>当前身份：${Sim.profile(s).name}。常规好感成长为 ${Math.round(Sim.profile(s).rate*100)}%。体育获奖固定 +10，医务室帮助固定 +5，不受该倍率影响。</p><p>每天首次成功聊天基础好感 +2、警戒 −1；社团 +8／−7；成功约会 +7／−4。每25点情商额外增加1点基础好感，每35点逻辑额外降低1点警戒。好感35后直呼名字，70后可使用昵称。</p><p>每节课学识+2，数学逻辑+3，语文情商+3，其他科目才华+3；才艺课每3节奖励₩30,000。名气随才华提高，增加论坛话题。</p><p>周末一天只能约会或打工。低于50好感或高于30警戒必拒绝，发出邀请即使用当天机会。9/12运动会、9/23期中、9/25校园祭为特别日，不排普通课程。</p></details>`);return html};
schoolMe=function(){return beforeSemesterMe().replace('<select id="playerSchoolGrade">','<select id="playerSchoolGrade" disabled>').replace('我的年级','入学年级（本轮固定）')};
ending=function(){const s=game.school;if(!s.expelled)return beforeSemesterEnding()+'<button class="campus-primary" data-new-round>重开一轮</button>';return schoolBanner()+`<div class="campus-card school-ending semester-expelled"><span class="eyebrow">MIDTERM / ENDING</span><h3>这一学期，<br>在这里暂时停下。</h3><p>期中成绩 ${s.exam.score} / 750，未达到 450 分合格线。你已被退学，本轮不再推进日期或领取成长。</p><p>聊天、关系、金钱和校园记录都已保留。可以导出这段经历，或重新入学，尝试另一份课表。</p><button class="campus-secondary" data-school-settings>查看或导出存档</button><button class="campus-primary" data-new-round>重开一轮</button></div>`};
bindSchoolForms=function(){beforeSemesterBind();if($('#sportsForm'))$('#sportsForm').onsubmit=e=>{e.preventDefault();semesterAction(()=>{const r=Sim.sports(game.school,app.querySelector('[name="sportsJoin"]:checked').value==='yes');semesterMessage('sports',r)})};if($('#festivalForm'))$('#festivalForm').onsubmit=e=>{e.preventDefault();semesterAction(()=>{const who=$('#festivalWho').value;const r=Sim.festival(game.school,who==='solo'?null:who,$('#festivalStall').value);semesterMessage('festival',r)})};};
function semesterAction(action){try{action();saveCampus();refreshHome();renderSchool()}catch(error){toast(error.message)}}
function semesterMessage(type,r){const name=game.player.name;let id=r.id,text='';if(type==='work'&&id)text=Sim.address(game.school,id,name).preferred+'，没想到会在这家店遇到你。今天辛苦了，下次再来找你。';if(type==='help'){id=r.id;if(r.helped)text=Sim.address(game.school,id,name).preferred+'，谢谢你刚才陪我去医务室。已经处理好了，不用太担心。'}if(type==='festival'&&id)text=Sim.address(game.school,id,name).preferred+'，今天一起逛'+r.stall+'很开心。我们也算一起留下校园祭的回忆了。';if(type==='sports'){id=r.featured.id;if(r.featured.type==='award')text=Sim.address(game.school,id,name).preferred+'，刚才在领奖台上看见你了。今天的运动会很难忘。'}if(id&&text)receiveScripted(id,text,type,{},'semester-'+type+'-'+game.school.day+'-'+id)}
app.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.hasAttribute('data-weekend-work'))semesterAction(()=>{const r=Sim.work(game.school);semesterMessage('work',r)});if(b.dataset.sportsHelp)semesterAction(()=>{const r=Sim.helpInjury(game.school,b.dataset.sportsHelp==='yes');semesterMessage('help',r)});if(b.hasAttribute('data-take-exam'))semesterAction(()=>Sim.exam(game.school));if(b.hasAttribute('data-semester-restart')){openApp('settings');$('#resetCampus')?.scrollIntoView({block:'center'})}});

function startNewRound(){if(sending.size){toast('请等当前回复完成后再重开。');return}confirmGameAction('重开一轮会清空本轮校历与聊天，重新选择姓名、年级和身份。需要留念的话请先导出存档。确定重开吗？',()=>{localStorage.removeItem(CAMPUS_KEY);location.reload()})}
app.addEventListener('click',e=>{if(e.target.closest('[data-new-round]'))startNewRound()});

onboarding=function(step=1,draft={name:game.player?.name||'',grade:game.school.grade,identity:game.school.identity}){
 document.querySelector('.onboard')?.remove();locked=false;$('#lock').hidden=true;$('#lock').inert=true;$('#homeButton').inert=true;$('#lockToggle').disabled=true;
 const el=document.createElement('section');el.className='onboard admission';el.setAttribute('role','dialog');el.setAttribute('aria-label','入学登记');screen.append(el);$('#home').inert=true;app.inert=true;
 const intro=`<img class="admission-crest" src="${window.CAMPUS_CREST}" alt="得比高中校徽"><div class="eyebrow">ADMISSION / 0${step}</div>`;
 if(step===1)el.innerHTML=intro+`<h1>先写下<br>你的名字。</h1><p class="lead">这会成为你的 KKT 名字。</p><form class="campus-form" id="newNameForm"><label for="newPlayerName">玩家姓名</label><input id="newPlayerName" required maxlength="16" autocomplete="off" value="${escapeHTML(draft.name)}" placeholder="你的名字"><button class="campus-primary">下一步　→</button></form>`;
 if(step===2)el.innerHTML=intro+`<h1>今年，<br>你读几年级。</h1><p class="lead">${escapeHTML(draft.name)}，年级会决定大家初见时喊你学姐、学妹，还是同学。</p><form class="campus-form" id="newGradeForm"><label for="admissionGrade">入学年级</label><select id="admissionGrade">${['高一','高二','高三'].map(g=>`<option ${draft.grade===g?'selected':''}>${g}</option>`).join('')}</select><small>关系变亲近后，会逐渐直呼你的名字或使用昵称。年级与身份在本轮固定。</small><button class="campus-primary">选择我的身份　→</button><button type="button" class="campus-secondary" id="admissionBackName">返回修改姓名</button></form>${game.player?'<p class="admission-migration">原聊天与校园成长会保留；本次登记会补入身份初始资金，并将已获得的关系成长应用到新起点。</p>':''}`;
 if(step===3)el.innerHTML=intro+`<h1>以怎样的你，<br>开始这段校园生活。</h1><form class="campus-form" id="newIdentityForm">${Object.entries(Sim.PROFILES).map(([id,p])=>`<label class="admission-choice"><input type="radio" name="admissionIdentity" value="${id}" ${draft.identity===id?'checked':''}><span><strong>${p.name}</strong><small>${money(p.money)} · 初始好感 ${p.affection} / 警戒 ${p.guard}</small><small>${id==='heiress'?'家族企业实践':id==='president'?'维持学生会的日常 · 家教兼职':'从普通的日子开始 · 咖啡店兼职'}</small></span></label>`).join('')}<button class="campus-primary">以${escapeHTML(draft.grade)}学生的身份入学</button><button type="button" class="campus-secondary" id="admissionBackGrade">返回修改年级</button></form>`;
 el.insertAdjacentHTML('beforeend','<p id="admissionError" role="alert"></p>');
 if(step===1){$('#newNameForm').onsubmit=e=>{e.preventDefault();const name=$('#newPlayerName').value.trim();if(!name)return;onboarding(2,{...draft,name})};$('#newPlayerName').focus()}
 if(step===2){$('#newGradeForm').onsubmit=e=>{e.preventDefault();onboarding(3,{...draft,grade:$('#admissionGrade').value})};$('#admissionBackName').onclick=()=>onboarding(1,draft)}
 if(step===3){$('#admissionBackGrade').onclick=()=>onboarding(2,draft);$('#newIdentityForm').onsubmit=e=>{e.preventDefault();try{const identity=el.querySelector('[name="admissionIdentity"]:checked')?.value;if(!identity)throw Error('请选择一个身份');Sim.configure(game.school,identity,draft.grade);game.player={...(game.player||{}),name:draft.name,grade:draft.grade,identity:Sim.PROFILES[identity].name};schoolGrade=draft.grade;seedAdmissionGreetings();game.needsFirstUnlock=true;if(!saveCampus())return;el.remove();app.inert=false;$('#homeButton').inert=false;$('#lockToggle').disabled=false;lockPhone();toast('欢迎入学，输入密码后进入手机')}catch(error){$('#admissionError').textContent=error.message}}}
};
function seedAdmissionGreetings(){const first={jae:'我是李贤在。新学期有需要帮忙的地方，可以来找我。',ju:'我是李柱延。刚从图书馆出来。你好。',young:'我是金泳勋。刚陪bori公主散完步，开学资料收到了吗？',sun:'金善旴。名字先存好，别下次又问我是谁。',q:'我是池昌民。以后有机会一起拍照吧。'};for(const id of Sim.IDS)if(game.chats[id].length===1&&game.chats[id][0].seed)game.chats[id][0].content=Sim.address(game.school,id,game.player.name).preferred+'，'+first[id]}

const homeWithoutCrest=installCampusHome;installCampusHome=function(){homeWithoutCrest();const icon=$('#home [data-open="school"] .app-icon');if(icon){icon.innerHTML='<img src="'+window.CAMPUS_CREST+'" alt="得比高中校徽">';icon.classList.add('school-crest-icon')}};

let fundingTab='总览',giftRecipient='jae',fundingReceipt='';
Sim.hydrateFunding(game.school);
const saveBeforeFunding=saveCampus;
saveCampus=function(){flushFundingMessages();return saveBeforeFunding()};
function flushFundingMessages(){const f=game.school?.funding;if(!f)return;while(f.delivered<f.outbox.length){const m=f.outbox[f.delivered++];if(!C[m.id])continue;const call=Sim.address(game.school,m.id,game.player?.name||'同学').preferred;let text='';if(m.type==='sponsor')text=call+'，企划资料我收到了。谢谢你愿意支持我的校园生活，我会认真对待。';if(m.type==='weekly')text='这周的资助收到了，谢谢你。';if(m.type==='gift'||m.type==='support'){const item=(m.type==='gift'?Sim.GIFTS:Sim.SUPPORT_ITEMS)[m.itemId];const words=m.liked?'这个很合我的心意。':'我收到了，你费心了。';text=m.id==='sun'?`${call}，${item.name}收到了。${m.liked?'挺会挑啊，确实喜欢。':'谢了，我会好好留着。'}`:m.id==='ju'?`${call}，刚看到你送的${item.name}。谢谢。${words}`:m.id==='q'?`${call}，${item.name}我收到了。${words}`:`谢谢你，${call}。${item.name}收到了。${words}`;if(m.guardIncrease>0)text+='这次花得有点多，下次不用这么贵。'}if(m.type==='reservation')text=call+'，'+Sim.date(m.serviceDay).label+'晚上的'+Sim.SERVICES[m.kind].name+'预约确认了，到时候见。';if(m.type==='service')text=m.kind==='tutoring'?call+'，今天讲的题记得再看一遍。有不懂的地方，下次一起整理。':call+'，今天一起出去走走很开心。谢谢你留了这段时间。';if(text)receiveScripted(m.id,text,m.type,{itemId:m.itemId,kind:m.kind,serviceDay:m.serviceDay},'funding-'+(f.delivered-1))}}
function nextSupportDay(){const n=game.school.day+(7-game.school.day%7);return n<Sim.LIMIT?n:null}
function fundingSummary(){const s=game.school,next=nextSupportDay();return `<div class="funding-wallet"><span>可用余额<strong>${money(s.attributes.money)}</strong></span><small>${s.funding.target?next===null?'本轮已无后续周扣款':'下次资助费 '+Sim.date(next).label+' · '+money(Sim.WEEKLY_FEE):'每周资助费 '+money(Sim.WEEKLY_FEE)}</small></div>`}
renderAid=function(t=fundingTab){fundingTab=t;app.className='app aid-app';const pages={总览:fundOverview,礼物商城:giftStore,定向商城:supportStore,周末预约:reservationStore,账单:fundLedger};if(!pages[fundingTab])fundingTab='总览';app.innerHTML=campusTop('贫困生资助企划')+`<nav class="school-nav funding-nav">${Object.keys(pages).map(n=>`<button data-funding-tab="${n}" class="${n===fundingTab?'active':''}">${n}</button>`).join('')}</nav><div class="campus-body funding-body">${fundingSummary()}${game.school.bankrupt?bankruptcyAidNotice():game.school.completed?'<div class="school-tip">本轮已经结束，商城与预约停止结算。可以查看账单或重开一轮。</div>':''}${fundingReceipt?`<div class="school-settlement" role="status">${fundingReceipt}</div>`:''}${pages[fundingTab]()}</div>`;bindFundingForms()};
function fundOverview(){const s=game.school,f=s.funding;if(f.target)return `<div class="campus-card funding-target"><span class="eyebrow">YOUR SPONSORED STUDENT</span><div>${av(f.target)}<span><h3>${C[f.target].name}</h3><small>${C[f.target].grade} · 本轮已锁定</small></span></div><p>每周资助费 ${money(Sim.WEEKLY_FEE)}。选定当周先扣一次，以后每周一自动扣款，不能更换对象。</p><button class="campus-secondary" data-funding-tab="定向商城">为他添置一些用品</button><button class="campus-secondary" data-funding-tab="周末预约">预约周末补课或出游</button></div><div class="funding-budget"><h3>把日子安排得从容一点。</h3><p>普通学生一次咖啡店工作收入 ₩120,000，可以支付一周资助费并留下余量。正常课表的才艺奖励也可以支付支出。</p><p>建议留下至少 ${money(Sim.WEEKLY_FEE)} 的下周预算。余额耗尽，或周扣款时余额不足，会触发破产退学。</p></div>`;return `<div class="funding-intro"><span class="eyebrow">ONE PERSON / ONE TERM</span><h3>把一份支持，<br>送到一个人身边。</h3><p>每轮只能定向资助一位男主，选择后不可更改。现在扣本周 ${money(Sim.FIRST_FEE)}，以后每周一扣₩100,000。</p></div>${Sim.IDS.map(id=>`<article class="campus-card funding-select">${av(id)}<div><strong>${C[id].name}</strong><small>${C[id].grade}</small></div><button data-choose-sponsor="${id}" ${s.completed?'disabled':''}>选择资助</button></article>`).join('')}<p class="funding-copy">礼物商城可以给所有男主送礼；定向商城和周末预约只对本轮资助对象开放。</p>`}
function giftStore(){return `<div class="campus-form"><label for="giftRecipient">礼物想送给谁</label><select id="giftRecipient">${Sim.IDS.map(id=>`<option value="${id}" ${giftRecipient===id?'selected':''}>${C[id].name}</option>`).join('')}</select></div><div id="giftGrid">${giftCards()}</div><p class="funding-copy">挑一件礼物，让他从KKT消息里收到你的心意。</p>`}
function giftCards(){return Object.entries(Sim.GIFTS).map(([id,item])=>{const liked=item.likes.includes(giftRecipient),gain=Math.round((item.affection+(liked?2:0)+Math.floor(game.school.attributes.eq/25))*Sim.profile(game.school).rate*10)/10;return `<article class="campus-card funding-product"><div class="funding-product-top"><span>${item.guard?'✧':'✿'}</span><div><h3>${item.name}</h3><small>${liked?'♥ 他喜欢这件礼物':'心意可以慢慢传达'}</small></div><b>${money(item.cost)}</b></div><button data-buy-gift="${id}" ${game.school.completed||game.school.attributes.money<item.cost?'disabled':''}>${game.school.attributes.money<item.cost?'余额不足':'购买并送给'+C[giftRecipient].name}</button></article>`}).join('')}
function requireSponsor(){return '<div class="school-tip">先在总览里选择本轮唯一的资助对象。</div><button class="campus-secondary" data-funding-tab="总览">去选择资助对象</button>'}

function reservationStore(){const s=game.school,f=s.funding;if(!f.target)return requireSponsor();const days=Array.from({length:Sim.LIMIT},(_,i)=>i).filter(i=>i>=s.day&&Sim.date(i).weekend);return `<div class="funding-exclusive">${av(f.target)}<div><strong>预约和${C[f.target].name}的时间</strong><small>周末晚间额外时段，每天一次。</small></div></div><p class="funding-copy">不占普通约会或打工的日间名额。预约时付费；可以事先取消并全额退还，错过当日预约也会自动退款。</p>${!s.completed&&days.length?`<form class="campus-form" id="fundServiceForm"><label for="fundServiceKind">预约项目<select id="fundServiceKind"><option value="tutoring">一对一补课 · ₩20,000</option><option value="outing">陪伴出游 · ₩30,000</option></select></label><label for="fundServiceDay">选择周末<select id="fundServiceDay">${days.map(day=>`<option value="${day}" ${f.bookings[day]&&['booked','completed'].includes(f.bookings[day].status)?'disabled':''}>${Sim.date(day).label} ${Sim.date(day).weekLabel}${f.bookings[day]&&['booked','completed'].includes(f.bookings[day].status)?' · 已安排':''}</option>`).join('')}</select></label><small>补课可以一起整理学习内容；出游可以留一点时间一起走走。预约不占日间约会或打工时段。</small><button class="campus-primary">付费确认预约</button></form>`:''}<h3>我的预约</h3>${Object.values(f.bookings).sort((a,b)=>a.day-b.day).map(b=>`<article class="campus-card funding-booking"><strong>${Sim.date(b.day).label} · ${Sim.SERVICES[b.kind].name}</strong><p>${C[b.id].name} · 晚间额外时段 · ${money(b.cost)}</p><small>${{booked:'预约已确认',completed:'已赴约',cancelled:'已取消，全额退款',missed:'未赴约，已自动退款'}[b.status]}</small>${b.status==='booked'&&!s.completed?`<div>${b.day===s.day?'<button class="campus-primary" data-fund-attend>现在去赴约</button>':''}<button class="campus-secondary" data-fund-cancel="${b.day}">取消并退费</button></div>`:''}</article>`).join('')||'<p class="funding-copy">还没有预约。</p>'}`}
function fundLedger(){const items=game.school.funding.transactions;return `<h3>每一笔心意，都记在这里。</h3>${items.slice().reverse().map(t=>`<div class="funding-transaction"><span><strong>${escapeHTML(t.text)}</strong><small>${Sim.date(t.day).label}${C[t.id]?' · '+C[t.id].name:''}</small></span><b class="${t.amount>0?'income':''}">${t.amount>0?'+':'−'}${money(Math.abs(t.amount))}</b></div>`).join('')||'<p class="funding-copy">还没有支出或退款记录。</p>'}<p class="funding-copy">这里记录资助、商城和预约的消费及退款。打工、才艺与运动会收入保存在校园成长记录里。</p>`}
function bankruptcyAidNotice(){return '<div class="school-settlement bankruptcy-notice"><strong>余额耗尽，触发破产退学。</strong><p>本轮停止扣款与消费，已保留所有记录。</p><button class="campus-secondary" data-new-round>重开一轮</button></div>'}

const endingBeforeFunding=ending;ending=function(){if(!game.school.bankrupt)return endingBeforeFunding();return schoolBanner()+`<div class="campus-card school-ending semester-expelled"><span class="eyebrow">BALANCE / ENDING</span><h3>余额归零，<br>这一轮暂时停在这里。</h3><p>你已因破产被退学。本轮不再扣款、上课或结算活动，聊天与资助记录都保留。</p><button class="campus-secondary" data-school-settings>查看或导出存档</button><button class="campus-primary" data-new-round>重开一轮</button></div>`};

const ChatFlow=window.CampusDialogue;
function inferLegacyScript(row){for(const [itemId,item] of Object.entries(Sim.GIFTS))if(row.content.includes(item.name))return {kind:'gift',meta:{itemId}};if(row.seed)return {kind:'greeting'};if(row.content.includes('预约确认'))return {kind:'reservation'};if(row.content.includes('资助'))return {kind:row.content.includes('企划资料')?'sponsor':'weekly'};if(row.content.includes('医务室'))return {kind:'help'};if(row.content.includes('领奖台'))return {kind:'sports'};if(row.content.includes('校园祭'))return {kind:'festival'};if(row.content.includes('社')||row.content.includes('读书会')||row.content.includes('炸鸡部'))return {kind:'club'};if(row.content.includes('下次再')||row.content.includes('不太方便')||row.content.includes('去不了'))return {kind:'dateDeclined'};return {kind:'event'}}

ChatFlow.upgrade(game);
const fixedReplyTimers=new Map();
let kktBanner=null,kktBannerTimer=null,notificationDestination='',noticeSerial=0;
function notifyKkt(id,text){if(!C[id])return;if(document.querySelector('.onboard'))return;const previous=kktBanner?.dataset.contact===id?Number(kktBanner.dataset.count||1):0;kktBanner?.remove();clearTimeout(kktBannerTimer);const el=document.createElement('section');el.className='kkt-notification';el.dataset.contact=id;el.dataset.count=String(previous+1);el.setAttribute('role','status');el.innerHTML=`<button class="kkt-notification-open" aria-label="查看${C[id].name}的KKT消息">${av(id)}<span><small>KKT${previous?' · '+(previous+1)+'条新消息':''}</small><strong>${C[id].name}</strong><span>${escapeHTML(text)}</span></span></button><button class="kkt-notification-dismiss" aria-label="关闭消息通知">×</button>`;screen.append(el);kktBanner=el;el.querySelector('.kkt-notification-dismiss').onclick=()=>dismissKktNotice();el.querySelector('.kkt-notification-open').onclick=()=>{dismissKktNotice();if(locked){notificationDestination=id;toast('解锁后查看这条消息');return}openNotificationChat(id)};kktBannerTimer=setTimeout(()=>{if(kktBanner===el)dismissKktNotice()},6500)}

new MutationObserver(()=>{if(!locked&&game.needsFirstUnlock){delete game.needsFirstUnlock;saveCampus()}if(notificationDestination&&!locked){const id=notificationDestination;notificationDestination='';openNotificationChat(id)}}).observe(screen,{attributes:true,attributeFilter:['class']});
function receiveScripted(id,text,kind='event',meta={},token=null){const row=window.CampusDialogue.appendFixed(game,id,text,kind,meta,token);if(row&&window.__campusMessagingReady){notifyKkt(id,text);if(current==='kakao'&&activeContact===id)queueMicrotask(()=>paintChat(id))}return row}

function signed(n){return n===0?'±0':n>0?'+'+n:'−'+Math.abs(n)}

const paintBeforeChoices=paintChat;
paintChat=function(id){paintBeforeChoices(id);if(current!=='kakao'||activeContact!==id||!$('#campusCompose'))return;$('#fixedReplyPanel')?.remove();const f=ChatFlow.head(game,id),busy=sending.has(id);$('#campusInput').disabled=!!f||busy;$('#campusInput').placeholder=f?'请先完成这段对话…':'发送消息…';$('#campusSend').disabled=!!f||busy;if(!f)return;const panel=document.createElement('section');panel.className='fixed-reply-panel';panel.id='fixedReplyPanel';panel.setAttribute('aria-label','剧情回复选项');if(f.phase==='male'){panel.innerHTML='<header><span>'+C[id].name+' 正在回复…</span></header>';$('#campusTyping').textContent=C[id].name+' 正在输入…';$('#campusSend').textContent='等待';scheduleFixedClosing(id)}else{const row=game.chats[id].find(m=>m.choiceId===f.key),count=game.dialogue.pending[id].length;panel.innerHTML=`<header><span>回复${C[id].name}</span><small>${f.kind==='romance'?'第 '+((f.meta.round||0)+1)+' / 3 轮':count>1?'还有 '+count+' 条待回复':'选择回复后，等他把话说完'}</small></header><p>${escapeHTML(row?.content||f.preview)}</p><div>${f.options.map((option,index)=>`<button data-fixed-contact="${id}" data-fixed-key="${f.key}" data-fixed-index="${index}" ${busy?'disabled':''}>${escapeHTML(option)}</button>`).join('')}</div>`;}$('#campusCompose').before(panel);const error=$('#campusChatError');if(error&&chatErrors[id])error.innerHTML='';}

app.addEventListener('click',e=>{const b=e.target.closest('[data-fixed-key]');if(!b)return;const id=b.dataset.fixedContact;if(sending.has(id)||ChatFlow.head(game,id)?.phase!=='player')return;try{if(typeof applyFixedChoice==='function')applyFixedChoice(ChatFlow.head(game,id),id,Number(b.dataset.fixedIndex));ChatFlow.reply(game,id,b.dataset.fixedKey,Number(b.dataset.fixedIndex));saveCampus();paintChat(id);scheduleFixedClosing(id)}catch(error){toast(error.message)}});

function scheduleFixedClosing(id){const f=ChatFlow.head(game,id);if(!f||f.phase!=='male'||fixedReplyTimers.get(id)?.key===f.key)return;const key=f.key;const timer=setTimeout(()=>{fixedReplyTimers.delete(id);if(ChatFlow.head(game,id)?.key!==key||ChatFlow.head(game,id)?.phase!=='male')return;const row=ChatFlow.completeReply(game,id,key);window.CampusStories.pause(game,id);saveCampus();notifyKkt(id,row.content);if(current==='kakao'&&activeContact===id)paintChat(id);if(typeof refreshFestivalPlanning==='function')refreshFestivalPlanning();const next=ChatFlow.head(game,id);if(next?.phase==='male')scheduleFixedClosing(id)},900);fixedReplyTimers.set(id,{key,timer})}

festivalPage=function(){const s=game.school,p=s.festivalPlan,r=s.festival;if(r){const activity=r.activity||({'舞台演出':'罗密欧与朱丽叶','摄影摊位':'性转咖啡厅','校园小吃':'炒年糕店铺'})[r.stall]||'性转咖啡厅';return `<div class="semester-event-heading"><span class="eyebrow">SCHOOL FESTIVAL / OUR STORY</span><h3>${r.id?C[r.id].name+'和你一起留下的这一天':'属于你自己的校园祭'}</h3></div><div class="campus-card"><p class="festival-story-text">${escapeHTML(ProactiveStories.festivalScene(r.id,activity))}</p></div><div class="school-settlement">${r.id?C[r.id].name+'：'+relationText(r.gains):'你独立完成了活动策划。'}</div>`}
 const heading=`<div class="semester-event-heading"><span class="eyebrow">9.25 / FESTIVAL PLANNING</span><h3>想和谁，<br>一起把这一天准备好。</h3><p>三项活动选一项，再向一位同学发出KKT邀请。收到答复、确定搭档后，完成策划并留下校园祭剧情。</p></div>`;
 if(p&&['ready','sponsor-choice'].includes(p.status)){const waiting=festivalConversationPending();return heading+`<div class="campus-card"><h3>${p.activity}</h3><p>当前搭档：${C[p.selectedId].name}</p><p>${p.status==='sponsor-choice'?C[p.sponsorId].name+'也想和你一起策划，请先到KKT做出回应。':p.sponsorDecision===true?'搭档已调整，已经向原同学发去道歉。':'搭档已确认，准备的事情可以一起分担。'}</p><button class="campus-secondary" data-school-chat="${p.status==='sponsor-choice'?p.sponsorId:p.selectedId}">去KKT确认</button></div><button class="campus-primary" data-complete-festival ${p.status!=='ready'||waiting?'disabled':''}>${waiting?'先完成KKT里的准备对话':'完成策划并开始校园祭'}</button>`}

 app.innerHTML=`<header class="campus-top"><button data-forum-back>‹ 论坛</button><h2>校园帖子</h2><span></span></header><div class="campus-body forum-thread">${postCard(p,true)}<section class="forum-comments" aria-label="帖子回复">${forumCommentsHtml(p)}</section>${forumJobStatus(p)}<form class="campus-form forum-compose" id="commentForm"><label for="commentText">${parent?'回复 @'+escapeHTML(parent.author):'参与讨论'}</label>${parent?`<div class="forum-quoted">${escapeHTML(parent.text.slice(0,160))}<button type="button" id="cancelForumReply">取消回复</button></div>`:''}<textarea id="commentText" required maxlength="500" placeholder="自由写下你的回复…"></textarea><button class="campus-primary">发表回复</button></form></div>`;

newForumPost=function(){requireNickname(()=>{
 activeForumPost='';forumReplyTarget=null;
 app.innerHTML=`<header class="campus-top"><button data-forum-back>‹ 返回</button><h2>写下校园日常</h2><span></span></header><div class="campus-body"><form class="campus-form" id="postForm"><label for="postTag">分区</label><select id="postTag"><option>校园日常</option><option>失物招领</option><option>兴趣小组</option><option>学习交流</option><option>校园树洞</option></select><label for="postTitle">标题</label><input id="postTitle" required maxlength="60" placeholder="想聊些什么？"><label for="postBody">正文</label><textarea id="postBody" required maxlength="2000" placeholder="自由写下今天的故事、问题或想法…"></textarea><small>以 ${escapeHTML(game.nickname)} 的身份发布。</small><button class="campus-primary">发布帖子</button></form></div>`;

function repaintForumThread(postId){if(current!=='school'||activeForumPost!==postId||!$('#commentForm'))return;const text=$('#commentText')?.value||'',parent=forumReplyTarget,body=$('.forum-thread'),scroll=body?.scrollTop||0;showPost(postId);forumReplyTarget=parent;$('#commentText').value=text;if($('.forum-thread'))$('.forum-thread').scrollTop=scroll}
async function queueForumReplies(post,row,replyToAuthor=''){
 const rootGame=game,state=Forum.hydrate(game),key=post.id+'-'+(row?.id||'post');if(state.jobs[key]||forumInFlight.has(key))return;
 const requested=Forum.writers(post,row?{...row,replyToAuthor}:null),data=Forum.requestData(game,post,row,requested),job={id:key,postId:post.id,parentId:row?.id||null,status:'pending',at:Date.now()};state.jobs[key]=job;forumInFlight.set(key,true);saveCampus();repaintForumThread(post.id);
 try{
  const result=await Delivery.withOneRetry(async()=>{
   if(!campusToken)await initializeApi();if(!campusToken)throw Error('暂时无法连接。');
   const response=await campusApiFetch('/api/forum',{method:'POST',headers:window.CampusApiPreferences.chatHeaders({'Content-Type':'application/json','x-phone-token':campusToken}),body:JSON.stringify(data),signal:AbortSignal.timeout(35000)});
   let body;try{body=await response.json()}catch{throw Error('这次没有收到同学回复。')}
   if(!response.ok){if(response.status===403)campusToken='';throw Error(body.error||'这次没有收到同学回复。')}
   if(!Array.isArray(body.replies)||!body.replies.length||body.replies.some(r=>!requested.includes(r.author)||typeof r.text!=='string'||!r.text.trim()||r.text.length>600))throw Error('这次同学的回复暂时没有整理好。');return body;
  });
  if(game!==rootGame||job.status!=='pending')return;
  for(let i=0;i<result.replies.length;i++){const reply=result.replies[i],id='ai-'+key+'-'+i;if(Forum.comments(game,post).some(c=>c.id===id))continue;(game.comments[post.id]||=[]).push({id,author:reply.author,text:reply.text,parentId:row?.id||null,at:Date.now()+i,generated:true})}job.status='done';
 }catch{if(game===rootGame)job.status='failed'}finally{forumInFlight.delete(key);if(game===rootGame){saveCampus();repaintForumThread(post.id)}}
}

 settingsBeforePersonalApi();const card=$('#apiStatusText')?.closest('.campus-card');if(!card)return;

</script><script>(() => {
  const root=document.documentElement,screen=document.getElementById('screen');
  if(!screen)return;
  let pending=0;
  const set=(el,name,value)=>{if(el.style.getPropertyValue(name)!==value)el.style.setProperty(name,value)};
  function sync(){
    pending=0;
    const view=window.visualViewport,unscaled=!view||Math.abs(view.scale-1)<.05;
    const height=Math.max(1,unscaled&&view?view.height:window.innerHeight);
    const top=unscaled&&view?Math.max(0,view.offsetTop):0;
    set(root,'--viewport-h',height.toFixed(2)+'px');
    set(root,'--viewport-top',top.toFixed(2)+'px');
    const rect=screen.getBoundingClientRect();
    if(rect.width>0)set(screen,'--phone-u',(rect.width/100).toFixed(5)+'px');
    if(rect.height>0)set(screen,'--phone-v',(rect.height/100).toFixed(5)+'px');
  }
  function schedule(){if(!pending)pending=requestAnimationFrame(sync)}
  sync();
  if(window.ResizeObserver)new ResizeObserver(schedule).observe(screen);
  window.addEventListener('resize',schedule,{passive:true});
  window.addEventListener('orientationchange',schedule,{passive:true});
  window.visualViewport?.addEventListener('resize',schedule,{passive:true});
  window.visualViewport?.addEventListener('scroll',schedule,{passive:true});
  document.addEventListener('focusin',schedule);
  document.addEventListener('focusout',schedule);
})();
</script></body></html>
