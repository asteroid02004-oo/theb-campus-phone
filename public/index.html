 const validKey=key=>typeof key==='string'&&/^[\x21-\x7E]{8,2048}$/.test(key);
 function connection(value={}){

   const maxOutputTokens=Number(value.maxOutputTokens??base.maxOutputTokens);if(!Number.isInteger(maxOutputTokens)||maxOutputTokens<128||maxOutputTokens>8192)throw Error('回复 token 上限请填写 128 到 8192 之间的整数。');
   return {provider,protocol,model,baseUrl,maxOutputTokens};
 }
 let choice={chosen:false,mode:'default'},persistent=true;

 function save(next){choice=next;persistent=true;try{localStorage.setItem(STORAGE,JSON.stringify(next))}catch{persistent=false;if(next.mode==='default')try{localStorage.removeItem(STORAGE)}catch{}}return {mode:choice.mode,persistent}}
 window.CampusApiPreferences=Object.freeze({
   chosen:()=>choice.chosen,mode:()=>choice.mode,hasPersonalKey:()=>choice.mode==='personal'&&validKey(choice.key),persistent:()=>persistent,

<script>
'use strict';
// 后续的聊天、相册及人物内容可在对应渲染函数中扩充。此版本不预置故事内容。
const PASSCODE='230108';
const $=s=>document.querySelector(s),app=$('#app'),screen=$('#screen');
let locked=true,pin='',pinBusy=false,current='',tab='',notes=[],photos=[],selectedDate=new Date(),month=new Date(new Date().getFullYear(),new Date().getMonth(),1),dial='',stopwatchStart=0,stopwatchElapsed=0,stopwatchRunning=false,timerEnd=0,timerRemaining=0,timerRunning=false,toastTimer,clockInterval,chatData={messages:[],kakao:[]},chatRecipient={messages:'',kakao:''};
try{notes=JSON.parse(localStorage.getItem('deobi-campus-notes-v1')||'[]');if(!Array.isArray(notes))notes=[]}catch{notes=[]}
const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(t){$('#toast').textContent=t;$('#toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').hidden=true,2400)}
function timeString(d){return d.getHours()+':'+String(d.getMinutes()).padStart(2,'0')}
function updateTime(){const d=new Date();$('#statusTime').textContent=timeString(d);document.querySelectorAll('[data-live-time]').forEach(el=>{el.textContent=new Intl.DateTimeFormat('zh-CN',{hour:'2-digit',minute:'2-digit',hour12:false,timeZone:el.dataset.liveTime||undefined}).format(d)});if(timerRunning&&Date.now()>=timerEnd){timerRunning=false;timerRemaining=0;toast('计时结束');if(current==='clock'&&tab==='计时器')renderClock(tab)}}
updateTime();setInterval(updateTime,1000);document.addEventListener('visibilitychange',updateTime);
const letters=['','','ABC','DEF','GHI','JKL','MNO','PQRS','TUV','WXYZ'];
$('#keypad').innerHTML=[1,2,3,4,5,6,7,8,9,'',0,''].map(n=>n===''?'<span></span>':`<button class="key ${n==='删除'?'utility':''}" data-pin="${n}" aria-label="${n}">${n}${typeof n==='number'?`<small>${letters[n]}</small>`:''}</button>`).join('');
function updateDots(){[...$('#dots').children].forEach((el,i)=>el.classList.toggle('on',i<pin.length));$('#dots').setAttribute('aria-label',`已输入${pin.length}位密码`);$('#lockCancel').textContent=pin.length?'删除':'取消'}
function inputPin(n){if(!locked||pinBusy)return;if(n==='删除'){pin=pin.slice(0,-1);updateDots();return}if(!/^\d$/.test(n))return;pin+=n;updateDots();if(pin.length===PASSCODE.length){pinBusy=true;setTimeout(()=>{if(pin===PASSCODE){locked=false;screen.classList.remove('is-locked');$('#lock').classList.add('unlocked');$('#lock').inert=true;$('#home').inert=false;$('#pinMessage').textContent='';setTimeout(()=>{if(!locked)$('#lock').hidden=true},350);$('#homeButton').focus()}else{$('#pinMessage').textContent='密码不正确，请重试';$('#dots').classList.add('shake');setTimeout(()=>$('#dots').classList.remove('shake'),350)}pin='';pinBusy=false;updateDots()},180)}}
$('#lockCancel').onclick=()=>{if(pinBusy)return;pin=pin.slice(0,-1);updateDots()};
$('#keypad').onclick=e=>{const b=e.target.closest('[data-pin]');if(b)inputPin(b.dataset.pin)};
document.addEventListener('keydown',e=>{if(locked&&/^\d$/.test(e.key)){e.preventDefault();inputPin(e.key)}else if(locked&&e.key==='Backspace'){e.preventDefault();inputPin('删除')}else if(e.key==='Escape'){document.querySelectorAll('.sheet,.photo-view,.ig-story-view').forEach(x=>x.remove());goHome()}});
function goHome(){if(locked)return;app.inert=false;clearInterval(clockInterval);app.hidden=true;app.innerHTML='';current='';screen.className='screen';$('#home').inert=false;document.querySelectorAll('.sheet,.photo-view,.ig-story-view').forEach(x=>x.remove())}
function lockPhone(){goHome();locked=true;pin='';pinBusy=false;updateDots();$('#home').inert=true;$('#lock').hidden=false;$('#lock').inert=false;$('#lock').classList.remove('unlocked');screen.classList.add('is-locked');$('#pinMessage').textContent='';$('#keypad button').focus()}
$('#homeButton').onclick=goHome;$('#homeButton').ondblclick=()=>{if(!current&&!locked)lockPhone()};$('#lockToggle').onclick=lockPhone;

// Birthdays repeat on the same month/day; dated trips use a specific year.
const CALENDAR_EVENTS=[];
function calendarEvents(date){return CALENDAR_EVENTS.filter(e=>e.month===date.getMonth()+1&&e.day===date.getDate()&&(!e.year||e.year===date.getFullYear()))}
function renderCalendar(){
 const today=new Date(),year=month.getFullYear(),m=month.getMonth(),offset=(new Date(year,m,1).getDay()+6)%7,count=new Date(year,m+1,0).getDate(),events=calendarEvents(selectedDate);
 const iso=selectedDate.getFullYear()+'-'+String(selectedDate.getMonth()+1).padStart(2,'0')+'-'+String(selectedDate.getDate()).padStart(2,'0');
 app.innerHTML=header('日历','<button class="action" id="today">今天</button>')+`<div class="scroll"><div class="month-head"><button id="prevMonth" aria-label="上个月">‹</button><strong>${year}年 ${m+1}月</strong><button id="nextMonth" aria-label="下个月">›</button></div><label class="calendar-jump">前往日期<input type="date" id="calendarJump" aria-label="前往日期" value="${iso}"></label><div class="week">${['一','二','三','四','五','六','日'].map(x=>`<span>${x}</span>`).join('')}</div><div class="monthgrid">${'<span></span>'.repeat(offset)}${Array.from({length:count},(_,i)=>{
 const d=i+1,date=new Date(year,m,d),s=date.toDateString(),entries=calendarEvents(date);
 return `<button data-day="${d}" aria-label="${m+1}月${d}日${entries.length?'，'+entries.map(e=>e.title).join('，'):''}" class="day ${s===today.toDateString()?'today':''} ${s===selectedDate.toDateString()?'chosen':''}">${d}${entries.length?'<i class="event-dot"></i>':''}</button>`;
 }).join('')}</div><div class="agenda"><strong>${selectedDate.toLocaleDateString('zh-CN',{month:'long',day:'numeric',weekday:'long'})}</strong>${events.length?`<div class="calendar-event-list">${events.map(e=>`<article class="calendar-event" style="--event-color:${e.color||'#5084f5'}"><span>全天</span><div><strong>${escapeHTML(e.title)}</strong><small>${escapeHTML(e.type||'日程')}</small></div></article>`).join('')}</div>`:empty('▦','没有日程','这一天还没有安排')}</div></div>`;
 const changeMonth=delta=>{month=new Date(year,m+delta,1);selectedDate=new Date(month.getFullYear(),month.getMonth(),Math.min(selectedDate.getDate(),new Date(month.getFullYear(),month.getMonth()+1,0).getDate()));renderCalendar()};
 $('#prevMonth').onclick=()=>changeMonth(-1);$('#nextMonth').onclick=()=>changeMonth(1);
 $('#today').onclick=()=>{selectedDate=new Date();month=new Date(today.getFullYear(),today.getMonth(),1);renderCalendar()};
 $('#calendarJump').onchange=e=>{const [y,mo,d]=e.target.value.split('-').map(Number);if(!y||!mo||!d)return;selectedDate=new Date(y,mo-1,d);month=new Date(y,mo-1,1);renderCalendar()};
 app.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{selectedDate=new Date(year,m,Number(b.dataset.day));renderCalendar()});
}

function saveNotes(){try{localStorage.setItem('deobi-campus-notes-v1',JSON.stringify(notes))}catch{toast('浏览器无法保存，本次内容仅保留在当前页面')}}
function renderNotes(){app.innerHTML=header('备忘录','<button class="action" id="newNote" aria-label="新建备忘录">＋</button>')+`<div class="scroll"><input id="noteSearch" class="search" placeholder="搜索" aria-label="搜索备忘录"><div id="noteList"></div></div><div style="text-align:center;padding:15px;font-size:11px;color:#92928d">${notes.length} 则备忘录</div>`;$('#newNote').onclick=()=>{const note={id:Date.now(),text:'',date:new Date().toLocaleDateString('zh-CN')};notes.unshift(note);editNote(note.id)};$('#noteSearch').oninput=()=>noteList($('#noteSearch').value);noteList('')}

function renderClock(t='世界时钟'){clearInterval(clockInterval);tab=t;app.className='app dark';screen.className='screen app-dark';app.innerHTML=header(t)+`<div class="scroll" id="clockContent"></div>`+tabs([['世界时钟','◎'],['闹钟','◷'],['秒表','◴'],['计时器','◶']],t);const content=$('#clockContent');if(t==='世界时钟'){content.innerHTML=[['本地时间',''],['首尔','Asia/Seoul'],['巴黎','Europe/Paris'],['伦敦','Europe/London'],['纽约','America/New_York']].map(([n,z])=>`<div class="clock-row"><div><small>${n==='本地时间'?'跟随系统':'世界时间'}</small>${n}</div><strong data-live-time="${z}"></strong></div>`).join('');updateTime()}if(t==='闹钟')content.innerHTML=empty('◷','没有闹钟','闹钟内容即将加入');if(t==='秒表'){content.innerHTML='<div class="clock-big" id="watchValue"></div><div class="round-actions"><button id="watchReset">复位</button><button class="go" id="watchToggle"></button></div>';const refresh=()=>{$('#watchValue').textContent=formatDuration(stopwatchElapsed+(stopwatchRunning?Date.now()-stopwatchStart:0),true);$('#watchToggle').textContent=stopwatchRunning?'停止':'启动';$('#watchToggle').className=stopwatchRunning?'stop':'go'};refresh();clockInterval=setInterval(refresh,40);$('#watchReset').onclick=()=>{stopwatchElapsed=0;stopwatchStart=Date.now();refresh()};$('#watchToggle').onclick=()=>{if(stopwatchRunning)stopwatchElapsed+=Date.now()-stopwatchStart;else stopwatchStart=Date.now();stopwatchRunning=!stopwatchRunning;refresh()}}if(t==='计时器'){content.innerHTML=`<div class="clock-big" id="timerValue"></div><div class="timer-inputs"><input id="timerMinutes" type="number" min="0" max="999" value="5" aria-label="分钟">分<input id="timerSeconds" type="number" min="0" max="59" value="0" aria-label="秒">秒</div><div class="round-actions"><button id="timerCancel">取消</button><button class="go" id="timerToggle">${timerRunning?'暂停':timerRemaining?'继续':'开始'}</button></div>`;const refresh=()=>{if($('#timerValue'))$('#timerValue').textContent=formatDuration(timerRunning?Math.max(0,timerEnd-Date.now()):timerRemaining||300000)};refresh();clockInterval=setInterval(refresh,200);$('#timerToggle').onclick=()=>{if(timerRunning){timerRemaining=Math.max(0,timerEnd-Date.now());timerRunning=false}else{const ms=timerRemaining||(Math.max(0,Math.min(999,Number($('#timerMinutes').value)||0))*60+Math.max(0,Math.min(59,Number($('#timerSeconds').value)||0)))*1000;if(ms<=0){toast('请设置计时时长');return}timerEnd=Date.now()+ms;timerRunning=true;timerRemaining=ms}renderClock(t)};$('#timerCancel').onclick=()=>{timerRunning=false;timerRemaining=0;renderClock(t)}}}
function formatDuration(ms,hundredths=false){const total=Math.floor(ms/1000),min=Math.floor(total/60),sec=total%60;return String(min).padStart(2,'0')+':'+String(sec).padStart(2,'0')+(hundredths?'.'+String(Math.floor(ms%1000/10)).padStart(2,'0'):'')}

<script>window.CampusSim=(()=>{const IDS=['jae','ju','young','sun','q'];
const SUBJECTS=['数学','语文','美术','音乐','科学','体育'];
const SPECIAL=['美术','音乐','科学','体育'];
const CLUBS={anime:{name:'动漫社',members:['sun','young']},dance:{name:'舞蹈社',members:['q']},reading:{name:'读书会',members:['ju']},chicken:{name:'炸鸡部',members:['jae']}};
const LIMIT=45;
const SPECIAL_DAYS={sports:11,exam:22,festival:24,final:44};
const FESTIVAL_ACTIVITIES=['性转咖啡厅','罗密欧与朱丽叶','炒年糕店铺'];
const CHARACTER_NAMES={jae:'李贤在',ju:'李柱延',young:'金泳勋',sun:'金善旴',q:'池昌民'};
const PROFILES={heiress:{name:'财阀大小姐',money:5000000,affection:0,guard:40,rate:.6,job:'家族企业实践',pay:400000},president:{name:'学生会会长',money:1500000,affection:10,guard:30,rate:1,job:'家教兼职',pay:200000},ordinary:{name:'普通学生',money:1200000,affection:20,guard:10,rate:1,job:'咖啡店兼职',pay:120000}};
const CHARACTER_GRADES={jae:3,ju:2,young:3,sun:1,q:2};
const round=n=>Math.round(n*10)/10;
const FIRST_FEE=30000;
const WEEKLY_FEE=100000;
const GIFTS={flowers:{name:'小花束',cost:8000,affection:2,guard:0,likes:['q']},book:{name:'文学小说',cost:12000,affection:3,guard:0,likes:['ju']},comic:{name:'漫画单行本',cost:15000,affection:3,guard:0,likes:['sun','young']},dog:{name:'小狗零食礼包',cost:18000,affection:4,guard:0,likes:['ju','young','q']},chicken:{name:'炸鸡分享券',cost:20000,affection:4,guard:0,likes:['jae']},movie:{name:'电影票',cost:25000,affection:5,guard:0,likes:['q']},headphones:{name:'无线运动耳机',cost:80000,affection:9,guard:2,likes:['sun','q']},camera:{name:'拍立得相机',cost:120000,affection:12,guard:4,likes:['q']},collector:{name:'文学典藏书套装',cost:180000,affection:15,guard:6,likes:['ju']},sneakers:{name:'专业运动鞋',cost:200000,affection:17,guard:7,likes:['jae']},telescope:{name:'天文望远镜',cost:220000,affection:18,guard:8,likes:['young']},console:{name:'便携游戏机',cost:250000,affection:20,guard:10,likes:['sun']}};
const SUPPORT_ITEMS={supplies:{name:'学习用品补给',cost:10000,affection:3,guard:0},meals:{name:'一周餐食补给',cost:15000,affection:4,guard:0},commute:{name:'交通补贴',cost:20000,affection:5,guard:0},clubKit:{name:'社团活动物资',cost:30000,affection:6,guard:0},equipment:{name:'社团器材升级',cost:80000,affection:9,guard:2}};
const SERVICES={tutoring:{name:'一对一补课',cost:20000,affection:4,guard:1},outing:{name:'陪伴出游',cost:30000,affection:6,guard:2}};
function emptyFunding(){return {target:null,paidWeeks:{},bookings:{},transactions:[],outbox:[],delivered:0}}
function hydrateFunding(s){s.funding||=emptyFunding();s.bankrupt??=false;if(s.configured&&s.identity==='ordinary'&&s.baseline.money===100000){if(!s.completed&&!s.bankrupt)s.attributes.money+=1100000;s.baseline.money=1200000}s.economyVersion=2;s.festivalPlan??=null;s.finalResult??=null;if(s.day===44&&s.completed&&!s.expelled&&!s.finalResult)s.finalResult=calculateFinal(s);return s}
const clamp=(n,min=0,max=100)=>Math.max(min,Math.min(max,n));
function create(options={}){const identity=options.identity||'ordinary',p=PROFILES[identity];if(!p)throw Error('请选择有效身份');return {version:2,day:0,grade:options.grade||'高二',identity,configured:options.configured!==false,baseline:{money:p.money,affection:p.affection,guard:p.guard,rate:p.rate},plan:['数学','语文','美术','体育'],settlements:{},clubVisits:{},dateAttempts:{},weekendActivities:{},chatRewards:{},attendance:Object.fromEntries(SUBJECTS.map(x=>[x,0])),sports:null,exam:null,festival:null,expelled:false,bankrupt:false,funding:emptyFunding(),attributes:{knowledge:0,logic:0,eq:0,talent:0,fame:0,money:p.money,specialtyCount:0,totalClasses:0},relations:Object.fromEntries(IDS.map(id=>[id,{affection:p.affection,guard:p.guard,bond:0}])),history:[],generatedPosts:[],completed:false}}
function validate(s){
 if(!s||![1,2].includes(s.version)||!Number.isInteger(s.day)||s.day<0||s.day>=LIMIT||!['高一','高二','高三'].includes(s.grade)||!Array.isArray(s.plan)||s.plan.length!==4||s.plan.some(x=>!SUBJECTS.includes(x))||typeof s.completed!=='boolean')throw Error('校历存档格式不正确');
 for(const k of ['knowledge','logic','eq','talent','fame','money','specialtyCount','totalClasses'])if(!Number.isFinite(s.attributes?.[k])||s.attributes[k]<0||s.attributes[k]>100000000)throw Error('属性存档格式不正确');
 for(const k of ['logic','eq','talent'])if(s.attributes[k]>100)throw Error('属性超出范围');
 for(const id of IDS){const r=s.relations?.[id];if(!r||!Number.isFinite(r.affection)||!Number.isFinite(r.guard)||r.affection<0||r.affection>100||r.guard<0||r.guard>100||!Number.isInteger(r.bond)||r.bond<0)throw Error('关系存档格式不正确')}
 for(const k of ['settlements','clubVisits','dateAttempts','chatRewards'])if(!s[k]||typeof s[k]!=='object'||Array.isArray(s[k]))throw Error('日程存档格式不正确');
 for(const [day,r] of Object.entries(s.settlements))if(!/^\d+$/.test(day)||Number(day)>s.day||Number(day)%7>=5||r?.day!==Number(day)||!Array.isArray(r.plan)||r.plan.length!==4||r.plan.some(x=>!SUBJECTS.includes(x))||!r.gains||!['knowledge','logic','eq','talent','fame','money'].every(k=>Number.isFinite(r.gains[k])&&r.gains[k]>=0))throw Error('课程结算记录不正确');
 for(const [day,r] of Object.entries(s.clubVisits))if(!/^\d+$/.test(day)||Number(day)>s.day||Number(day)%7!==2||r?.day!==Number(day)||!Object.hasOwn(CLUBS,r.id)||!r.gains)throw Error('俱乐部记录不正确');
 for(const [day,r] of Object.entries(s.dateAttempts))if(!/^\d+$/.test(day)||Number(day)>s.day||Number(day)%7<5||r?.day!==Number(day)||!IDS.includes(r.id)||!['咖啡店','电影院','公园'].includes(r.place)||typeof r.accepted!=='boolean'||!Number.isFinite(r.chance)||r.chance<0||r.chance>1)throw Error('约会记录不正确');
 if(!Array.isArray(s.history)||s.history.length>2000||!Array.isArray(s.generatedPosts)||s.generatedPosts.length>400||s.generatedPosts.some(p=>typeof p.id!=='string'||!/^(?:p-campus-\d+-\d+|sauthored-\d{2}|sdoc-\d{2})$/.test(p.id)||!['title','body','author','tag'].every(k=>typeof p[k]==='string')||!Array.isArray(p.comments)))throw Error('校园记录格式不正确');
 if(s.history.some(h=>!h||!Number.isInteger(h.day)||h.day<0||h.day>s.day||typeof h.text!=='string'||!['classes','club','date','chat','ending','work','sports','help','exam','festival','enrollment','sponsor','gift','support','service','weekly','reservation','refund','bankruptcy','final'].includes(h.type)))throw Error('校园经历格式不正确');
 if(s.funding){const f=s.funding;if(f.target!==null&&!IDS.includes(f.target)||!f.paidWeeks||!f.bookings||!Array.isArray(f.transactions)||!Array.isArray(f.outbox)||!Number.isInteger(f.delivered)||f.delivered<0||f.delivered>f.outbox.length||f.transactions.some(t=>!Number.isFinite(t.amount)||typeof t.text!=='string')||Object.values(f.bookings).some(b=>!b||!SERVICES[b.kind]||!IDS.includes(b.id)||!Number.isInteger(b.day)||b.day<0||b.day>=45||!['booked','completed','cancelled','missed'].includes(b.status)))throw Error('资助企划存档格式不正确')}
 if(s.version===2){if(!Object.hasOwn(PROFILES,s.identity)||typeof s.configured!=='boolean'||typeof s.expelled!=='boolean'||!s.weekendActivities||!s.baseline||!SUBJECTS.every(x=>Number.isInteger(s.attendance?.[x])&&s.attendance[x]>=0))throw Error('入学资料格式不正确');for(const [day,r] of Object.entries(s.weekendActivities))if(!/^\d+$/.test(day)||Number(day)>s.day||Number(day)%7<5||!['date','work'].includes(r?.type))throw Error('周末记录格式不正确');if(s.sports&&(!s.sports.legacySkipped&&(!Number.isInteger(s.sports.rank)||s.sports.rank<0||s.sports.rank>3||!s.sports.featured||!IDS.includes(s.sports.featured.id)||!['award','injury'].includes(s.sports.featured.type))))throw Error('运动会记录格式不正确');if(s.exam&&(!Number.isFinite(s.exam.score)||typeof s.exam.passed!=='boolean'))throw Error('考试记录格式不正确');if(s.festival&&(!s.festival.skipped&&!IDS.includes(s.festival.id)))throw Error('校园祭记录格式不正确')}
 if(s.festivalPlan){const p=s.festivalPlan;if(!FESTIVAL_ACTIVITIES.includes(p.activity)||!IDS.includes(p.selectedId)||!['refused','sponsor-choice','ready','completed'].includes(p.status)||!p.attempts)throw Error('校园祭策划记录不正确')}if(s.finalResult){const r=s.finalResult;if(!Number.isFinite(r.score)||r.score<0||r.score>750||!Number.isInteger(r.rank)||r.rank<1||!['grind','romance','shine','growth'].includes(r.ending?.id)||r.ending.character&&!IDS.includes(r.ending.character))throw Error('期末结局记录不正确')}
 return s;
}
function migrate(s){if(!s)return create({configured:false});validate(s);if(s.version===2)return hydrateFunding(s);s.version=2;s.identity='ordinary';s.configured=false;s.baseline={money:0,affection:12,guard:52,rate:1};s.weekendActivities=Object.fromEntries(Object.entries(s.dateAttempts).map(([day,r])=>[day,{type:'date',...r}]));s.attendance=Object.fromEntries(SUBJECTS.map(x=>[x,0]));for(const r of Object.values(s.settlements))for(const x of r.plan)s.attendance[x]++;s.expelled=false;s.sports=s.day>SPECIAL_DAYS.sports?{legacySkipped:true}:null;s.exam=s.day>SPECIAL_DAYS.exam?{score:Math.max(450,midtermScore(s)),passed:true,legacyGranted:true}:null;s.festival=s.day>SPECIAL_DAYS.festival?{skipped:true,legacySkipped:true}:null;return hydrateFunding(s)}
function configure(s,identity,grade){if(s.configured)throw Error('入学身份与年级已经确定，开始新故事才能重新选择。');const p=PROFILES[identity];if(!p||!['高一','高二','高三'].includes(grade))throw Error('请选择身份和年级');const old=s.baseline;s.attributes.money=p.money+Math.max(0,s.attributes.money-old.money);for(const r of Object.values(s.relations)){r.affection=round(clamp(p.affection+Math.max(0,r.affection-old.affection)*p.rate/old.rate));r.guard=clamp(p.guard-Math.max(0,old.guard-r.guard))}s.identity=identity;s.grade=grade;s.configured=true;s.baseline={money:p.money,affection:p.affection,guard:p.guard,rate:p.rate};log(s,'enrollment','完成入学登记');return s}

function ensure(game){if(!game.dialogue)game.dialogue={version:1,serial:0,pending:Object.fromEntries(IDS.map(id=>[id,[]])),seen:{},answered:[]};const d=game.dialogue;for(const id of IDS)for(const f of d.pending[id]){f.phase||='player';if(!f.meta)f.meta=game.chats[id].find(m=>m.choiceId===f.key)?.scriptMeta||{}}return d}
function validate(d){if(!d||d.version!==1||!Number.isInteger(d.serial)||d.serial<0||!d.pending||!d.seen||!Array.isArray(d.answered))throw Error('剧情对话存档格式不正确');for(const id of IDS){const q=d.pending[id];if(!Array.isArray(q)||q.length>2000||q.some(f=>!f||typeof f.key!=='string'||typeof f.kind!=='string'||!Array.isArray(f.options)||f.options.length!==2||f.options.some(t=>typeof t!=='string'||!t.trim()||t.length>500)))throw Error('剧情回复选项格式不正确')}return d}
function options(id,kind,meta={}){if(!IDS.includes(id))throw Error('未知联系人');let pair=Stories.options(id,kind,meta)||(kind==='gift'?GIFT_REPLIES[id]?.[meta.itemId]:kind==='dateAccepted'?DATE_ACCEPTED[id]:kind==='dateDeclined'?DATE_DECLINED[id]:kind==='service'&&meta.kind==='tutoring'?['今天讲的题我会再做一遍，谢谢你耐心讲给我听。','刚才没想明白的地方现在清楚多了，我会好好复习。']:GENERIC[kind]||GENERIC.event);if(!pair)throw Error('这份礼物还没有配置回复');return pair.slice()}
function head(game,id){return ensure(game).pending[id]?.[0]||null}
function locked(game,id){return !!head(game,id)}
function attach(game,id,row,kind,meta={}){const d=ensure(game),key='fixed-'+(++d.serial);row.choiceId=key;row.scriptKind=kind;row.scriptMeta=meta;d.pending[id].push({key,kind,meta,phase:'player',options:options(id,kind,meta),preview:row.content,at:row.at});return row}
function appendFixed(game,id,content,kind='event',meta={},token=null,now=Date.now()){const d=ensure(game);if(!IDS.includes(id))throw Error('未知联系人');if(token&&d.seen[token])return null;const row={role:'assistant',content,at:now,gameDay:game.school?.day||0,event:true};attach(game,id,row,kind,meta);game.chats[id].push(row);if(token)d.seen[token]=row.choiceId;return row}
function reply(game,id,key,index,now=Date.now()){const d=ensure(game),f=head(game,id);if(!f||f.key!==key||f.phase!=='player'||!Number.isInteger(index)||index<0||index>1)throw Error('请先回复当前剧情消息');const row={role:'user',content:f.options[index],at:now,gameDay:game.school?.day||0,fixedReplyTo:key};game.chats[id].push(row);f.phase='male';f.selected=index;f.response=Stories.followup(id,f,index);d.answered.push({id,key,index,at:now});return row}
function completeReply(game,id,key,now=Date.now()){const d=ensure(game),f=head(game,id);if(!f||f.key!==key||f.phase!=='male'||!f.response)throw Error('当前没有待发送的男主回复');const response=f.response;d.pending[id].shift();const row={role:'assistant',content:response.text,at:now,gameDay:game.school?.day||0,event:true,fixedClosingTo:key,terminal:!response.next};game.chats[id].push(row);if(response.next){attach(game,id,row,response.next.kind,response.next.meta);const next=d.pending[id].pop();d.pending[id].unshift(next)}return row}
function cancel(game,id,predicate){const d=ensure(game),removed=[];d.pending[id]=d.pending[id].filter(f=>{if(!predicate(f))return true;removed.push(f.key);const row=game.chats[id].find(m=>m.choiceId===f.key);if(row){row.choiceCancelled=true;row.terminal=true}return false});return removed}
function upgrade(game){const d=ensure(game);if(d.closingVersion===2)return;for(const id of IDS){const last=game.chats[id].at(-1);if(!last?.fixedReplyTo||d.pending[id].some(f=>f.key===last.fixedReplyTo))continue;const original=game.chats[id].find(m=>m.choiceId===last.fixedReplyTo),answer=d.answered.findLast(a=>a.key===last.fixedReplyTo);if(original&&answer){const f={key:original.choiceId,kind:original.scriptKind||'event',meta:original.scriptMeta||{},phase:'male',selected:answer.index,options:options(id,original.scriptKind||'event',original.scriptMeta||{}),preview:original.content};f.response=Stories.followup(id,f,answer.index);d.pending[id].unshift(f)}}d.closingVersion=2}
function dateExchange(game,result,name,now=Date.now()){const d=ensure(game),token='date-'+result.day+'-'+result.id;if(d.seen[token])return null;const texts={jae:result.accepted?`好，今天一起去${result.place}。到的时候告诉我。`:'今天没办法一起去，抱歉。我们改天再约吧。',ju:result.accepted?`好。那今天在${result.place}见。`:'今天不太方便。下次再说，好吗。',young:result.accepted?`好，今天一起去${result.place}。我会准时到。`:'今天不太方便，抱歉。改天再约吧。',sun:result.accepted?`行，${result.place}见。可别让我一个人等啊。`:'今天就先算了吧。下次再说。',q:result.accepted?`你是约我吗？好啊，今天${result.place}见。`:'今天可能去不了，抱歉。下次再一起吧。'};game.chats[result.id].push({role:'user',content:`${name}，今天一起去${result.place}好吗？我想约你见面。`,at:now,gameDay:result.day,dateInvitation:true});return appendFixed(game,result.id,texts[result.id],result.accepted?'dateAccepted':'dateDeclined',{place:result.place},token,now+1)}

,{"speaker":"sun","text":"行，那剩下这些我来整理。总不能什么都让学长做吧？"},{"speaker":"","text":"等最后一本漫画放回书架，窗外已经完全暗了。你拿起书包准备离开，金泳勋顺手关掉柜子的灯，金善旴则快步走到门边，先一步替你拉开了门。"},{"speaker":"young","text":"外面有点冷，你带外套了吗？我记得你今天来的时候好像没穿。"},{"speaker":"sun","text":"学长，这才刚入秋吧？而且她要是冷的话，我可以陪她走快一点啊。"},{"speaker":"young","text":"走快一点就不会冷了吗？"},{"speaker":"sun","text":"……至少比站在这里讨论天气强吧！"},{"speaker":"","text":"你终于忍不住笑出了声。金善旴轻轻哼了一声，伸手拿起你的书包，却被金泳勋平静地提醒：“先问问她需不需要帮忙。”金善旴愣了一下，随即转头看向你，难得认真地开口。"},{"speaker":"sun","text":"那……要不要我帮你拿？反正我也顺路。"},{"speaker":"young","text":"我记得你回家的方向不是那边吧？"},{"speaker":"","text":"金善旴的动作明显停顿了一下。金泳勋看着他，嘴角露出一点几乎察觉不到的笑意。随后，他转向你，语气依旧温和。"},{"speaker":"young","text":"我等一下也要去校门口。要不要一起走？"},{"speaker":"","text":"空气突然安静下来。金善旴看看金泳勋，又看看你，终于忍不住笑了一声。只是这一次，他没有像往常那样立刻接话，而是认真地等待你的回答。"}],"choices":[{"id":"A","text":"善旴不是说顺路吗？那就一起走吧。","pages":[{"speaker":"sun","text":"……听见没，学长？有人邀请我一起走了。那我们先走啦！"},{"speaker":"young","text":"嗯，路上注意安全。善旴，别光顾着聊天，过马路的时候记得看路。"},{"speaker":"","text":"金善旴得意地朝金泳勋挥挥手，快步跟上你的脚步。走出教学楼后，他才放慢速度，偷偷看了你一眼。明明刚才还表现得很开心，此刻却突然安静下来。过了一会儿，他才轻轻开口：“……其实我家真的不在这个方向。不过，今天想陪你走一段。”说完，他又立刻转开视线，假装研究起路边的自动贩卖机。"}]},{"id":"B","text":"那就麻烦泳勋学长陪我走到校门口吧。","pages":[{"speaker":"young","text":"不麻烦。正好我也准备回去了，走吧。"},{"speaker":"sun","text":"……哦，那你们慢慢走。我突然想起来，活动室里还有东西没收拾完。"},{"speaker":"","text":"金善旴转身走回活动室，明明刚才已经检查过的书架，又被他重新整理了一遍。金泳勋站在门口看了他一会儿，没有拆穿，只是轻声提醒他记得锁门。你们走出教学楼后，金泳勋忽然放慢了脚步，像是不经意地开口：“其实……刚刚我也有点担心你会选善旴。”你转头看他，他却只是轻轻笑了笑，重新看向前方。"}]}],"prompt":"活动室即将关门，你准备和谁一起离开？"}],"fixed":{"OLD-GREET-JAE":{"id":"OLD-GREET-JAE","actor":"jae","kind":"greeting","meta":{},"open":"【称呼】，我是李贤在。新学期有需要帮忙的地方，可以来找我。","options":["你好，以后在学校还请多关照。","名字记住了，新学期一起好好过吧。"],"closing":["好，我记住了，会认真放在心上。","嗯，之后也会这样认真对待你。"],"invite":""},"OLD-CLUB-JAE":{"id":"OLD-CLUB-JAE","actor":"jae","kind":"club","meta":{"club":"chicken"},"open":"今天的炸鸡还不错吧？下次你来挑口味。","options":["今天我也玩得很开心，下周有机会再见。","刚才还有些话没聊完，下次再继续。"],"closing":["好，我记住了，会认真放在心上。","嗯，之后也会这样认真对待你。"],"invite":""},"OLD-WORK-JAE":{"id":"OLD-WORK-JAE","actor":"jae","kind":"work","meta":{},"open":"【称呼】，没想到会在这家店遇到你。今 说话莫名会安静下来。"},{"originalAuthor":"floor-10","text":"金泳勋学长看起来不太好接近，但上次借我笔记的时候特别认真。"},{"originalAuthor":"floor-11","text":"金善旴学弟真的很会接话，我每次想好的吐槽都被他提前说了。"},{"originalAuthor":"floor-12","text":"池昌民学长笑起来真的太可爱了，舞蹈社排练我能看一下午。"},{"originalAuthor":"floor-13","text":"建议加一个新选项：谁最容易在喜欢的人面前变得不像自己。"},{"originalAuthor":"floor-14","text":"金善旴吧，嘴越硬越可疑。"},{"originalAuthor":"floor-15","text":"我投李柱延，感觉他认真喜欢一个人的话会很长情。"},{"originalAuthor":"floor-16","text":"我投李贤在，想知道他谈恋爱以后是不是也这么会照顾人。"}],"trigger":"DOC-1"},{"id":"sdoc-02","title":"【磕到了】李贤在和【玩家】是不是有点好磕？","body":"本人本来对校园恋爱传闻没有兴趣。\n但是今天路过炸鸡部，我看到李贤在把最后一块炸鸡留给了【玩家】。\n重点是最后一块！！\n他自己明明很喜欢吃炸鸡。\n【玩家】问他为什么不吃，他说：\n“给你留的啊，我又不是非得今天吃完。”\n然后继续若无其事地整理桌子。\n我当时就站在旁边，差点忘记自己来干什么。","tag":"校园话题","originalAuthor":"匿名用户_118","comments":[{"originalAuthor":"floor-14","text":"可能只是朋友吧，别什么都磕。"},{"originalAuthor":"floor-15","text":"那为什么没有给我留？我上次也在炸鸡部帮忙。"},{"originalAuthor":"floor-16","text":"楼上，你跟他一起策划过活动吗？"},{"originalAuthor":"floor-17","text":"没有。"},{"originalAuthor":"floor-18","text":"那你先去策划一个。"},{"originalAuthor":"floor-19","text":"哈哈哈哈哈哈哈哈。"},{"originalAuthor":"floor-20","text":"我还见过他一边跟其他人说话，一边注意【玩家】有没有吃东西。"},{"originalAuthor":"floor-21","text":"他平时确实很会照顾人，但如果是特别在意的人，应该会更明显吧。"},{"originalAuthor":"floor-22","text":"最可疑的是，他看到【玩家】进门以后，笑得比刚才明显。"},{"originalAuthor":"floor-23","text":"炸鸡部：主营炸鸡，副业观察李贤在的恋爱进度。"},{"originalAuthor":"floor-24","text":"建议直接给炸鸡部增加一个恋爱观察窗口。"},{"originalAuthor":"floor-25","text":"别催，万一人家自己都还没想明白呢。"}],"trigger":"DOC-2"},{"id":"sdoc-03","title":"【表白墙搬运】听说今天有人向李贤在表白，被拒绝了？","body":"今天听说有同学向高三炸鸡部的李贤在表白了。\n据说他没有让对方难堪，而是认真解释了自己的想法，也明确表示自己目前没有办法回应这份感情。\n拒绝之后，他还帮忙把桌上的东西整理好，才回去继续忙炸鸡部的工作。\n我不是来评价谁的，只是觉得他处理得挺体面的。","tag":"校园话题","originalAuthor":"匿名用户_204","comments":[{"originalAuthor":"floor-21","text":"拒绝就是拒绝，温柔不代表还有机会。"},{"originalAuthor":"floor-22","text":"对，不要因为对方脾气好就一直纠缠。"},{"originalAuthor":"floor-23","text":"李贤在看起来确实不像会随便答应表白的人。"},{"originalAuthor":"floor-24","text":"感觉他如果真的喜欢谁，会很认真地把对方放进自己的生活里。"},{"originalAuthor":"floor-25","text":"为什么已经开始替他分析恋爱模式了？"},{"originalAuthor":"floor-26","text":"校园论坛的日常工作。"},{"originalAuthor":"floor-27","text":"我比较好奇，他拒绝之后会不会自己难过。"},{"originalAuthor":"floor-28","text":"也有可能只是觉得遗憾，不一定是难过。"},{"originalAuthor":"floor-29","text":"所以说，大家不要替当事人编故事。"},{"originalAuthor":"floor-30","text":"但我还是想知道，他究竟会喜欢什么样的人。"}],"trigger":"DOC-3"},{"id":"sdoc-04","title":"【读书会情报】听说有人想资助李柱延，结果被一句话噎回去了？","body":"事情是这样的。\n今天读书会结束后，有人开玩笑说要资助李柱延买书，条件是以后必须优先帮自己挑书。\n结果李柱延听完，居然很认真地思考了一会儿，然后说：\n“啊……那不行。如果已经有人资助我了，我就不能背叛对方吧。”\n？？？？？\n本来只是个玩笑，怎么突然变成忠诚契约了哈哈哈哈哈哈！","tag":"校园话题","originalAuthor":"匿名用户_067","comments":[{"originalAuthor":"floor-28","text":"李柱延真的会认真思考这种问题。"},{"originalAuthor":"floor-29","text":"别人开玩笑，他已经开始考虑道德责任了。"},{"originalAuthor":"floor-30","text":"读书会是不是每天都在讨论人生哲学？"},{"originalAuthor":"floor-31","text":"我比较好奇他最近在读什么书。"},{"originalAuthor":"floor-0","text":"听说他会把喜欢的句子记下来，还会写自己的感想。"},{"originalAuthor":"floor-1","text":"这种人如果喜欢一个人，估计也会认真记住对方说过的话。"},{"originalAuthor":"floor-2","text":"楼上怎么从买书跳到恋爱了？"},{"originalAuthor":"floor-3","text":"因为我在读书会门口看见他把一本书递给【玩家】了。"},{"originalAuthor":"floor-4","text":"什么书？"},{"originalAuthor":"floor-5","text":"不知道，但他递过去的时候笑得很温柔。"},{"originalAuthor":"floor-6","text":"求书名！求书名！我真的只是想读书！"},{"originalAuthor":"floor-7","text":"当然，大家都只是想读书。"}],"trigger":"DOC-4"},{"id":"sdoc-05","title":"【求问】金泳勋学长今天怎么不开心？谁惹他了？","body":"今天在图书馆附近看见高三动漫社的金泳勋学长。\n平时他虽然不算特别热情，但至少会笑着打招呼。今天却只是轻轻点了点头，随后一个人坐在靠窗的位置。\n他拿着手机看了很久，也没有怎么翻书。\n后来【玩家】过去坐在他旁边，两个人似乎说了几句话。他的表情才稍微放松了一点。\n有人知道发生什么了吗？","tag":"校园话题","originalAuthor":"匿名用户_156","comments":[{"originalAuthor":"floor-3","text":"可能只是累了吧，最近不是一直在准备校园祭吗？"},{"originalAuthor":"floor-4","text":"他看起来就是那种不开心也不太会主动说的人。"},{"originalAuthor":"floor-5","text":"不一定，他可能只是不想在别人面前表现出来。"},{"originalAuthor":"floor-6","text":"我昨天见他在动漫社整理资料，也挺安静的。"},{"originalAuthor":"floor-7","text":"有没有可能只是遇到了麻烦？"},{"originalAuthor":"floor-8","text":"希望他没事。"},{"originalAuthor":"floor-9","text":"等等，为什么【玩家】过去以后，他就愿意说话了？"},{"originalAuthor":"floor-10","text":"可能是熟悉的朋友吧。"},{"originalAuthor":"floor-11","text":"我不管，我已经开始好奇他们说了什么。"},{"originalAuthor":"floor-12","text":"别打听私人聊天了，给人家留点空间吧。"},{"originalAuthor":"floor-13","text":"说得对。希望他能早点调整好心情。"}],"trigger":"DOC-5"},{"id":"sdoc-06","title":"【818】金善旴和【玩家】到底是什么关系？他是不是喜欢人家？","body":"我真的忍不住了。\n高一动漫社的金善旴，是不是喜欢【玩家】啊？\n每天跟小狗巡逻一样，眼睛恨不得黏在人家身上。\n【玩家】从走廊经过，他抬头。\n【玩家】在教室门口跟别人讲话，他抬头。\n【玩家】去小卖部买东西，他怎么也在小卖部？\n最离谱的是，今天有人问他是不是在等【玩家】。\n他说：“谁等她了？我刚好路过。”\n结果他手里拿着两杯饮料，其中一杯还是【玩家】平时喜欢的口味。\n请问，这个巧合能不能解释一下？","tag":"校园话题","originalAuthor":"匿名用户_089","comments":[{"originalAuthor":"floor-10","text":"哈哈哈哈哈哈哈哈哈哈。"},{"originalAuthor":"floor-11","text":"金善旴嘴硬不是一天两天了。"},{"originalAuthor":"floor-12","text":"有没有可能饮料是买一送一？"},{"originalAuthor":"floor-13","text":"那为什么他自己那杯跟【玩家】那杯不一样？"},{"originalAuthor":"floor-14","text":"？？？？？？？"},{"originalAuthor":"floor-15","text":"我只能说，动漫社最近的活动真的很有意思。"},{"originalAuthor":"floor-16","text":"他平时对别人也会这么关注吗？"},{"originalAuthor":"floor-17","text":"不太会。他对别人通常是先吐槽两句。"},{"originalAuthor":"floor-18","text":"所以说，他是不是喜欢【玩家】？"},{"originalAuthor":"floor-19","text":"不知道，但他记得【玩家】喜欢什么口味，这件事是真的。"},{"originalAuthor":"floor-20","text":"也可能只是朋友之间的记忆力好。"},{"originalAuthor":"floor-21","text":"可以，继续观察，禁止直接去问当事人。"},{"originalAuthor":"floor-22","text":"金善旴：我只是路过。"},{"originalAuthor":"floor-23","text":"【玩家】：那你手里的饮料是什么？"},{"originalAuthor":"floor-24","text":"哈哈哈哈哈哈哈哈哈。"}],"trigger":"DOC-6"},{"id":"sdoc-07","title":"【校园祭预告】今年居然有性转咖啡厅？！","body":"学生会终于公布今年的校园祭活动名单了！\n听说会有性转咖啡厅，可以看到女仆装和执事装，还有限定甜点。\n目前听说有几位同学参与策划：\n高三炸鸡部的李贤在：负责现场统筹，顺便监督大家有没有偷吃。\n高二读书会的李柱延：据说负责菜单文案，还认真研究了饮品名称。\n高三动漫社的金泳勋：参与服装和整体视觉设计。\n高一动漫社的金善旴：负责活动宣传，听说还提出了不少奇怪的互动点子。\n高二舞蹈社的池昌民：负责拍照区和现场表演安排。\n请问工作人员名单什么时候公布？\n我不是为了看帅哥，我只是想支持学校活动。","tag":"校园话题","originalAuthor":"匿名用户_301","comments":[{"originalAuthor":"floor-17","text":"最后一句你自己信吗？"},{"originalAuthor":"floor-18","text":"我想知道谁穿女仆装。"},{"originalAuthor":"floor-19","text":"我想知道谁穿执事装。"},{"originalAuthor":"floor-20","text":"我想知道【玩家】会穿什么。"},{"originalAuthor":"floor-21","text":"楼上才是重点。"},{"originalAuthor":"floor-22","text":"如果李贤在穿女仆装，我一定去。"},{"originalAuthor":"floor-23","text":"如果金泳勋穿女仆装，我也去。"},{"originalAuthor":"floor-24","text":"如果金善旴穿女仆装，他肯定会嘴硬一整天。"},{"originalAuthor":"floor-25","text":"池昌民说不定会主动配合拍照。"},{"originalAuthor":"floor-26","text":"李柱延可能会认真研究怎么把发箍戴好。"},{"originalAuthor":"floor-27","text":"你们怎么已经开始脑补了？"},{"originalAuthor":"floor-28","text":"因为校园祭还没开始，大家只能靠想象活着。"}],"trigger":"DOC-7"},{"id":"sdoc-08","title":"【食堂情报】炒年糕摊位听说是李贤在亲自掌勺？","body":"今年校园祭有现场制作的炒年糕摊位！\n听说李贤在会教大家做炒年糕，而且不是提前做好的那种，是现场从头开始。\n我本来对这个活动没有什么兴趣。\n直到听说【玩家】也会参与。\n现在我只想知道：\n能不能自己选择搭档？\n如果不会做，能不能多学几次？\n如果酱汁太稠了，李贤在会不会亲自帮忙？\n如果我不小心把年糕炒糊了，他会不会笑我？","tag":"校园话题","originalAuthor":"匿名用户_112","comments":[{"originalAuthor":"floor-24","text":"他应该会先救锅，再笑你。"},{"originalAuthor":"floor-25","text":"哈哈哈哈哈哈哈哈。"},{"originalAuthor":"floor-26","text":"李贤在平时看起来很会照顾人，应该会耐心教吧。"},{"originalAuthor":"floor-27","text":"他可能会一边说“不是这样”，一边把木铲拿过去示范。"},{"originalAuthor":"floor-28","text":"重点来了，如果他从后面扶住你的手教你呢？"},{"originalAuthor":"floor-29","text":"楼上已经开始写剧情了。"},{"originalAuthor":"floor-30","text":"如果是【玩家】，我觉得很有可能。"},{"originalAuthor":"floor-31","text":"你们是不是忘记了，摊位后面还有其他工作人员？"},{"originalAuthor":"floor-0","text":"不管怎样，我先去排队。"},{"originalAuthor":"floor-1","text":"希望学校能准备足够的年糕，别让大家为了吃饭变成恋爱侦探。"}],"trigger":"DOC-8"},{"id":"sdoc-09","title":"【舞台剧区】谁懂《罗密欧与朱丽叶》的选角？！","body":"校园祭音乐剧《罗密欧与朱丽叶》开始排练了！\n听说【玩家】会出演朱丽叶，男主角则由一位学长担任。\n目前最受关注的就是最后那场借位吻戏。\n我今天路过礼堂，刚好看见两个人在确认走位。\n虽然没听清他们说了什么，但感觉气氛真的很好。","tag":"校园话题","originalAuthor":"匿名用户_225","comments":[{"originalAuthor":"floor-31","text":"请问男主角是谁？"},{"originalAuthor":"floor-0","text":"目前有好几个版本的传闻。"},{"originalAuthor":"floor-1","text":"有人说是李贤在，感觉他很适合演罗密欧。"},{"originalAuthor":"floor-2","text":"也有人说是李柱延，他的声音很适合念台词。"},{"originalAuthor":"floor-3","text":"金泳勋也很适合，清冷气质跟罗密欧挺搭。"},{"originalAuthor":"floor-4","text":"池昌民的舞台表现力也很好啊。"},{"originalAuthor":"floor-5","text":"金善旴会不会演着演着突然加戏？"},{"originalAuthor":"floor-6","text":"哈哈哈哈哈哈哈哈。"},{"originalAuthor":"floor-7","text":"不要乱传啦，等正式名单公布吧。"},{"originalAuthor":"floor-8","text":"不管谁演，我都期待最后一幕。"},{"originalAuthor":"floor-9","text":"大家记得文明观演，不要偷拍排练。"},{"originalAuthor":"floor-10","text":"支持，期待正式演出！"}],"trigger":"DOC-9"},{"id":"sdoc-10","title":"【求分析】池昌民学长是不是对【玩家】特别好？","body":"高二舞蹈社的池昌民学长，最近好像经常和【玩家】一起活动。\n我之前找他帮忙拍照，他拍完就把相机递给我，说已经拍好了。\n但是今天看到他给【玩家】拍照，他不仅会认真调整角度，还会问对方喜不喜欢，甚至主动换了好几个位置。\n重点是，他每拍完一张都会拿给【玩家】看。\n这是什么待遇差异？","tag":"校园话题","originalAuthor":"匿名用户_177","comments":[{"originalAuthor":"floor-6","text":"可能因为他们一起策划校园祭吧。"},{"originalAuthor":"floor-7","text":"也有可能【玩家】比较喜欢拍照，所以两个人有共同话题。"},{"originalAuthor":"floor-8","text":"池昌民平时对大家都挺温柔的，确实不太容易判断。"},{"originalAuthor":"floor-9","text":"但他看【玩家】的时候，笑起来真的很不一样。"},{"originalAuthor":"floor-10","text":"你是不是观察得太仔细了？"},{"originalAuthor":"floor-11","text":"校园论坛不就是用来观察的吗？"},{"originalAuthor":"floor-12","text":"我觉得他会记住自己在意的人喜欢什么样的照片。"},{"originalAuthor":"floor-13","text":"有可能，但别因为几张照片就认定他喜欢谁。"},{"originalAuthor":"floor-14","text":"同意。让当事人自己决定什么时候表达。"},{"originalAuthor":"floor-15","text":"不过我还是想看校园祭结束后的合照。"}],"trigger":"DOC-10"},{"id":"sdoc-11","title":"【读书会日常】李柱延最近是不是在给某个人推荐书？","body":"最近去读书会借书，发现李柱延好像一直在整理一本书的阅读笔记。\n我本来只是随口问了一句是什么书，他就认真给我讲了半天。\n后来【玩家】过来，他居然直接把那本书递给了对方，还说：\n“啊，你上次不是问过这个吗？我觉得你可能会喜欢。”\n？？？\n我问他的时候，他讲完就让我自己去书架找。\n这就是传说中的区别对待吗？","tag":"校园话题","originalAuthor":"匿名用户_244","comments":[{"originalAuthor":"floor-13","text":"有没有一种可能，他真的记得【玩家】问过什么？"},{"originalAuthor":"floor-14","text":"这反而更可怕了，他到底记了多少小事？"},{"originalAuthor":"floor-15","text":"李柱延看起来就是会记住别人随口说的话的人。"},{"originalAuthor":"floor-16","text":"如果他喜欢一个人，是不是会默默给对方准备很多东西？"},{"originalAuthor":"floor-17","text":"可能吧，但他不一定会主动说。"},{"originalAuthor":"floor-18","text":"我比较好奇那本书叫什么。"},{"originalAuthor":"floor-19","text":"楼上真的只是想读书吗？"},{"originalAuthor":"floor-20","text":"当然，我对文学充满热情。"},{"originalAuthor":"floor-21","text":"那你先加入读书会。"},{"originalAuthor":"floor-22","text":"我现在就去报名。"}],"trigger":"DOC-11"},{"id":"sdoc-12","title":"【舞蹈社投稿】池昌民学长今天排练结束后怎么一直在笑？","body":"今天舞蹈社排练结束以后，池昌民学长看起来心情特别好。\n他一边收拾东西，一边翻手机里的照片，还时不时笑一下。\n有人问他在看什么，他只说是今天拍的活动照片。\n后来【玩家】来找他，他马上把手机收起来，问对方要不要一起去吃东西。\n我是不是发现了什么？","tag":"校园话题","originalAuthor":"匿名用户_138","comments":[{"originalAuthor":"floor-20","text":"也可能只是拍到了很满意的照片。"},{"originalAuthor":"floor-21","text":"他本来就喜欢摄影，看到好照片会开心很正常。"},{"originalAuthor":"floor-22","text":"但是为什么【玩家】一来，他就收手机？"},{"originalAuthor":"floor-23","text":"因为照片里可能有【玩家】啊。"},{"originalAuthor":"floor-24","text":"那也不代表什么。"},{"originalAuthor":"floor-25","text":"对，可能只是觉得照片很好看，不想随便给别人看。"},{"originalAuthor":"floor-26","text":"不过主动邀请一起吃东西，确实说明关系不错。"},{"originalAuthor":"floor-27","text":"他们一起策划校园祭，关系好也正常。"},{"originalAuthor":"floor-28","text":"希望以后还能看到更多舞蹈社的活动照片。"},{"originalAuthor":"floor-29","text":"支持！请多发一些正经社团内容！"}],"trigger":"DOC-12"},{"id":"sdoc-13","title":"【匿名爆料】金善旴是不是每天都在等【玩家】？","body":"今天放学后，我在教学楼门口看见高一动漫社的金善旴。\n他站在那里看手机，时不时抬头看一眼教学楼。\n我本来以为他在等朋友。\n过了十几分钟，【玩家】从楼里出来，他立刻把手机收起来，走过去问：\n“你怎么这么晚？我刚好准备走。”\n问题是，我在旁边站了十分钟，他连一步都没动。","tag":"校园话题","originalAuthor":"匿名用户_326","comments":[{"originalAuthor":"floor-27","text":"哈哈哈哈哈哈哈哈哈哈。"},{"originalAuthor":"floor-28","text":"金善旴：我只是路过。"},{"originalAuthor":"floor-29","text":"这句话已经成为他的固定台词了。"},{"originalAuthor":"floor-30","text":"他是不是很怕别人发现自己在等人？"},{"originalAuthor":"floor-31","text":"感觉他越在意，越要装作不在意。"},{"originalAuthor":"floor-0","text":"但也可能只是想一起回家。"},{"originalAuthor":"floor-1","text":"那就直接问啊，为什么非要说“刚好准备走”？"},{"originalAuthor":"floor-2","text":"因为他是金善旴。"},{"originalAuthor":"floor-3","text":"这句话已经解释了一切。"},{"originalAuthor":"floor-4","text":"希望他早点学会坦率一点。"},{"originalAuthor":"floor-5","text":"不过【玩家】最后有没有跟他一起走？"},{"originalAuthor":"floor-6","text":"有，两个人一起离开了。"},{"originalAuthor":"floor-7","text":"那今天就算成功了。"}],"trigger":"DOC-13"},{"id":"sdoc-14","title":"【校园祭实况】李贤在今天怎么突然不爱说话了？","body":"今天校园祭的炸鸡部忙得不可开交。\n李贤在一直在帮忙安排出餐，前半天还会跟大家开玩笑，下午却突然安静了很多。\n我本来以为是太累了，后来发现【玩家】过来以后，他还是正常跟对方说话，只是笑容没有平时那么明显。\n【玩家】问他是不是累了，他说没事，然后继续做事。\n有人知道发生什么了吗？","tag":"校园话题","originalAuthor":"匿名用户_095","comments":[{"originalAuthor":"floor-2","text":"可能是真的累了，今天人那么多。"},{"originalAuthor":"floor-3","text":"李贤在平时挺能撑场面的，忙起来也不太会抱怨。"},{"originalAuthor":"floor-4","text":"但他也不是永远不会不开心啊。"},{"originalAuthor":"floor-5","text":"对，可靠不代表没有情绪。"},{"originalAuthor":"floor-6","text":"如果是【玩家】问，他会不会愿意说？"},{"originalAuthor":"floor-7","text":"可能要看情况。他有时候会先讲道理，不一定马上说出自己的感受。"},{"originalAuthor":"floor-8","text":"这倒是很像他。"},{"originalAuthor":"floor-9","text":"希望大家忙完以后都能好好休息。"},{"originalAuthor":"floor-10","text":"炸鸡部辛苦了！"},{"originalAuthor":"floor-11","text":"校园祭工作人员都辛苦了！"}],"trigger":"DOC-14"},{"id":"sdoc-15","title":"【校园祭后续】今天有人问李柱延明年还要不要一起参加活动","body":"今天读书会的活动结束后，我听见【玩家】问李柱延，明年还愿不愿意一起参加校园祭。\n他先愣了一下，似乎认真想了想，然后说：\n“啊，如果还是和你一起的话，应该不错。”\n说完以后，他还笑了一下。\n不是，这句话听起来真的很平静，但为什么我觉得有点特别？","tag":"校园话题","originalAuthor":"匿名用户_019","comments":[{"originalAuthor":"floor-9","text":"因为他不是随便答应的人吧。"},{"originalAuthor":"floor-10","text":"也有可能只是觉得搭档合作得很好。"},{"originalAuthor":"floor-11","text":"但“如果还是和你一起”这几个字真的很微妙。"},{"originalAuthor":"floor-12","text":"李柱延这种人，可能比起说很多漂亮话，更愿意用长期陪伴表达在意。"},{"originalAuthor":"floor-13","text":"你们不要把读书会变成恋爱研究所。"},{"originalAuthor":"floor-14","text":"已经来不及了。"},{"originalAuthor":"floor-15","text":"我只希望明年还能看到他们一起参加活动。"},{"originalAuthor":"floor-16","text":"同意！校园祭一年一次，论坛可以磕一整年。"}],"trigger":"DOC-15"},{"id":"sdoc-16","title":"【匿名树洞】我好像喜欢上了一个很难看懂的人","body":"他平时对大家都挺好，所以我一直分不清自己是不是特别的。\n他会记住我随口提过的事情，会在我忙得忘记吃饭时提醒我，也会在我不开心的时候陪我待一会儿。\n可是他从来不轻易说自己在想什么。\n有时候我觉得他离我很近，有时候又觉得他好像隔着一段距离。\n我不知道自己应该继续靠近，还是等他先开口。","tag":"校园树洞","originalAuthor":"匿名用户_未知","comments":[{"originalAuthor":"floor-16","text":"先问问自己，你真正想要的是什么。"},{"originalAuthor":"floor-17","text":"如果你喜欢他，可以给一点明确的信号，不一定非要等对方先开口。"},{"originalAuthor":"floor-18","text":"但是不要因为对方对你好，就默认他一定喜欢你。"},{"originalAuthor":"floor-19","text":"温柔和爱情不是同一回事。"},{"originalAuthor":"floor-20","text":"如果真的很在意，找个合适的时间好好聊聊吧。"},{"originalAuthor":"floor-21","text":"不要让两个人一直猜。"},{"originalAuthor":"floor-22","text":"有些人越在意，反而越不敢直接表达。"},{"originalAuthor":"floor-23","text":"但这也不能成为永远不沟通的理由。"},{"originalAuthor":"floor-24","text":"希望楼主能得到自己想要的答案。"},{"originalAuthor":"floor-25","text":"无论结果怎样，都希望你们能坦诚一点。"}],"trigger":"DOC-16"},{"id":"sdoc-17","title":"【热帖】校园祭结束后，五个人都在找【玩家】？","body":"今天校园祭结束，我突然发现一件很奇怪的事情。\n炸鸡部的李贤在问【玩家】有没有吃晚饭。\n读书会的李柱延问【玩家】之前借的书看完没有。\n动漫社的金泳勋提醒【玩家】别忘记拿走自己的东西。\n高一动漫社的金善旴问【玩家】明天还来不来学校。\n舞蹈社的池昌民问【玩家】要不要一起看今天拍的照片。\n我：？？？？？\n为什么每个人都能找到一个合理的理由？","tag":"校园话题","originalAuthor":"匿名用户_287","comments":[{"originalAuthor":"floor-23","text":"因为他们本来就是朋友或者活动搭档啊。"},{"originalAuthor":"floor-24","text":"是的，大家关系好很正常。"},{"originalAuthor":"floor-25","text":"但这五个人的关心方式也太不一样了。"},{"originalAuthor":"floor-26","text":"李贤在：先确认你有没有吃饭。"},{"originalAuthor":"floor-27","text":"李柱延：记得你借过什么书。"},{"originalAuthor":"floor-28","text":"金泳勋：把该交代的事情都确认清楚。"},{"originalAuthor":"floor-29","text":"金善旴：嘴上问得随便，实际上很在意答案。"},{"originalAuthor":"floor-30","text":"池昌民：把今天的照片认真分享给你。"},{"originalAuthor":"floor-31","text":"楼上总结得像在写人物设定。"},{"originalAuthor":"floor-0","text":"因为校园论坛最擅长的就是观察细节。"},{"originalAuthor":"floor-1","text":"不过最后还是要看【玩家】自己的想法。"},{"originalAuthor":"floor-2","text":"对，不能因为大家猜测，就替当事人决定关系。"}],"trigger":"DOC-17"},{"id":"sdoc-18","title":"【论坛管理员提醒】关于同学关系的讨论请适可而止","body":"近期论坛出现了大量关于同学私人关系的讨论。\n在这里统一提醒：\n可以讨论公开的校园活动、舞台表现和社团合作。\n不要发布未经证实的私人信息。\n不要偷拍、跟踪或擅自传播他人的照片。\n不要因为猜测某人喜欢谁，就去围堵、起哄或逼问当事人。\n对于同学之间的好感和关系，请尊重他们自己的表达与选择。\n校园论坛的初衷是让大家分享校园生活，而不是让任何人因为受到关注而感到不舒服。\n请大家理性讨论，文明吃瓜。","tag":"校园公告","originalAuthor":"论坛管理员","comments":[{"originalAuthor":"floor-30","text":"收到。"},{"originalAuthor":"floor-31","text":"好的管理员。"},{"originalAuthor":"floor-0","text":"以后只在论坛里默默磕，不去现实里打扰。"},{"originalAuthor":"floor-1","text":"支持。"},{"originalAuthor":"floor-2","text":"希望大家都能在校园祭玩得开心。"},{"originalAuthor":"floor-3","text":"以及，希望所有人都能勇敢表达自己的心意。"},{"originalAuthor":"floor-4","text":"表达心意可以，强迫别人接受不行。"},{"originalAuthor":"floor-5","text":"这条建议置顶。"},{"originalAuthor":"floor-6","text":"希望德比高中每天都有新鲜的校园故事，但大家都能自在地做自己。"}],"trigger":"DOC-18"},{"id":"sdoc-19","title":"【食堂观察日记】李贤在学长到底为什么跑那么快？？？","body":"每天中午都能在走廊看见高三炸鸡部的李贤在学长。\n上课的时候看起来温温柔柔的，走路也不急不慢。\n但是！！！\n只要一下课铃响，他就像突然解除了什么封印一样，直奔食堂。\n今天我本来还在慢慢收拾东西，结果刚走到楼梯口，就看见他已经在食堂排队了。\n不是，学长，你到底是怎么做到的？？？\n而且他每次到食堂都要站在窗口前认真报菜名，感觉阿姨都快认识他了。","tag":"校园话题","originalAuthor":"匿名用户_063","comments":[{"originalAuthor":"floor-5","text":"每天都看见学长在食堂报菜名，简直是饭桶。"},{"originalAuthor":"floor-6","text":"得比高饭桶皇帝李贤在。"},{"originalAuthor":"floor-7","text":"哈哈哈哈哈哈哈哈哈哈哈，饭桶皇帝是什么鬼！"},{"originalAuthor":"floor-8","text":"本人高三，实名证明。只要跟他一起去食堂，就一定能听见他报菜名。"},{"originalAuthor":"floor-9","text":"最离谱的是他吃得多，还吃得很快，吃完以后居然还能笑着问我要不要去买饮料。"},{"originalAuthor":"floor-10","text":"我上次看见他一个人端着三份餐盘，走得还特别稳。"},{"originalAuthor":"floor-11","text":"不是说他是炸鸡部的吗？怎么感觉食堂才是他的主场。"},{"originalAuthor":"floor-12","text":"炸鸡是副业，吃饭才是人生事业。"},{"originalAuthor":"floor-13","text":"但是学长平时真的很温柔啊，怎么一到食堂就变了个人。"},{"originalAuthor":"floor-14","text":"因为食堂窗口不会等人，竞争意识当然要觉醒。"},{"originalAuthor":"floor-15","text":"今天我跟他一起排队，他还提醒我别忘了拿筷子，自己倒是差点把汤忘了。"},{"originalAuthor":"floor-16","text":"哈哈哈哈哈，饭桶皇帝也有翻车的时候。"},{"originalAuthor":"floor-17","text":"有没有人统计过他一顿饭到底能吃多少？"},{"originalAuthor":"floor-18","text":"别统计了，再统计下去食堂阿姨要给他颁终身会员卡了。"},{"originalAuthor":"floor-19","text":"不过话说回来，他跑这么快，真的只是因为饿吗？"},{"originalAuthor":"floor-20","text":"楼上什么意思？"},{"originalAuthor":"floor-21","text":"我今天看见【玩家】也往食堂走，他本来已经快到门口了，居然又放慢速度等了一下。"},{"originalAuthor":"floor-22","text":"？？？？？？？"},{"originalAuthor":"floor-23","text":"可能是突然想起自己还没拿餐卡。"},{"originalAuthor":"floor-24","text":"可以，继续相信这个解释。"}],"trigger":"DOC-19"},{"id":"sdoc-20","title":"【求分析】高二读书会的李柱延是不是有点像黑猫？","body":"不知道有没有人懂我的意思。\n李柱延学长平时安安静静的，说话慢悠悠的，有时候坐在窗边看书，一坐就是半天。\n你跟他说话，他会先看你一眼，像是在认真判断你究竟想问什么。\n不熟的时候有一点距离感，熟了以后又会突然冒出很温柔的笑。\n我今天路过读书会活动室，看见他抱着一本书靠在椅背上，听见有人叫他才慢慢抬起头。\n那一瞬间真的很像黑猫。\n就是那种看起来懒洋洋、不太想搭理人，实际上又会悄悄注意周围动静的黑猫。","tag":"校园话题","originalAuthor":"匿名用户_142","comments":[{"originalAuthor":"floor-12","text":"黑猫？？？我本来觉得他像小猫，楼主一说突然觉得确实有点像。"},{"originalAuthor":"floor-13","text":"我觉得他像那种不熟的时候不让摸，熟了以后会自己靠过来的猫。"},{"originalAuthor":"floor-14","text":"哈哈哈哈哈哈哈哈，你们不要把人家当猫。"},{"originalAuthor":"floor-15","text":"但他真的有那种安静观察人的感觉。"},{"originalAuthor":"floor-16","text":"而且笑起来完全不一样，眼睛弯弯的，很亲切。"},{"originalAuthor":"floor-17","text":"黑猫的外表，温水的内核。"},{"originalAuthor":"floor-18","text":"楼上这个总结可以。"},{"originalAuthor":"floor-19","text":"我上次去读书会借书，他明明自己在看书，还是记得我上次问过哪本。"},{"originalAuthor":"floor-20","text":"他是不是很会记住别人说过的话？"},{"originalAuthor":"floor-21","text":"是的，而且不会特意拿出来炫耀，就是下次见面的时候突然提起。"},{"originalAuthor":"floor-22","text":"那如果他喜欢一个人呢？会不会也像猫一样，明明想靠近又装作不在意？"},{"originalAuthor":"floor-23","text":"你这已经不是黑猫观察帖了，这是恋爱分析帖。"},{"originalAuthor":"floor-24","text":"但是我觉得有可能。他看起来就不是会随便说心事的人。"},{"originalAuthor":"floor-25","text":"也许吧，不过猫也有自己的节奏，不要硬把人家往怀里抱。"},{"originalAuthor":"floor-26","text":"总结：李柱延学长，黑猫系读书会成员。"},{"originalAuthor":"floor-27","text":"本人如果看到这条帖子，估计会先愣一下，然后问我们为什么突然讨论猫。"},{"originalAuthor":"floor-28","text":"他可能还会认真思考自己到底像不像猫。"},{"originalAuthor":"floor-29","text":"救命，已经想象到他拿这个问题去问读书会的大家了。"}],"trigger":"DOC-20"},{"id":"sdoc-21","title":"【求证】金泳勋学长是不是会做面包？！","body":"求问高三动漫社的金泳勋学长。\n今天听同学说他会做面包，真的假的？\n我原本以为他平时就是看看动漫、穿穿格子衫，没想到还有这种隐藏技能。\n如果是真的，我宣布以后动漫社活动我都要报名。","tag":"校园话题","originalAuthor":"匿名用户_216","comments":[{"originalAuthor":"floor-19","text":"是真的！听说他做过。"},{"originalAuthor":"floor-20","text":"等等，高三动漫社为什么会突然出现一个会做面包的人？"},{"originalAuthor":"floor-21","text":"这有什么奇怪的，喜欢动漫和会做面包又不冲突。"},{"originalAuthor":"floor-22","text":"可是想象一下他穿着格子衫，安安静静地站在厨房里揉面团……"},{"originalAuthor":"floor-23","text":"楼上，请停止，你已经开始写小说了。"},{"originalAuthor":"floor-24","text":"我有一个朋友参加过他做的面包分享活动，说味道真的不错。"},{"originalAuthor":"floor-25","text":"重点是他还会认真研究配方，不是随便揉两下就结束。"},{"originalAuthor":"floor-26","text":"所以他到底是动漫社成员还是面包师？"},{"originalAuthor":"floor-27","text":"面包王子。"},{"originalAuthor":"floor-28","text":"面包王子哈哈哈哈哈哈哈哈哈哈。"},{"originalAuthor":"floor-29","text":"以后动漫社的活动是不是可以改成烘焙主题？"},{"originalAuthor":"floor-30","text":"金泳勋：我只是做了个面包。"},{"originalAuthor":"floor-31","text":"校园论坛：德比高中面包王子诞生了。"},{"originalAuthor":"floor-0","text":"我想知道他做面包的时候会不会也那么严肃。"},{"originalAuthor":"floor-1","text":"应该会吧，他看起来就是那种连面粉比例都要认真确认的人。"},{"originalAuthor":"floor-2","text":"如果他真的做得很好，为什么不在校园祭开一个面包摊位？"},{"originalAuthor":"floor-3","text":"支持！面包王子请出摊！"},{"originalAuthor":"floor-4","text":"到时候记得排队，不要只顾着拍照。"},{"originalAuthor":"floor-5","text":"如果【玩家】也去帮忙呢？"},{"originalAuthor":"floor-6","text":"那我就更想知道最后做出来的面包会不会特别好吃了。"},{"originalAuthor":"floor-7","text":"别问了，已经开始期待了。"}],"trigger":"DOC-21"},{"id":"sdoc-22","title":"【动漫社观察】金善旴为什么这么喜欢看少女漫画？","body":"认真求问。\n高一动漫社的金善旴，平时看起来嘴很快，吐槽也很快，整天一副什么都难不倒他的样子。\n结果今天我去动漫社借东西，发现他正在看少女漫画。\n不是一本。\n是好几本。\n而且他看得还特别认真。\n我本来以为他只是随手翻翻，结果我过去的时候，他居然叫我别挡住画面。\n？？？\n请问这位平时最爱吐槽别人的学弟，为什么会对少女漫画这么感兴趣？","tag":"校园话题","originalAuthor":"匿名用户_081","comments":[{"originalAuthor":"floor-26","text":"哈哈哈哈哈哈哈哈哈哈，谁规定动漫社成员不能看少女漫画？"},{"originalAuthor":"floor-27","text":"我比较想知道他喜欢什么类型的。"},{"originalAuthor":"floor-28","text":"据说他会吐槽男女主为什么不直接把话说清楚。"},{"originalAuthor":"floor-29","text":"那他自己呢？他自己遇到事情会直接说清楚吗？"},{"originalAuthor":"floor-30","text":"哈哈哈哈哈哈哈哈哈哈哈，楼上精准打击。"},{"originalAuthor":"floor-31","text":"金善旴：为什么女主不直接问男主？"},{"originalAuthor":"floor-0","text":"金善旴本人：我只是刚好路过。"},{"originalAuthor":"floor-1","text":"笑死，怎么什么都能扯到他嘴硬。"},{"originalAuthor":"floor-2","text":"我觉得他可能喜欢看那种互动很有意思的，尤其是两个人互相试探、谁都不肯先认输的剧情。"},{"originalAuthor":"floor-3","text":"所以他喜欢看别人推拉？"},{"originalAuthor":"floor-4","text":"也许是觉得有趣吧，不一定是代入自己。"},{"originalAuthor":"floor-5","text":"不过我听见他吐槽过一部漫画，说男主明明喜欢女主却一直不说，害得女主误会。"},{"originalAuthor":"floor-6","text":"然后呢？"},{"originalAuthor":"floor-7","text":"然后他说这种人很麻烦。"},{"originalAuthor":"floor-8","text":"？？？？？？？"},{"originalAuthor":"floor-9","text":"我不行了，他到底有没有意识到自己也很麻烦。"},{"originalAuthor":"floor-10","text":"有没有一种可能，他看少女漫画就是为了研究怎么谈恋爱？"},{"originalAuthor":"floor-11","text":"楼上，你把他想得太有计划了。"},{"originalAuthor":"floor-12","text":"也可能只是单纯喜欢剧情，大家不要过度解读。"},{"originalAuthor":"floor-13","text":"同意。但是我还是很好奇，如果【玩家】问他为什么喜欢看，他会怎么回答。"},{"originalAuthor":"floor-14","text":"估计先说“关你什么事”，然后开始认真讲剧情。"},{"originalAuthor":"floor-15","text":"最后还会问【玩家】看没看过，没看过就推荐给她。"},{"originalAuthor":"floor-16","text":"等等，楼上怎么这么了解？"},{"originalAuthor":"floor-17","text":"因为他平时就是这种人啊。"},{"originalAuthor":"floor-18","text":"总结：嘴上吐槽少女漫画里的恋爱，手上翻页翻得飞快。"},{"originalAuthor":"floor-19","text":"建议下次采访金善旴学弟，主题：《少女漫画到底有什么魅力》。"},{"originalAuthor":"floor-20","text":"副标题：《为什么你自己不肯直接说》。"},{"originalAuthor":"floor-21","text":"金善旴看到这条帖子估计会当场把论坛管理员叫出来。"},{"originalAuthor":"floor-22","text":"他可能会先吐槽我们无聊，然后默默把漫画收进书包。"},{"originalAuthor":"floor-23","text":"但是明天还是会继续看。"}],"trigger":"DOC-22"}]};window.CampusAuthored=(()=>{const DATA=window.CampusAuthoredData;
const ids=['jae','ju','young','sun','q'];
function fixed(actor,kind,meta={}){return Object.values(DATA.fixed).find(r=>r.actor===actor&&r.kind===kind&&['itemId','place','kind','activity','aidTopic','clubId'].every(k=>r.meta[k]===undefined||r.meta[k]===meta[k]))||null}
function text(value,game,actor,meta={}){return String(value||'').replaceAll('【称呼】',window.CampusSim.address(game.school,actor,game.player?.name||'同学').preferred).replaceAll('【玩家姓名】',game.player?.name||'同学').replaceAll('【玩家网名】',game.nickname||game.player?.name||'同学').replaceAll('【活动名称】',meta.activity||game.school.festivalPlan?.activity||game.school.festival?.activity||'校园祭').replaceAll('【预约日期】',window.CampusSim.date(Number.isInteger(meta.serviceDay)?meta.serviceDay:game.school.day).label)}

 for(const item of Object.values(DATA.proactive)){
  const map={clubMilestone:stories.MILESTONES,clubJealousy:stories.JEALOUSY,sponsorAbsence:stories.ABSENCES,festivalSponsorRequest:stories.FESTIVAL_REQUESTS};
  const target=item.kind==='aidThanks'?stories.AID_TOPICS[item.actor][item.aidTopic]:map[item.kind]?.[item.actor];

 }
 for(const item of Object.values(DATA.romances)){const topic=stories.ROMANCE[item.actor].find(t=>t.id===Object.keys(DATA.romances).find(k=>DATA.romances[k]===item));if(topic)Object.assign(topic,{rounds:item.rounds,closing:item.closing})}
 const beforeOptions=stories.options,beforeFollowup=stories.followup;
 stories.options=function(actor,kind,meta={}){const r=fixed(actor,kind,meta);return r&&r.options.every(Boolean)?r.options.slice():beforeOptions(actor,kind,meta)};
 stories.followup=function(actor,flow,index){const r=fixed(actor,flow.kind,flow.meta);if(r?.closing[index])return {text:r.closing[index]};return beforeFollowup(actor,flow,index)};
 stories.festivalScene=function(actor,activity){if(!actor)return '你独立完成了'+activity+'。从布置、营业或演出到收尾，这一天留下了属于你的回忆。';const s=DATA.scenes.find(s=>s.kind==='festival'&&s.actor===actor&&s.activity===activity);return s?s.pages.map(p=>p.speaker?'“'+p.text+'”':p.text).join('\n\n'):''};
}
function ensure(game){game.novel||={version:1,active:null,queue:[],seen:{},choices:{},history:[],aiNotes:{}};const n=game.novel;n.queue||=[];n.seen||={};n.choices||={};n.history||=[];n.aiNotes||={};return n}

 if(clubId==='anime'){

  const special=scenes.find(s=>s.highAffection),eligible=['young','sun'].some(id=>game.school.relations[id].affection>70);

 }
 const unused=scenes.find(s=>!n.seen[s.id]);return unused||scenes[n.history.filter(h=>h.kind===kind&&h.actor===actor&&(!place||h.place===place)).length%scenes.length]||null;
}
function begin(game,scene,meta={}){const n=ensure(game);if(!scene)return null;const key=meta.key||scene.id+'-'+game.school.day;if(n.active?.key===key||n.queue.some(x=>x.key===key))return n.active;const ticket={key,id:scene.id,day:game.school.day,phase:'pages',index:0,choice:null,after:0,...meta};if(n.active)n.queue.push(ticket);else n.active=ticket;return ticket}
function complete(game){const n=ensure(game),a=n.active;if(!a)return null;const scene=DATA.scenes.find(s=>s.id===a.id);if(!a.review){n.seen[a.id]=(n.seen[a.id]||0)+1;if(a.choice!==null)n.choices[a.id]=scene.choices[a.choice]?.id;n.history.push({id:a.id,kind:scene.kind,actor:scene.actor||null,clubId:scene.clubId||null,place:scene.place||null,day:a.day,choice:a.choice});for(const actor of scene.members){const choice=a.choice!==null?scene.choices[a.choice]?.text:'';const note='第'+(a.day+1)+'天，与玩家经历了“'+scene.title+'”。'+(choice?'玩家选择：“'+choice+'”。':'');(n.aiNotes[actor]||=[]).push(note);n.aiNotes[actor]=n.aiNotes[actor].slice(-6)}}n.active=n.queue.shift()||null;return a}

async function sendCampus(id,retry=false){if(sending.has(id))return;if(!retry){if(chatErrors[id]){toast('请先重试上一条未完成的消息。');return}const text=$('#campusInput')?.value.trim();if(!text)return;game.chats[id].push({role:'user',content:text,at:Date.now()});game.drafts[id]='';$('#campusInput').value='';saveCampus()}sending.add(id);delete chatErrors[id];saveCampus();paintChat(id);try{if(!campusToken)await initializeApi();if(!campusToken)throw Error(apiState.error||'聊天连接暂时不可用，请稍后重试。');const rewardDay=game.school.day;const contextStart=Math.max(game.contextStart[id]||0,game.chats[id].length-80);const res=await campusApiFetch('/api/chat',{method:'POST',headers:window.CampusApiPreferences.chatHeaders({'Content-Type':'application/json','x-phone-token':campusToken}),body:JSON.stringify({chatId:id,player:game.player,messages:game.chats[id].slice(contextStart).map(({role,content})=>({role,content})),memory:game.memories[id]||'',gameState:Sim.context(game.school,id,game.player.name)})});const data=await res.json();if(!res.ok){if(res.status===403)campusToken='';throw Error(data.error||'回复没有送达。')}if(game.school.day===rewardDay&&!game.school.completed){const socialChange=Sim.chatReward(game.school,id);if(socialChange)showRelationChange(id,socialChange);saveCampus()}game.memories[id]=data.memory||game.memories[id];if(data.consumed)game.contextStart[id]=contextStart+data.consumed;for(const text of data.messages||[data.reply]){if(!text)continue;await new Promise(r=>setTimeout(r,Math.min(1500,350+text.length*25)));receiveLive(id,text);saveCampus();paintChat(id)}apiState.configured=true;}catch(e){chatErrors[id]=e.message||'回复没有送达，请重试。'}finally{sending.delete(id);paintChat(id);if(current==='kakao'&&!activeContact)renderKkt();refreshHome()}}

function validateCampusSave(d){if(d?.dialogue)window.CampusDialogue.validate(d.dialogue);if(d?.proactive)window.CampusStories.validate(d.proactive);if(d?.school)Sim.validate(d.school);if(!d||d.version!==1||typeof d.player?.name!=='string'||!d.player.name.trim()||d.player.name.length>16||typeof d.player.identity!=='string'||d.player.identity.length>80||typeof d.nickname!=='string'||d.nickname.length>20||!d.chats||!d.memories||!d.read||!d.drafts||!Array.isArray(d.posts)||!Array.isArray(d.likes)||!d.comments)throw Error('不是有效的校园存档');for(const id of Object.keys(C)){if(!Array.isArray(d.chats[id])||d.chats[id].length>10000||typeof d.memories[id]!=='string'||d.memories[id].length>16000||d.chats[id].some(m=>!['user','assistant'].includes(m.role)||typeof m.content!=='string'||m.content.length>6000||!Number.isFinite(m.at))||!Number.isInteger(d.read[id])||typeof(d.drafts[id]||'')!=='string')throw Error('聊天记录格式不正确')}if(d.posts.length>2000||d.posts.some(p=>typeof p.id!=='string'||!/^[ps][a-zA-Z0-9-]+$/.test(p.id)||!['title','body','author','tag'].every(k=>typeof p[k]==='string')||!Array.isArray(p.comments)))throw Error('帖子格式不正确');if(d.contextStart&&(typeof d.contextStart!=='object'||Object.values(d.contextStart).some(v=>!Number.isInteger(v)||v<0)))throw Error('记忆游标格式不正确');if(d.errors&&(typeof d.errors!=='object'||Object.values(d.errors).some(v=>typeof v!=='string')))throw Error('消息状态格式不正确');for(const v of Object.values(d.comments)){if(!Array.isArray(v)||v.some(c=>typeof c.author!=='string'||typeof c.text!=='string'))throw Error('评论格式不正确')}}

function schoolCalendar(){const s=game.school,chosen=Sim.date(inspectDay);return `<div class="school-calendar-intro"><span class="eyebrow">9.1 — 10.15 / 45 DAYS</span><h3>这一个半月，慢慢来。</h3><p>9 月 1 日为周一。普通工作日上课，周三傍晚社团，周末约会或打工；特别日期以当天活动为准。</p></div><div class="calendar-event-legend"><span class="event-sports">9月12日 · 运动会</span><span class="event-exam">9月23日 · 期中考试</span><span class="event-festival">9月25日 · 校园祭</span><span class="event-final">10月15日 · 期末考试</span></div>${[9,10].map(month=>{const days=Array.from({length:Sim.LIMIT},(_,i)=>Sim.date(i)).filter(d=>d.month===month),offset=days[0].weekday;return `<section class="school-month"><h3>${month}月</h3><div class="school-calendar-week">${['一','二','三','四','五','六','日'].map(x=>`<span>${x}</span>`).join('')}</div><div class="school-calendar-grid">${'<span></span>'.repeat(offset)}${days.map(d=>`<button data-inspect-day="${d.day}" class="${d.day===s.day?'today ':''}${d.day===inspectDay?'selected ':''}${d.day<s.day?'past ':''}${d.weekend?'weekend':''}${Sim.special(d.day)?' school-event event-'+Sim.special(d.day):''}" aria-label="${d.label}${d.weekLabel}${d.day===s.day?'，今天':''}"><b>${d.date}</b><small>${d.day===0?'开学':d.last?'期末考试':Sim.special(d.day)?({sports:'运动会',exam:'期中考试',festival:'校园祭',final:'期末考试'})[Sim.special(d.day)]:d.wednesday?'社团':d.weekend?'周末':'课程'}</small>${s.settlements[d.day]||s.dateAttempts[d.day]?'<i></i>':''}</button>`).join('')}</div></section>`}).join('')}<div class="campus-card school-calendar-detail"><strong>${chosen.label} ${chosen.weekLabel}</strong><p>${chosen.day===0?'开学日 · ':''}${chosen.last?'本轮最后一天 · ':''}${Sim.special(chosen.day)?({sports:'运动会，可报名比赛或观看，并参与同学剧情。',exam:'期中考试，450分合格，未合格将退学。',festival:'期中两天后的校园祭，选择活动并邀请同学一起策划。',final:'今天只进行期末考试，之后查看总排名与本轮结局。'})[Sim.special(chosen.day)]:chosen.wednesday?'上午下午共四节课，傍晚可以参加一个俱乐部。':chosen.weekend?'无课程，可选择一次约会或打工。':'自由安排四节课，结算后进入下一天。'}</p><small>${s.settlements[chosen.day]?'已上课：'+s.settlements[chosen.day].plan.join('、'):chosen.day<s.day?'当天已结束':chosen.day===s.day?'这是你正在经历的一天':'仅预览安排，不会跳过日期'}${s.clubVisits[chosen.day]?' · '+Sim.CLUBS[s.clubVisits[chosen.day].id].name:''}${s.dateAttempts[chosen.day]?' · 约会邀请'+(s.dateAttempts[chosen.day].accepted?'成功':'被婉拒'):''}</small></div><button class="campus-secondary" data-today-school>回到今天</button>`}

function schoolActivities(){const s=game.school,d=schoolDate();return schoolBanner()+(s.completed?'<div class="school-tip">本轮活动已结束，可以在成长页查看记录。</div>':'')+`<section class="school-activity-section"><span class="eyebrow">WEDNESDAY / AFTER CLASS</span><h3>周三傍晚，去哪里待一会儿。</h3><p class="school-copy">每天只参加一个俱乐部。动漫社可以同时和金善旴、金泳勋相处。</p>${Object.entries(Sim.CLUBS).map(([id,c])=>{const visited=s.clubVisits[s.day]?.id===id,enabled=!s.completed&&d.wednesday&&!!s.settlements[s.day]&&!s.clubVisits[s.day];return `<article class="campus-card school-club"><div class="school-club-people">${c.members.map(member=>av(member)).join('')}</div><div><h4>${c.name}</h4><p>${c.members.map(member=>C[member].name).join('、')}</p></div><button data-visit-club="${id}" ${enabled?'':'disabled'}>${visited?'已参加':!d.wednesday?'周三开放':!s.settlements[s.day]?'下课后开放':s.clubVisits[s.day]?'今日已安排':'参加'}</button></article>`}).join('')}${s.clubVisits[s.day]?activityResult(s.clubVisits[s.day],'club'):''}</section><section class="school-activity-section"><span class="eyebrow">SATURDAY & SUNDAY</span><h3>试着把邀请发出去。</h3><p class="school-copy">选择想见的人和地点，发出邀请后，去KKT看看他的回复。</p><form class="campus-form" id="dateForm"><label for="dateWho">约谁见面<select id="dateWho" ${s.completed||!d.weekend||s.dateAttempts[s.day]?'disabled':''}>${Object.entries(C).map(([id,c])=>`<option value="${id}" ${s.dateAttempts[s.day]?.id===id?'selected':''}>${c.name}</option>`).join('')}</select></label><label for="datePlace">去哪里<select id="datePlace" ${s.completed||!d.weekend||s.dateAttempts[s.day]?'disabled':''}>${['咖啡店','电影院','公园'].map(place=>`<option ${s.dateAttempts[s.day]?.place===place?'selected':''}>${place}</option>`).join('')}</select></label><button class="campus-primary" ${s.completed||!d.weekend||s.dateAttempts[s.day]?'disabled':''}>${s.dateAttempts[s.day]?'今天已经发出邀请':d.weekend?'发出约会邀请':'周末开放'}</button></form>${s.dateAttempts[s.day]?activityResult(s.dateAttempts[s.day],'date'):''}</section>`+(d.weekend?nextDayButton():'')}
function dateChanceText(id){const chance=Sim.dateChance(game.school,id);return chance===0?'当前未达到邀请条件，本次邀请一定会被婉拒。':'当前接受概率约 '+Math.round(chance*100)+'%，最终结果在发出邀请时确定。'}
function activityResult(r,type){if(type==='club')return '<div class="school-settlement"><strong>'+Sim.CLUBS[r.id].name+'的傍晚</strong>'+Object.entries(r.gains).map(([id,change])=>'<p>'+C[id].name+'：'+relationText(change)+'</p>').join('')+'</div>';return '<div class="school-settlement"><strong>'+C[r.id].name+(r.accepted?'答应了你的预约':'婉拒了这次邀请')+'</strong><p>'+(r.accepted?'预约已确认，去KKT回应他吧。':'今天的邀请机会已使用，去KKT看看他的消息吧。')+'</p><p>'+relationText(r.gains)+'</p></div>'}

function growth(){const s=game.school,a=s.attributes;return schoolBanner()+`<h3>今天的你</h3><div class="school-attributes">${[['knowledge','学识'],['logic','逻辑'],['eq','情商'],['talent','才华'],['fame','名气']].map(([k,title])=>`<div><span>${title}</span><strong>${a[k]}</strong><small>${{knowledge:'成绩随之提高',logic:'更容易卸下警戒',eq:'更容易增加好感',talent:'被更多同学看见',fame:'每天最多 '+Math.min(4,Math.floor(a.fame/5))+' 篇话题'}[k]}</small></div>`).join('')}<div><span>零用钱</span><strong class="money-value">${money(a.money)}</strong><small>才艺课每三节奖励 ₩30,000</small></div></div><h3>慢慢靠近的人</h3><p class="school-copy">关系数值越亲近，聊天语气也会随经历变化。数值不会自动替你确认恋爱关系。</p>${Object.entries(C).map(([id,c])=>{const r=s.relations[id];return `<article class="campus-card school-relationship"><header>${av(id)}<div><strong>${c.name}</strong><small>${c.grade} · ${Sim.stage(r)}</small></div><button data-school-chat="${id}">聊一聊</button></header><div class="relation-meter"><span>好感 ${r.affection}</span><i><b style="width:${r.affection}%"></b></i></div><div class="relation-meter guard"><span>警戒 ${r.guard}</span><i><b style="width:${r.guard}%"></b></i></div><p>校外约会 ${r.bond} 次</p></article>`}).join('')}<details class="school-rules"><summary>查看属性与关系规则</summary><p>每节课学识 +2，对应逻辑／情商／才华 +3（最高 100）。名气为才华 ÷5 取整，每 5 点名气每天多一篇校园话题，最多四篇。</p><p>每位同学每天第一次成功聊天后，好感 +2、警戒 −1；社团基础为好感 +8、警戒 −7；成功约会基础为好感 +7、警戒 −4。情商每 25 点额外增加 1 点好感，逻辑每 35 点额外降低 1 点警戒。没有每日自然衰减。</p><p>初始好感 12、警戒 52；两项范围均为 0–100。拒绝邀请不会扣分。每周三仅一个社团，每个周末日仅一次邀请。</p></details><h3>最近的校园记录</h3>${s.history.slice(-12).reverse().map(h=>`<div class="school-history"><small>${Sim.date(h.day).label}</small><span>${escapeHTML(h.text)}${h.id&&C[h.id]?' · '+C[h.id].name:''}</span></div>`).join('')||'<p class="school-copy">第一份记录，等待今天开始。</p>'}`}
function ranking(){
 const s=game.school;const npcNames=['许知远','韩书允','宋书辰','林时安','吴宥真','崔恩书','朴知夏','郑叙言','韩允成','尹多恩','宋知然','白书妍','姜以安','吴世林','林知宥','崔时雨','金在熙','申夏恩','郑宇辰','朴诗恩','柳知勋','安书妍','宋时律','姜恩夏','韩知温','尹知河','许在允','郑时安'];
 const rows=npcNames.map((name,i)=>({name,score:Math.max(405,727-i*11-(schoolGrade==='高三'?0:schoolGrade==='高二'?5:10))}));
 for(const [id,c] of Object.entries(C))if(c.grade===schoolGrade)rows.push({name:c.name,score:{jae:683,young:679,q:671,ju:662,sun:656}[id]});
 if(s.grade===schoolGrade)rows.push({name:game.player.name,score:Sim.score(s),self:true});rows.sort((a,b)=>b.score-a.score||Number(!!a.self)-Number(!!b.self));
 const self=rows.findIndex(r=>r.self);return `<div class="school-ranking-head"><span class="eyebrow">${s.grade} · 当前成绩</span><strong>${Sim.score(s)}<small>/ 750</small></strong><p>学识和属性结算后立即更新。${schoolGrade===s.grade?'当前年级第 '+(self+1)+' 名。':'切换到 '+s.grade+' 查看自己的年级排名。'}</p></div><nav class="campus-tabs">${['高一','高二','高三'].map(g=>`<button data-grade="${g}" class="${schoolGrade===g?'active':''}">${g}</button>`).join('')}</nav><table class="rank-table"><thead><tr><th>名次</th><th>姓名</th><th>总分</th></tr></thead><tbody>${rows.map((r,i)=>`<tr class="${r.self?'self':''}"><td>${i+1}</td><td>${escapeHTML(r.name)}${r.self?'<small style="display:block;font-size:calc(var(--phone-u, 1vw) * 2.5)">我</small>':''}</td><td>${r.score}</td></tr>`).join('')}</tbody></table><p class="school-copy">成绩 = 400 + 学识×1.1 + 逻辑×0.2 + 情商×0.2，上限 750。其他同学成绩是本轮固定的游戏基准。可在“我的”修改玩家年级。</p>`;
}
function schoolForum(){const count=game.school.generatedPosts.filter(p=>p.day===game.school.day).length;return `<div class="school-forum-head"><span>校园论坛</span><small>名气 ${game.school.attributes.fame} · 今日与你有关的话题 ${count} 篇</small></div><input id="forumSearch" class="forum-search" placeholder="搜索校园里的小事" aria-label="搜索论坛" value="${escapeHTML(forumQuery)}"><div id="forumPosts">${forumPosts()}</div>`}
function schoolMe(){return `<div class="campus-card"><h3>${escapeHTML(game.nickname||'取一个校园网名')}</h3><form id="nicknameForm" class="campus-form"><label for="forumNickname">论坛网名</label><input id="forumNickname" required maxlength="20" placeholder="你的校园网名" value="${escapeHTML(game.nickname)}"><small>KKT 名字：${escapeHTML(game.player.name)}</small><label for="playerSchoolGrade">我的年级</label><select id="playerSchoolGrade">${['高一','高二','高三'].map(g=>`<option ${game.school.grade===g?'selected':''}>${g}</option>`).join('')}</select><button class="campus-primary">保存校园资料</button></form></div><h3>我发布的帖子</h3>${game.posts.length?game.posts.map(p=>postCard(p)).join(''):'<p class="school-copy">还没有发布帖子。</p>'}<div class="school-tip">课程、活动、属性和聊天一起自动存档。可以到手机设置中导入或导出。</div>`}
function ending(){const s=game.school;return schoolBanner()+`<div class="campus-card school-ending"><span class="eyebrow">9.1 — 10.15</span><h3>一个半月，<br>留下了这些回声。</h3><p>你完成了 ${Object.keys(s.settlements).length} 天课程，参加 ${Object.keys(s.clubVisits).length} 次俱乐部活动，留下 ${s.history.filter(h=>h.type==='date'&&h.accepted).length} 次校外约会。</p><div class="school-final-score">${Sim.score(s)}<small>当前总分 / 750</small></div><p>累计才艺课 ${s.attributes.specialtyCount} 节 · 零用钱 ${money(s.attributes.money)}</p><button class="campus-secondary" data-school-tab="成长">查看关系与成长</button><button class="campus-secondary" data-school-settings>导出这段校园生活</button></div>`}
function bindSchoolForms(){
 if($('#timetableForm')){app.querySelectorAll('[name="subject"]').forEach(el=>el.onchange=()=>{game.school.plan=Array.from(app.querySelectorAll('[name="subject"]'),x=>x.value);saveCampus()});$('#timetableForm').onsubmit=e=>{e.preventDefault();schoolAction(()=>Sim.settle(game.school,Array.from(app.querySelectorAll('[name="subject"]'),x=>x.value),game.player.name))}}
 if($('#nextSchoolDay'))$('#nextSchoolDay').onclick=()=>schoolAction(()=>{const result=Sim.advance(game.school,game.player.name);inspectDay=game.school.day;return result});
 if($('#dateForm')){$('#dateForm').onsubmit=e=>{e.preventDefault();schoolAction(()=>{const r=Sim.invite(game.school,$('#dateWho').value,$('#datePlace').value);activityMessage(r,'date');return r})}}
 if($('#forumSearch'))$('#forumSearch').oninput=e=>{forumQuery=e.target.value;$('#forumPosts').innerHTML=forumPosts()};

function activityMessage(r,type){if(type==='date'){receiveDate(r);return}const c=Sim.CLUBS[r.id],texts={sun:'今天在动漫社聊得还挺开心。下周还来？',young:'今天的动漫社很有意思。下次给你留位置。',q:'刚才一起跳的那一段，要不要下次再练练？',ju:'读书会那本书，我把书签留着了。下周见。',jae:'今天的炸鸡还不错吧？下次你来挑口味。'};for(const id of c.members)receiveScripted(id,texts[id],'club',{club:r.id},'club-'+r.day+'-'+id)}

app.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.visitClub)schoolAction(()=>{const r=Sim.club(game.school,b.dataset.visitClub);activityMessage(r,'club');return r});if(b.hasAttribute('data-inspect-day')){inspectDay=Number(b.dataset.inspectDay);current==='calendar'?renderCalendar():renderSchool('校历')}if(b.hasAttribute('data-today-school')){inspectDay=game.school.day;current==='calendar'?renderCalendar():renderSchool('校历')}if(b.dataset.schoolChat){openApp('kakao');renderChat(b.dataset.schoolChat)}if(b.hasAttribute('data-school-settings'))openApp('settings')});
