// Birthdays repeat on the same month/day; dated trips use a specific year.
const CALENDAR_EVENTS=[];
function calendarEvents(date){return CALENDAR_EVENTS.filter(e=>e.month===date.getMonth()+1&&e.day===date.getDate()&&(!e.year||e.year===date.getFullYear()))}
function renderCalendar(){
 const today=new Date(),year=month.getFullYear(),m=month.getMonth(),offset=(new Date(year,m,1).getDay()+6)%7,count=new Date(year,m+1,0).getDate(),events=calendarEvents(selectedDate);
 const iso=selectedDate.getFullYear()+'-'+String(selectedDate.getMonth()+1).padStart(2,'0')+'-'+String(selectedDate.getDate()).padStart(2,'0');
 app.innerHTML=header('日历','<button class="action" id="today">今天</button>')+`<div class="scroll"><div class="month-head"><button id="prevMonth" aria-label="上个月">‹</button><strong>${year}年 ${m+1}月</strong><button id="nextMonth" aria-label="下个月">›</button></div><label class="calendar-jump">前往日期<input type="date" id="calendarJump" aria-label="前往日期" value="${iso}"></label><div class="week">${['一','二','三','四','五','六','日'].map(x=>`<span>${x}</span>`).join('')}</div><div class="monthgrid">${'<span></span>'.repeat(offset)}${Array.from({length:count},(_,i)=>{
 const d=i+1,date=new Date(year,m,d),s=date.toDateString(),entries=calendarEvents(date);
 return `<button data-day="${d}" aria-label="${m+1}月${d}日${entries.length?'，'+entries.map(e=>e.title).join('，'):''}" class="day ${s===today.toDateString()?'today':''} ${s===selectedDate.toDateString()?'chosen':''}">${d}${entries.length?'<i class="event-dot"></i>':''}</button>`;
 }).join('')}</div><div class="agenda"><strong>${selectedDate.toLocaleDateString('zh-CN',{month:'long',day:'numeric',weekday:'long'})}</strong>${events.length?`<div class="calendar-event-list">${events.map(e=>`<article class="calendar-event" style="--event-color:${e.color||'#5084f5'}"><span>全天</span><div><strong>${escapeHTML(e.title)}</strong><small>${escapeHTML(e.type||'日程')}</small></div></article>`).join('')}</div>`:empty('▦','没有日程','这一天还没有安排')}</div></div>`;
 const changeMonth=delta=>{month=new Date(year,m+delta,1);selectedDate=new Date(month.getFullYear(),month.getMonth(),Math.min(selectedDate.getDate(),new Date(month.getFullYear(),month.getMonth()+1,0).getDate()));renderCalendar()};
 $('#prevMonth').onclick=()=>changeMonth(-1);$('#nextMonth').onclick=()=>changeMonth(1);
 $('#today').onclick=()=>{selectedDate=new Date();month=new Date(today.getFullYear(),today.getMonth(),1);renderCalendar()};
 $('#calendarJump').onchange=e=>{const [y,mo,d]=e.target.value.split('-').map(Number);if(!y||!mo||!d)return;selectedDate=new Date(y,mo-1,d);month=new Date(y,mo-1,1);renderCalendar()};
 app.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{selectedDate=new Date(year,m,Number(b.dataset.day));renderCalendar()});
}

nterval=setInterval(refresh,200);$('#timerToggle').onclick=()=>{if(timerRunning){timerRemaining=Math.max(0,timerEnd-Date.now());timerRunning=false}else{const ms=timerRemaining||(Math.max(0,Math.min(999,Number($('#timerMinutes').value)||0))*60+Math.max(0,Math.min(59,Number($('#timerSeconds').value)||0)))*1000;if(ms<=0){toast('请设置计时时长');return}timerEnd=Date.now()+ms;timerRunning=true;timerRemaining=ms}renderClock(t)};$('#timerCancel').onclick=()=>{timerRunning=false;timerRemaining=0;renderClock(t)}}}

const GIFTS={flowers:{name:'小花束',cost:8000,affection:2,guard:0,likes:['q']},book:{name:'文学小说',cost:12000,affection:3,guard:0,likes:['ju']},comic:{name:'漫画单行本',cost:15000,affection:3,guard:0,likes:['sun','young']},dog:{name:'小狗零食礼包',cost:18000,affection:4,guard:0,likes:['ju','young','q']},chicken:{name:'炸鸡分享券',cost:20000,affection:4,guard:0,likes:['jae']},movie:{name:'电影票',cost:25000,affection:5,guard:0,likes:['q']},headphones:{name:'无线运动耳机',cost:80000,affection:9,guard:2,likes:['sun','q']},camera:{name:'拍立得相机',cost:120000,affection:12,guard:4,likes:['q']},collector:{name:'文学典藏书套装',cost:180000,affection:15,guard:6,likes:['ju']},sneakers:{name:'专业运动鞋',cost:200000,affection:17,guard:7,likes:['jae']},telescope:{name:'天文望远镜',cost:220000,affection:18,guard:8,likes:['young']},console:{name:'便携游戏机',cost:250000,affection:20,guard:10,likes:['sun']}};

function emptyFunding(){return {target:null,paidWeeks:{},bookings:{},transactions:[],outbox:[],delivered:0}}
function hydrateFunding(s){s.funding||=emptyFunding();s.bankrupt??=false;if(s.configured&&s.identity==='ordinary'&&s.baseline.money===100000){if(!s.completed&&!s.bankrupt)s.attributes.money+=1100000;s.baseline.money=1200000}s.economyVersion=2;s.festivalPlan??=null;s.finalResult??=null;if(s.day===44&&s.completed&&!s.expelled&&!s.finalResult)s.finalResult=calculateFinal(s);return s}
const clamp=(n,min=0,max=100)=>Math.max(min,Math.min(max,n));
function create(options={}){const identity=options.identity||'ordinary',p=PROFILES[identity];if(!p)throw Error('请选择有效身份');return {version:2,day:0,grade:options.grade||'高二',identity,configured:options.configured!==false,baseline:{money:p.money,affection:p.affection,guard:p.guard,rate:p.rate},plan:['数学','语文','美术','体育'],settlements:{},clubVisits:{},dateAttempts:{},weekendActivities:{},chatRewards:{},attendance:Object.fromEntries(SUBJECTS.map(x=>[x,0])),sports:null,exam:null,festival:null,expelled:false,bankrupt:false,funding:emptyFunding(),attributes:{knowledge:0,logic:0,eq:0,talent:0,fame:0,money:p.money,specialtyCount:0,totalClasses:0},relations:Object.fromEntries(IDS.map(id=>[id,{affection:p.affection,guard:p.guard,bond:0}])),history:[],generatedPosts:[],completed:false}}
function validate(s){
 if(!s||![1,2].includes(s.version)||!Number.isInteger(s.day)||s.day<0||s.day>=LIMIT||!['高一','高二','高三'].includes(s.grade)||!Array.isArray(s.plan)||s.plan.length!==4||s.plan.some(x=>!SUBJECTS.includes(x))||typeof s.completed!=='boolean')throw Error('校历存档格式不正确');
 for(const k of ['knowledge','logic','eq','talent','fame','money','specialtyCount','totalClasses'])if(!Number.isFinite(s.attributes?.[k])||s.attributes[k]<0||s.attributes[k]>100000000)throw Error('属性存档格式不正确');
 for(const k of ['logic','eq','talent'])if(s.attributes[k]>100)throw Error('属性超出范围');
 for(const id of IDS){const r=s.relations?.[id];if(!r||!Number.isFinite(r.affection)||!Number.isFinite(r.guard)||r.affection<0||r.affection>100||r.guard<0||r.guard>100||!Number.isInteger(r.bond)||r.bond<0)throw Error('关系存档格式不正确')}
 for(const k of ['settlements','clubVisits','dateAttempts','chatRewards'])if(!s[k]||typeof s[k]!=='object'||Array.isArray(s[k]))throw Error('日程存档格式不正确');
 for(const [day,r] of Object.entries(s.settlements))if(!/^\d+$/.test(day)||Number(day)>s.day||Number(day)%7>=5||r?.day!==Number(day)||!Array.isArray(r.plan)||r.plan.length!==4||r.plan.some(x=>!SUBJECTS.includes(x))||!r.gains||!['knowledge','logic','eq','talent','fame','money'].every(k=>Number.isFinite(r.gains[k])&&r.gains[k]>=0))throw Error('课程结算记录不正确');

 for(const [day,r] of Object.entries(s.dateAttempts))if(!/^\d+$/.test(day)||Number(day)>s.day||Number(day)%7<5||r?.day!==Number(day)||!IDS.includes(r.id)||!['咖啡店','电影院','公园'].includes(r.place)||typeof r.accepted!=='boolean'||!Number.isFinite(r.chance)||r.chance<0||r.chance>1)throw Error('约会记录不正确');
 if(!Array.isArray(s.history)||s.history.length>2000||!Array.isArray(s.generatedPosts)||s.generatedPosts.length>400||s.generatedPosts.some(p=>typeof p.id!=='string'||!/^p-campus-\d+-\d+$/.test(p.id)||!['title','body','author','tag'].every(k=>typeof p[k]==='string')||!Array.isArray(p.comments)))throw Error('校园记录格式不正确');
 if(s.history.some(h=>!h||!Number.isInteger(h.day)||h.day<0||h.day>s.day||typeof h.text!=='string'||!['classes','club','date','chat','ending','work','sports','help','exam','festival','enrollment','sponsor','gift','support','service','weekly','reservation','refund','bankruptcy','final'].includes(h.type)))throw Error('校园经历格式不正确');
 if(s.funding){const f=s.funding;if(f.target!==null&&!IDS.includes(f.target)||!f.paidWeeks||!f.bookings||!Array.isArray(f.transactions)||!Array.isArray(f.outbox)||!Number.isInteger(f.delivered)||f.delivered<0||f.delivered>f.outbox.length||f.transactions.some(t=>!Number.isFinite(t.amount)||typeof t.text!=='string')||Object.values(f.bookings).some(b=>!b||!SERVICES[b.kind]||!IDS.includes(b.id)||!Number.isInteger(b.day)||b.day<0||b.day>=45||!['booked','completed','cancelled','missed'].includes(b.status)))throw Error('资助企划存档格式不正确')}
 if(s.version===2){if(!Object.hasOwn(PROFILES,s.identity)||typeof s.configured!=='boolean'||typeof s.expelled!=='boolean'||!s.weekendActivities||!s.baseline||!SUBJECTS.every(x=>Number.isInteger(s.attendance?.[x])&&s.attendance[x]>=0))throw Error('入学资料格式不正确');for(const [day,r] of Object.entries(s.weekendActivities))if(!/^\d+$/.test(day)||Number(day)>s.day||Number(day)%7<5||!['date','work'].includes(r?.type))throw Error('周末记录格式不正确');if(s.sports&&(!s.sports.legacySkipped&&(!Number.isInteger(s.sports.rank)||s.sports.rank<0||s.sports.rank>3||!s.sports.featured||!IDS.includes(s.sports.featured.id)||!['award','injury'].includes(s.sports.featured.type))))throw Error('运动会记录格式不正确');if(s.exam&&(!Number.isFinite(s.exam.score)||typeof s.exam.passed!=='boolean'))throw Error('考试记录格式不正确');if(s.festival&&(!s.festival.skipped&&!IDS.includes(s.festival.id)))throw Error('校园祭记录格式不正确')}
 if(s.festivalPlan){const p=s.festivalPlan;if(!FESTIVAL_ACTIVITIES.includes(p.activity)||!IDS.includes(p.selectedId)||!['refused','sponsor-choice','ready','completed'].includes(p.status)||!p.attempts)throw Error('校园祭策划记录不正确')}if(s.finalResult){const r=s.finalResult;if(!Number.isFinite(r.score)||r.score<0||r.score>750||!Number.isInteger(r.rank)||r.rank<1||!['grind','romance','shine','growth'].includes(r.ending?.id)||r.ending.character&&!IDS.includes(r.ending.character))throw Error('期末结局记录不正确')}
 return s;
}
function migrate(s){if(!s)return create({configured:false});validate(s);if(s.version===2)return hydrateFunding(s);s.version=2;s.identity='ordinary';s.configured=false;s.baseline={money:0,affection:12,guard:52,rate:1};s.weekendActivities=Object.fromEntries(Object.entries(s.dateAttempts).map(([day,r])=>[day,{type:'date',...r}]));s.attendance=Object.fromEntries(SUBJECTS.map(x=>[x,0]));for(const r of Object.values(s.settlements))for(const x of r.plan)s.attendance[x]++;s.expelled=false;s.sports=s.day>SPECIAL_DAYS.sports?{legacySkipped:true}:null;s.exam=s.day>SPECIAL_DAYS.exam?{score:Math.max(450,midtermScore(s)),passed:true,legacyGranted:true}:null;s.festival=s.day>SPECIAL_DAYS.festival?{skipped:true,legacySkipped:true}:null;return hydrateFunding(s)}
function configure(s,identity,grade){if(s.configured)throw Error('入学身份与年级已经确定，开始新故事才能重新选择。');const p=PROFILES[identity];if(!p||!['高一','高二','高三'].includes(grade))throw Error('请选择身份和年级');const old=s.baseline;s.attributes.money=p.money+Math.max(0,s.attributes.money-old.money);for(const r of Object.values(s.relations)){r.affection=round(clamp(p.affection+Math.max(0,r.affection-old.affection)*p.rate/old.rate));r.guard=clamp(p.guard-Math.max(0,old.guard-r.guard))}s.identity=identity;s.grade=grade;s.configured=true;s.baseline={money:p.money,affection:p.affection,guard:p.guard,rate:p.rate};log(s,'enrollment','完成入学登记');return s}
function profile(s){return PROFILES[s.identity]||PROFILES.ordinary}
function address(s,id,name='同学'){const playerGrade={'高一':1,'高二':2,'高三':3}[s.grade],base=playerGrade>CHARACTER_GRADES[id]?'学姐':playerGrade<CHARACTER_GRADES[id]?'学妹':'同学',a=s.relations[id].affection;let nickname=name;const han=Array.from(name).filter(c=>/\p{Script=Han}/u.test(c));if(han.length)nickname='小'+han.at(-1);return {base,preferred:a<35?base:a<70?name:nickname,phase:a<35?'礼貌称呼':a<70?'直呼名字':'亲近昵称'}}
function special(day){return day===SPECIAL_DAYS.sports?'sports':day===SPECIAL_DAYS.exam?'exam':day===SPECIAL_DAYS.festival?'festival':day===SPECIAL_DAYS.final?'final':null}
function date(day){if(!Number.isInteger(day)||day<0||day>=LIMIT)throw Error('日期超出校历');const month=day<30?9:10,d=day<30?day+1:day-29;return {day,month,date:d,weekday:day%7,week:Math.floor(day/7)+1,label:month+'月'+d+'日',weekLabel:['周一','周二','周三','周四','周五','周六','周日'][day%7],weekend:day%7>=5,wednesday:day%7===2,last:day===LIMIT-1}}
function active(s){if(s.completed)throw Error(s.bankrupt?'因破产已触发退学结局，本轮活动已结束。':s.expelled?'期中未合格，已触发退学结局。本轮活动已结束。':'本轮校历已结束，可查看回顾或导出存档。')}
function log(s,type,text,details={}){const item={day:s.day,type,text,...details};s.history.push(item);return item}
function stage(r){return r.affection<25?'初识':r.affection<50?'渐渐熟悉':r.affection<70?'心意靠近':r.affection<90?'特别在意':'深厚信任'}
function socialGain(s,affection,guard){return {affection:affection+Math.floor(s.attributes.eq/25),guard:guard+Math.floor(s.attributes.logic/35)}}
function changeRelation(s,id,gain){const r=s.relations[id];if(!r)throw Error('没有这位同学');const before={...r};r.affection=round(clamp(r.affection+gain.affection*(gain.fixed?1:profile(s).rate)));r.guard=clamp(r.guard-gain.guard);return {affection:round(r.affection-before.affection),guard:before.guard-r.guard}}
function mentions(s,name){
 const count=Math.min(4,Math.floor(s.attributes.fame/5));const today=s.generatedPosts.filter(p=>p.day===s.day).length;
 const titles=[`${name}最近在校园里越来越眼熟了`, `想认识一下${name}，有同学介绍吗`, `${name}的才华真的藏不住了`, `今天也在走廊听到有人提起${name}`];
 const bodies=[`最近常在活动里看到${name}。原来认真做自己喜欢的事，真的会被大家记住。`,`好几个人都提到了${name}。下次校园活动想一起打个招呼。`,`关于${name}的讨论又多了一点。有点期待下一次的校园展示。`,`本来只是随口聊起，没想到大家都知道${name}。校园里有一个名字慢慢变得熟悉了。`];
 for(let i=today;i<count;i++)s.generatedPosts.unshift({id:`p-campus-${s.day}-${i}`,day:s.day,author:['窗边听众','路过的同学','校园观察员','下课慢慢走'][i],title:titles[i],body:bodies[i],tag:'校园话题',comments:[],at:Date.UTC(2025,8,1+s.day,8,i)});
 return count-today;
}
function settle(s,plan,name='你'){
 active(s);if(special(s.day))throw Error('今天是特别校内活动日，请先完成活动。');if(date(s.day).weekend)throw Error('周末没有课程，可以安排校外约会或打工。');if(s.settlements[s.day])throw Error('今天的课程已结算，不能重复领取属性或奖励。');
 if(!Array.isArray(plan)||plan.length!==4||plan.some(x=>!SUBJECTS.includes(x)))throw Error('请安排上午两节、下午两节，共四节课程。');
 const a=s.attributes,before={...a};s.plan=plan.slice();
 for(const subject of plan){a.knowledge+=2;a.totalClasses++;s.attendance[subject]++;if(subject==='数学')a.logic=clamp(a.logic+3);else if(subject==='语文')a.eq=clamp(a.eq+3);else{a.talent=clamp(a.talent+3);a.specialtyCount++}}
 const rewards=Math.floor(a.specialtyCount/3)-Math.floor(before.specialtyCount/3);a.money+=rewards*30000;a.fame=Math.floor(a.talent/5);
 const gains=Object.fromEntries(Object.keys(a).map(k=>[k,a[k]-before[k]]));const result={day:s.day,plan:plan.slice(),gains,rewards};s.settlements[s.day]=result;mentions(s,name);
 log(s,'classes','完成四节课程',result);return result;
}
function club(s,id){
 active(s);if(!date(s.day).wednesday||special(s.day))throw Error('兴趣俱乐部只在普通周三傍晚开放。');if(!s.settlements[s.day])throw Error('先完成今天的四节课，再去俱乐部。');if(s.clubVisits[s.day])throw Error('今天已经参加过一个俱乐部。');const c=CLUBS[id];if(!c)throw Error('请选择一个俱乐部');
 const gains=Object.fromEntries(c.members.map(member=>[member,changeRelation(s,member,socialGain(s,8,7))]));const result={id,day:s.day,gains};s.clubVisits[s.day]=result;log(s,'club','参加'+c.name,result);return result;
}
function dateChance(s,id){const r=s.relations[id];if(!r)throw Error('没有这位同学');if(r.affection<50||r.guard>30)return 0;return Math.min(.95,.58+(r.affection-50)*.006+(30-r.guard)*.008)}
function invite(s,id,place,rng=Math.random){
 active(s);if(!date(s.day).weekend)throw Error('校外约会只在周末开放。');if(s.weekendActivities[s.day])throw Error('今天已经选择约会或打工，两者不能重复安排。');if(!['咖啡店','电影院','公园'].includes(place))throw Error('请选择约会地点');const chance=dateChance(s,id);const accepted=chance>0&&rng()<chance;const gains=accepted?changeRelation(s,id,socialGain(s,7,4)):{affection:0,guard:0};if(accepted)s.relations[id].bond++;
 const result={id,day:s.day,place,chance,accepted,gains};s.dateAttempts[s.day]=result;s.weekendActivities[s.day]={type:'date',...result};log(s,'date',accepted?'完成一次校外约会':'这次邀请被婉拒',result);return result;
}
function work(s,rng=Math.random){active(s);if(!date(s.day).weekend)throw Error('打工只在周末开放。');if(s.weekendActivities[s.day])throw Error('今天已经选择约会或打工，两者不能重复安排。');const p=profile(s);let id=null,gains=null;if(s.identity==='ordinary'&&rng()<.35){id=IDS[Math.min(4,Math.floor(rng()*5))];gains=changeRelation(s,id,{affection:5+Math.floor(s.attributes.eq/25),guard:0})}const result={type:'work',day:s.day,job:p.job,pay:p.pay,id,gains};s.attributes.money+=p.pay;s.weekendActivities[s.day]=result;log(s,'work','完成'+p.job,result);return result}
function sportsRank(s){const n=s.attendance['体育'];return n>=10?1:n>=7?2:n>=4?3:0}
function sports(s,registered,rng=Math.random){active(s);if(s.day!==SPECIAL_DAYS.sports)throw Error('运动会在9月12日开放。');if(s.sports)throw Error('运动会已经结算。');if(typeof registered!=='boolean')throw Error('请选择是否报名');const rank=registered?sportsRank(s):0,reward={0:0,1:500000,2:300000,3:150000}[rank];const featured={id:IDS[Math.min(4,Math.floor(rng()*5))],type:rng()<.5?'award':'injury',rank:1+Math.min(2,Math.floor(rng()*3)),helped:null};const gains=rank?Object.fromEntries(IDS.map(id=>[id,changeRelation(s,id,{affection:10,guard:0,fixed:true})])):{};const result={registered,rank,reward,featured,gains};s.attributes.money+=reward;s.sports=result;log(s,'sports',registered?(rank?'运动会获得第'+rank+'名':'参加运动会，未获得名次'):'在场边观看运动会',{gains});log(s,'sports',featured.type==='award'?'在运动会获得第'+featured.rank+'名':'在运动会比赛中受伤',{id:featured.id});return result}
function helpInjury(s,help){active(s);const event=s.sports?.featured;if(s.day!==SPECIAL_DAYS.sports||!event||event.type!=='injury'||event.helped!==null)throw Error('当前没有待处理的受伤事件。');if(typeof help!=='boolean')throw Error('请选择是否帮忙');const gains=help?changeRelation(s,event.id,{affection:5,guard:0,fixed:true}):{affection:0,guard:0};event.helped=help;event.gains=gains;log(s,'help',help?'送同学到医务室':'请校医前来照看',{id:event.id,gains});return event}
function midtermScore(s){return Math.min(750,Math.round(s.attributes.knowledge*3.4+s.attributes.logic*2+s.attributes.eq*2))}

function ensure(game){if(!game.dialogue)game.dialogue={version:1,serial:0,pending:Object.fromEntries(IDS.map(id=>[id,[]])),seen:{},answered:[]};const d=game.dialogue;for(const id of IDS)for(const f of d.pending[id]){f.phase||='player';if(!f.meta)f.meta=game.chats[id].find(m=>m.choiceId===f.key)?.scriptMeta||{}}return d}

 if(step===1){$('#onboardName').onsubmit=e=>{e.preventDefault();const name=$('#playerName').value.trim();if(!name){$('#onboardError').textContent='请先填写你的名字。';return}onboarding(2,{...draft,name})};$('#playerName').focus()}
 else{el.querySelectorAll('[name="identity"]').forEach(r=>r.onchange=()=>{el.querySelectorAll('.identity-option').forEach(o=>o.classList.toggle('selected',o.contains(r)));$('#customIdentity').disabled=r.value!=='custom'});$('#backToName').onclick=()=>onboarding(1,draft);$('#onboardIdentity').onsubmit=e=>{e.preventDefault();const custom=el.querySelector('[name="identity"]:checked').value==='custom';const identity=custom?$('#customIdentity').value.trim():'待设定身份';if(!identity){$('#onboardError').textContent='请填写自定义身份。';return}game.player={...(game.player||{}),name:draft.name,identity};if(!saveCampus())return;el.remove();app.inert=false;$('#homeButton').inert=false;$('#lockToggle').disabled=false;unlockCampus();toast('欢迎入学，'+game.player.name)}}

async function initializeApi(){try{const [s,t]=await Promise.all([campusApiFetch('/api/status',{cache:'no-store'}),campusApiFetch('/api/session',{cache:'no-store'})]);const status=await s.json(),session=await t.json();apiState={...status,keyMode:window.CampusApiPreferences.mode()};if(window.CampusApiPreferences.hasPersonalKey())apiState.configured=true;if(!t.ok||!session.token)throw Error(session.error||'连接暂不可用');campusToken=session.token}catch(e){apiState={configured:false,error:e.message}}}
function renderChat(id){activeContact=id;game.read[id]=game.chats[id].length;saveCampus();const c=C[id];app.className='app kkt-conversation';app.innerHTML=`<header class="campus-top"><button data-kkt-back aria-label="返回聊天列表">‹</button><h2>${c.name}</h2><span style="width:calc(var(--phone-u, 1vw) * 8)"></span></header><div class="kkt-stream" id="campusStream"></div><div id="campusChatError"></div><div class="typing" id="campusTyping" aria-live="polite"></div><form class="kkt-compose" id="campusCompose"><textarea id="campusInput" rows="1" maxlength="2000" aria-label="发送给${c.name}的消息" placeholder="发送消息…"></textarea><button id="campusSend">发送</button></form>`;$('#campusInput').value=game.drafts[id]||'';$('#campusInput').oninput=e=>{game.drafts[id]=e.target.value;saveCampus()};$('#campusInput').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();$('#campusCompose').requestSubmit()}};$('#campusCompose').onsubmit=e=>{e.preventDefault();sendCampus(id)};paintChat(id)}
function paintChat(id){if(current!=='kakao'||activeContact!==id||!$('#campusStream'))return;const c=C[id];$('#campusStream').innerHTML=`<div class="kkt-day">${schoolDate().label} · ${schoolDate().weekLabel}</div>`+game.chats[id].map(m=>`<div class="kkt-message ${m.role==='user'?'me':''}">${m.role==='assistant'?av(id):''}<div class="text-wrap">${m.role==='assistant'?`<div class="name">${c.name}</div>`:''}<div class="kkt-bubble">${escapeHTML(m.content)}</div><time>${timeLabel(m.at)}</time></div></div>`).join('');$('#campusStream').scrollTop=$('#campusStream').scrollHeight;$('#campusTyping').textContent=sending.has(id)?c.name+' 正在输入…':'';$('#campusSend').disabled=sending.has(id);$('#campusSend').textContent=sending.has(id)?'等待':'发送';$('#campusChatError').innerHTML=chatErrors[id]?`<div class="chat-error" role="alert">${escapeHTML(chatErrors[id])}<button data-retry="${id}">重试这条消息</button></div>`:'';game.read[id]=game.chats[id].length;saveCampus()}
async function sendCampus(id,retry=false){if(sending.has(id))return;if(!retry){if(chatErrors[id]){toast('请先重试上一条未完成的消息。');return}const text=$('#campusInput')?.value.trim();if(!text)return;game.chats[id].push({role:'user',content:text,at:Date.now()});game.drafts[id]='';$('#campusInput').value='';saveCampus()}sending.add(id);delete chatErrors[id];saveCampus();paintChat(id);try{if(!campusToken)await initializeApi();if(!campusToken)throw Error(apiState.error||'聊天连接暂时不可用，请稍后重试。');const rewardDay=game.school.day;const contextStart=Math.max(game.contextStart[id]||0,game.chats[id].length-80);const res=await campusApiFetch('/api/chat',{method:'POST',headers:window.CampusApiPreferences.chatHeaders({'Content-Type':'application/json','x-phone-token':campusToken}),body:JSON.stringify({chatId:id,player:game.player,messages:game.chats[id].slice(contextStart).map(({role,content})=>({role,content})),memory:game.memories[id]||'',gameState:Sim.context(game.school,id,game.player.name)})});const data=await res.json();if(!res.ok){if(res.status===403)campusToken='';throw Error(data.error||'回复没有送达。')}if(game.school.day===rewardDay&&!game.school.completed){const socialChange=Sim.chatReward(game.school,id);if(socialChange)showRelationChange(id,socialChange);saveCampus()}game.memories[id]=data.memory||game.memories[id];if(data.consumed)game.contextStart[id]=contextStart+data.consumed;for(const text of data.messages||[data.reply]){if(!text)continue;await new Promise(r=>setTimeout(r,Math.min(1500,350+text.length*25)));receiveLive(id,text);saveCampus();paintChat(id)}apiState.configured=true;}catch(e){chatErrors[id]=e.message||'回复没有送达，请重试。'}finally{sending.delete(id);paintChat(id);if(current==='kakao'&&!activeContact)renderKkt();refreshHome()}}

function renderCampusSettings(){const status=apiState.configured?'已连接 · Gemini 自动回复':apiState.error?'连接暂时不可用，可重新检查':'正在检查聊天连接';app.innerHTML=campusTop('设置与存档')+`<div class="campus-body"><div class="campus-card"><span class="eyebrow">MY PROFILE</span><form id="playerForm" class="campus-form"><label>玩家姓名 / KKT 名字<input id="editPlayerName" required maxlength="16" value="${escapeHTML(game.player.name)}"></label><label>玩家身份<input id="editPlayerIdentity" readonly required maxlength="80" value="${escapeHTML(game.player.identity)}"></label><button class="campus-primary">保存资料</button></form></div><div class="campus-card"><span class="eyebrow">CONNECTION</span><h3>聊天连接</h3><p id="apiStatusText">${status}</p><button class="campus-secondary" id="checkCampusApi">检查连接</button><small class="campus-muted">每位角色有独立记忆；触及共享额度时可稍后重试。</small></div><div class="campus-card"><span class="eyebrow">SAVE / LOAD</span><h3>把故事好好保存。</h3><p>自动保存在当前浏览器。切换设备前可导出文件。</p><button class="campus-secondary" id="exportCampus">导出存档</button><label class="campus-secondary" style="margin-top:calc(var(--phone-u, 1vw) * 3);cursor:pointer">导入存档<input id="importCampus" type="file" accept="application/json,.json" hidden></label><p class="campus-muted">导入会替换当前故事，请先导出备份。</p><button class="campus-secondary campus-danger" id="resetCampus">开始新的故事</button></div><div class="campus-muted">校园记录 / 0.2<br>课程、活动、论坛与资助记录保存在当前浏览器。<br>AI 回复由所选服务商提供，消息会发送至对应模型服务。<br>角色属于虚构校园平行世界。</div></div>`;$('#playerForm').onsubmit=e=>{e.preventDefault();const name=$('#editPlayerName').value.trim(),identity=$('#editPlayerIdentity').value.trim();if(!name||!identity)return;game.player={...game.player,name,identity};saveCampus();refreshHome();toast('资料已保存，KKT 名字已同步')};$('#checkCampusApi').onclick=async e=>{e.target.disabled=true;$('#apiStatusText').textContent='正在检查…';await initializeApi();renderCampusSettings()};$('#exportCampus').onclick=()=>{const blob=new Blob([JSON.stringify(game,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='得比高中-存档-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('#importCampus').onchange=async e=>{try{const file=e.target.files[0];if(!file)return;if(file.size>5230108)throw Error('存档过大');const data=JSON.parse(await file.text());validateCampusSave(data);if(sending.size){toast('请等待当前回复完成后导入。');return}confirmGameAction('导入将替换当前故事。已导出备份并继续吗？',()=>{game=data;saveCampus();location.reload()})}catch(err){toast('无法导入：'+err.message)}};$('#resetCampus').onclick=()=>{if(sending.size){toast('请等待当前回复完成。');return}if(confirm('开始新故事会清除当前校园存档。已导出备份并继续吗？')){localStorage.removeItem(CAMPUS_KEY);location.reload()}};}
function validateCampusSave(d){if(d?.dialogue)window.CampusDialogue.validate(d.dialogue);if(d?.proactive)window.CampusStories.validate(d.proactive);if(d?.school)Sim.validate(d.school);if(!d||d.version!==1||typeof d.player?.name!=='string'||!d.player.name.trim()||d.player.name.length>16||typeof d.player.identity!=='string'||d.player.identity.length>80||typeof d.nickname!=='string'||d.nickname.length>20||!d.chats||!d.memories||!d.read||!d.drafts||!Array.isArray(d.posts)||!Array.isArray(d.likes)||!d.comments)throw Error('不是有效的校园存档');for(const id of Object.keys(C)){if(!Array.isArray(d.chats[id])||d.chats[id].length>10000||typeof d.memories[id]!=='string'||d.memories[id].length>16000||d.chats[id].some(m=>!['user','assistant'].includes(m.role)||typeof m.content!=='string'||m.content.length>6000||!Number.isFinite(m.at))||!Number.isInteger(d.read[id])||typeof(d.drafts[id]||'')!=='string')throw Error('聊天记录格式不正确')}if(d.posts.length>2000||d.posts.some(p=>typeof p.id!=='string'||!/^[ps][a-zA-Z0-9-]+$/.test(p.id)||!['title','body','author','tag'].every(k=>typeof p[k]==='string')||!Array.isArray(p.comments)))throw Error('帖子格式不正确');if(d.contextStart&&(typeof d.contextStart!=='object'||Object.values(d.contextStart).some(v=>!Number.isInteger(v)||v<0)))throw Error('记忆游标格式不正确');if(d.errors&&(typeof d.errors!=='object'||Object.values(d.errors).some(v=>typeof v!=='string')))throw Error('消息状态格式不正确');for(const v of Object.values(d.comments)){if(!Array.isArray(v)||v.some(c=>typeof c.author!=='string'||typeof c.text!=='string'))throw Error('评论格式不正确')}}

function schoolCalendar(){const s=game.school,chosen=Sim.date(inspectDay);return `<div class="school-calendar-intro"><span class="eyebrow">9.1 — 10.15 / 45 DAYS</span><h3>这一个半月，慢慢来。</h3><p>9 月 1 日为周一。普通工作日上课，周三傍晚社团，周末约会或打工；特别日期以当天活动为准。</p></div><div class="calendar-event-legend"><span class="event-sports">9月12日 · 运动会</span><span class="event-exam">9月23日 · 期中考试</span><span class="event-festival">9月25日 · 校园祭</span><span class="event-final">10月15日 · 期末考试</span></div>${[9,10].map(month=>{const days=Array.from({length:Sim.LIMIT},(_,i)=>Sim.date(i)).filter(d=>d.month===month),offset=days[0].weekday;return `<section class="school-month"><h3>${month}月</h3><div class="school-calendar-week">${['一','二','三','四','五','六','日'].map(x=>`<span>${x}</span>`).join('')}</div><div class="school-calendar-grid">${'<span></span>'.repeat(offset)}${days.map(d=>`<button data-inspect-day="${d.day}" class="${d.day===s.day?'today ':''}${d.day===inspectDay?'selected ':''}${d.day<s.day?'past ':''}${d.weekend?'weekend':''}${Sim.special(d.day)?' school-event event-'+Sim.special(d.day):''}" aria-label="${d.label}${d.weekLabel}${d.day===s.day?'，今天':''}"><b>${d.date}</b><small>${d.day===0?'开学':d.last?'期末考试':Sim.special(d.day)?({sports:'运动会',exam:'期中考试',festival:'校园祭',final:'期末考试'})[Sim.special(d.day)]:d.wednesday?'社团':d.weekend?'周末':'课程'}</small>${s.settlements[d.day]||s.dateAttempts[d.day]?'<i></i>':''}</button>`).join('')}</div></section>`}).join('')}<div class="campus-card school-calendar-detail"><strong>${chosen.label} ${chosen.weekLabel}</strong><p>${chosen.day===0?'开学日 · ':''}${chosen.last?'本轮最后一天 · ':''}${Sim.special(chosen.day)?({sports:'运动会，可报名比赛或观看，并参与同学剧情。',exam:'期中考试，450分合格，未合格将退学。',festival:'期中两天后的校园祭，选择活动并邀请同学一起策划。',final:'今天只进行期末考试，之后查看总排名与本轮结局。'})[Sim.special(chosen.day)]:chosen.wednesday?'上午下午共四节课，傍晚可以参加一个俱乐部。':chosen.weekend?'无课程，可选择一次约会或打工。':'自由安排四节课，结算后进入下一天。'}</p><small>${s.settlements[chosen.day]?'已上课：'+s.settlements[chosen.day].plan.join('、'):chosen.day<s.day?'当天已结束':chosen.day===s.day?'这是你正在经历的一天':'仅预览安排，不会跳过日期'}${s.clubVisits[chosen.day]?' · '+Sim.CLUBS[s.clubVisits[chosen.day].id].name:''}${s.dateAttempts[chosen.day]?' · 约会邀请'+(s.dateAttempts[chosen.day].accepted?'成功':'被婉拒'):''}</small></div><button class="campus-secondary" data-today-school>回到今天</button>`}

function schoolActivities(){const s=game.school,d=schoolDate();return schoolBanner()+(s.completed?'<div class="school-tip">本轮活动已结束，可以在成长页查看记录。</div>':'')+`<section class="school-activity-section"><span class="eyebrow">WEDNESDAY / AFTER CLASS</span><h3>周三傍晚，去哪里待一会儿。</h3><p class="school-copy">每天只参加一个俱乐部。动漫社可以同时和金善旴、金泳勋相处。</p>${Object.entries(Sim.CLUBS).map(([id,c])=>{const visited=s.clubVisits[s.day]?.id===id,enabled=!s.completed&&d.wednesday&&!!s.settlements[s.day]&&!s.clubVisits[s.day];return `<article class="campus-card school-club"><div class="school-club-people">${c.members.map(member=>av(member)).join('')}</div><div><h4>${c.name}</h4><p>${c.members.map(member=>C[member].name).join('、')}</p></div><button data-visit-club="${id}" ${enabled?'':'disabled'}>${visited?'已参加':!d.wednesday?'周三开放':!s.settlements[s.day]?'下课后开放':s.clubVisits[s.day]?'今日已安排':'参加'}</button></article>`}).join('')}${s.clubVisits[s.day]?activityResult(s.clubVisits[s.day],'club'):''}</section><section class="school-activity-section"><span class="eyebrow">SATURDAY & SUNDAY</span><h3>试着把邀请发出去。</h3><p class="school-copy">选择想见的人和地点，发出邀请后，去KKT看看他的回复。</p><form class="campus-form" id="dateForm"><label for="dateWho">约谁见面<select id="dateWho" ${s.completed||!d.weekend||s.dateAttempts[s.day]?'disabled':''}>${Object.entries(C).map(([id,c])=>`<option value="${id}" ${s.dateAttempts[s.day]?.id===id?'selected':''}>${c.name}</option>`).join('')}</select></label><label for="datePlace">去哪里<select id="datePlace" ${s.completed||!d.weekend||s.dateAttempts[s.day]?'disabled':''}>${['咖啡店','电影院','公园'].map(place=>`<option ${s.dateAttempts[s.day]?.place===place?'selected':''}>${place}</option>`).join('')}</select></label><button class="campus-primary" ${s.completed||!d.weekend||s.dateAttempts[s.day]?'disabled':''}>${s.dateAttempts[s.day]?'今天已经发出邀请':d.weekend?'发出约会邀请':'周末开放'}</button></form>${s.dateAttempts[s.day]?activityResult(s.dateAttempts[s.day],'date'):''}</section>`+(d.weekend?nextDayButton():'')}
function dateChanceText(id){const chance=Sim.dateChance(game.school,id);return chance===0?'当前未达到邀请条件，本次邀请一定会被婉拒。':'当前接受概率约 '+Math.round(chance*100)+'%，最终结果在发出邀请时确定。'}
function activityResult(r,type){if(type==='club')return '<div class="school-settlement"><strong>'+Sim.CLUBS[r.id].name+'的傍晚</strong>'+Object.entries(r.gains).map(([id,change])=>'<p>'+C[id].name+'：'+relationText(change)+'</p>').join('')+'</div>';return '<div class="school-settlement"><strong>'+C[r.id].name+(r.accepted?'答应了你的预约':'婉拒了这次邀请')+'</strong><p>'+(r.accepted?'预约已确认，去KKT回应他吧。':'今天的邀请机会已使用，去KKT看看他的消息吧。')+'</p><p>'+relationText(r.gains)+'</p></div>'}

function growth(){const s=game.school,a=s.attributes;return schoolBanner()+`<h3>今天的你</h3><div class="school-attributes">${[['knowledge','学识'],['logic','逻辑'],['eq','情商'],['talent','才华'],['fame','名气']].map(([k,title])=>`<div><span>${title}</span><strong>${a[k]}</strong><small>${{knowledge:'成绩随之提高',logic:'更容易卸下警戒',eq:'更容易增加好感',talent:'被更多同学看见',fame:'每天最多 '+Math.min(4,Math.floor(a.fame/5))+' 篇话题'}[k]}</small></div>`).join('')}<div><span>零用钱</span><strong class="money-value">${money(a.money)}</strong><small>才艺课每三节奖励 ₩30,000</small></div></div><h3>慢慢靠近的人</h3><p class="school-copy">关系数值越亲近，聊天语气也会随经历变化。数值不会自动替你确认恋爱关系。</p>${Object.entries(C).map(([id,c])=>{const r=s.relations[id];return `<article class="campus-card school-relationship"><header>${av(id)}<div><strong>${c.name}</strong><small>${c.grade} · ${Sim.stage(r)}</small></div><button data-school-chat="${id}">聊一聊</button></header><div class="relation-meter"><span>好感 ${r.affection}</span><i><b style="width:${r.affection}%"></b></i></div><div class="relation-meter guard"><span>警戒 ${r.guard}</span><i><b style="width:${r.guard}%"></b></i></div><p>校外约会 ${r.bond} 次</p></article>`}).join('')}<details class="school-rules"><summary>查看属性与关系规则</summary><p>每节课学识 +2，对应逻辑／情商／才华 +3（最高 100）。名气为才华 ÷5 取整，每 5 点名气每天多一篇校园话题，最多四篇。</p><p>每位同学每天第一次成功聊天后，好感 +2、警戒 −1；社团基础为好感 +8、警戒 −7；成功约会基础为好感 +7、警戒 −4。情商每 25 点额外增加 1 点好感，逻辑每 35 点额外降低 1 点警戒。没有每日自然衰减。</p><p>初始好感 12、警戒 52；两项范围均为 0–100。拒绝邀请不会扣分。每周三仅一个社团，每个周末日仅一次邀请。</p></details><h3>最近的校园记录</h3>${s.history.slice(-12).reverse().map(h=>`<div class="school-history"><small>${Sim.date(h.day).label}</small><span>${escapeHTML(h.text)}${h.id&&C[h.id]?' · '+C[h.id].name:''}</span></div>`).join('')||'<p class="school-copy">第一份记录，等待今天开始。</p>'}`}
function ranking(){
 const s=game.school;const npcNames=['许知远','韩书允','宋书辰','林时安','吴宥真','崔恩书','朴知夏','郑叙言','韩允成','尹多恩','宋知然','白书妍','姜以安','吴世林','林知宥','崔时雨','金在熙','申夏恩','郑宇辰','朴诗恩','柳知勋','安书妍','宋时律','姜恩夏','韩知温','尹知河','许在允','郑时安'];
 const rows=npcNames.map((name,i)=>({name,score:Math.max(405,727-i*11-(schoolGrade==='高三'?0:schoolGrade==='高二'?5:10))}));
 for(const [id,c] of Object.entries(C))if(c.grade===schoolGrade)rows.push({name:c.name,score:{jae:683,young:679,q:671,ju:662,sun:656}[id]});
 if(s.grade===schoolGrade)rows.push({name:game.player.name,score:Sim.score(s),self:true});rows.sort((a,b)=>b.score-a.score||Number(!!a.self)-Number(!!b.self));
 const self=rows.findIndex(r=>r.self);return `<div class="school-ranking-head"><span class="eyebrow">${s.grade} · 当前成绩</span><strong>${Sim.score(s)}<small>/ 750</small></strong><p>学识和属性结算后立即更新。${schoolGrade===s.grade?'当前年级第 '+(self+1)+' 名。':'切换到 '+s.grade+' 查看自己的年级排名。'}</p></div><nav class="campus-tabs">${['高一','高二','高三'].map(g=>`<button data-grade="${g}" class="${schoolGrade===g?'active':''}">${g}</button>`).join('')}</nav><table class="rank-table"><thead><tr><th>名次</th><th>姓名</th><th>总分</th></tr></thead><tbody>${rows.map((r,i)=>`<tr class="${r.self?'self':''}"><td>${i+1}</td><td>${escapeHTML(r.name)}${r.self?'<small style="display:block;font-size:calc(var(--phone-u, 1vw) * 2.5)">我</small>':''}</td><td>${r.score}</td></tr>`).join('')}</tbody></table><p class="school-copy">成绩 = 400 + 学识×1.1 + 逻辑×0.2 + 情商×0.2，上限 750。其他同学成绩是本轮固定的游戏基准。可在“我的”修改玩家年级。</p>`;
}
function schoolForum(){const count=game.school.generatedPosts.filter(p=>p.day===game.school.day).length;return `<div class="school-forum-head"><span>校园论坛</span><small>名气 ${game.school.attributes.fame} · 今日与你有关的话题 ${count} 篇</small></div><input id="forumSearch" class="forum-search" placeholder="搜索校园里的小事" aria-label="搜索论坛" value="${escapeHTML(forumQuery)}"><div id="forumPosts">${forumPosts()}</div>`}
function schoolMe(){return `<div class="campus-card"><h3>${escapeHTML(game.nickname||'取一个校园网名')}</h3><form id="nicknameForm" class="campus-form"><label for="forumNickname">论坛网名</label><input id="forumNickname" required maxlength="20" placeholder="你的校园网名" value="${escapeHTML(game.nickname)}"><small>KKT 名字：${escapeHTML(game.player.name)}</small><label for="playerSchoolGrade">我的年级</label><select id="playerSchoolGrade">${['高一','高二','高三'].map(g=>`<option ${game.school.grade===g?'selected':''}>${g}</option>`).join('')}</select><button class="campus-primary">保存校园资料</button></form></div><h3>我发布的帖子</h3>${game.posts.length?game.posts.map(p=>postCard(p)).join(''):'<p class="school-copy">还没有发布帖子。</p>'}<div class="school-tip">课程、活动、属性和聊天一起自动存档。可以到手机设置中导入或导出。</div>`}
function ending(){const s=game.school;return schoolBanner()+`<div class="campus-card school-ending"><span class="eyebrow">9.1 — 10.15</span><h3>一个半月，<br>留下了这些回声。</h3><p>你完成了 ${Object.keys(s.settlements).length} 天课程，参加 ${Object.keys(s.clubVisits).length} 次俱乐部活动，留下 ${s.history.filter(h=>h.type==='date'&&h.accepted).length} 次校外约会。</p><div class="school-final-score">${Sim.score(s)}<small>当前总分 / 750</small></div><p>累计才艺课 ${s.attributes.specialtyCount} 节 · 零用钱 ${money(s.attributes.money)}</p><button class="campus-secondary" data-school-tab="成长">查看关系与成长</button><button class="campus-secondary" data-school-settings>导出这段校园生活</button></div>`}
function bindSchoolForms(){
 if($('#timetableForm')){app.querySelectorAll('[name="subject"]').forEach(el=>el.onchange=()=>{game.school.plan=Array.from(app.querySelectorAll('[name="subject"]'),x=>x.value);saveCampus()});$('#timetableForm').onsubmit=e=>{e.preventDefault();schoolAction(()=>Sim.settle(game.school,Array.from(app.querySelectorAll('[name="subject"]'),x=>x.value),game.player.name))}}
 if($('#nextSchoolDay'))$('#nextSchoolDay').onclick=()=>schoolAction(()=>{const result=Sim.advance(game.school,game.player.name);inspectDay=game.school.day;return result});
 if($('#dateForm')){$('#dateForm').onsubmit=e=>{e.preventDefault();schoolAction(()=>{const r=Sim.invite(game.school,$('#dateWho').value,$('#datePlace').value);activityMessage(r,'date');return r})}}
 if($('#forumSearch'))$('#forumSearch').oninput=e=>{forumQuery=e.target.value;$('#forumPosts').innerHTML=forumPosts()};

function activityMessage(r,type){if(type==='date'){receiveDate(r);return}const c=Sim.CLUBS[r.id],texts={sun:'今天在动漫社聊得还挺开心。下周还来？',young:'今天的动漫社很有意思。下次给你留位置。',q:'刚才一起跳的那一段，要不要下次再练练？',ju:'读书会那本书，我把书签留着了。下周见。',jae:'今天的炸鸡还不错吧？下次你来挑口味。'};for(const id of c.members)receiveScripted(id,texts[id],'club',{club:r.id},'club-'+r.day+'-'+id)}

app.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.visitClub)schoolAction(()=>{const r=Sim.club(game.school,b.dataset.visitClub);activityMessage(r,'club');return r});if(b.hasAttribute('data-inspect-day')){inspectDay=Number(b.dataset.inspectDay);current==='calendar'?renderCalendar():renderSchool('校历')}if(b.hasAttribute('data-today-school')){inspectDay=game.school.day;current==='calendar'?renderCalendar():renderSchool('校历')}if(b.dataset.schoolChat){openApp('kakao');renderChat(b.dataset.schoolChat)}if(b.hasAttribute('data-school-settings'))openApp('settings')});

const beforeSemesterTimetable=timetable,beforeSemesterActivities=schoolActivities,beforeSemesterGrowth=growth,beforeSemesterMe=schoolMe,beforeSemesterEnding=ending,beforeSemesterBind=bindSchoolForms;
function semesterNotice(){const s=game.school;return `<section class="semester-notice"><b>${Sim.profile(s).name} · ${s.grade}</b><span>9/12 运动会　9/23 期中考试　9/25 校园祭　10/15 期末</span>${s.day<Sim.SPECIAL_DAYS.exam?`<p>期中预测 <strong>${Sim.midtermScore(s)} / 750</strong>，450 分合格。正常进度下，两科合计约7节即可合格；选得极少才可能退学。</p>`:s.exam?`<p>期中成绩 ${s.exam.score} / 750 · ${s.exam.passed?'合格':'未合格'}</p>`:''}</section>`}
nextDayButton=function(){const s=game.school,d=schoolDate(),can=Sim.ready(s);return `<div class="school-next"><button class="campus-primary" id="nextSchoolDay" ${s.completed||!can?'disabled':''}>${s.completed?s.expelled?'退学结局 · 本轮已结束':'本轮校历已完成':d.last?'完成本轮校历':'进入下一天　→'}</button><p>${s.completed?'可以查看记录、导出存档或开始新的故事。':!can?Sim.special(s.day)?'完成今日特别活动与剧情选择后进入下一天。':'完成今天的四节课后进入下一天。':'当天未选择的活动将被跳过。'}</p></div>`};
timetable=function(){const s=game.school,d=schoolDate();if(s.completed)return ending();if(Sim.special(s.day))return schoolBanner()+specialSchoolDay()+nextDayButton();if(d.weekend)return schoolBanner()+statStrip()+`<div class="campus-card weekend-card"><span class="eyebrow">ONE DAY, ONE CHOICE</span><h3>约会，或认真工作。</h3><p>一天只能选一个。发出约会邀请后，即使被婉拒，也不能再安排打工。</p><button class="campus-secondary" data-school-tab="活动">去安排周末</button></div>`+jobPanel()+nextDayButton();return beforeSemesterTimetable().replace('<div class="school-section-heading">',semesterNotice()+'<div class="school-section-heading">')};
schoolActivities=function(){const s=game.school;if(s.completed)return ending();if(Sim.special(s.day))return schoolBanner()+specialSchoolDay()+nextDayButton();let html=beforeSemesterActivities();const current=s.weekendActivities[s.day];if(current?.type==='work')html=html.replace(/(<form class="campus-form" id="dateForm">)([\s\S]*?)(<\/form>)/,(all,start,body,end)=>start+'<fieldset disabled class="semester-fieldset">'+body.replace('发出约会邀请','今天已经完成工作')+'</fieldset>'+end);return html.replace('<section class="school-activity-section"><span class="eyebrow">SATURDAY & SUNDAY</span>',jobPanel()+'<section class="school-activity-section"><span class="eyebrow">SATURDAY & SUNDAY</span>')};
function jobPanel(){const s=game.school,p=Sim.profile(s),work=s.weekendActivities[s.day],allowed=schoolDate().weekend&&!s.completed&&!work;return `<section class="campus-card semester-job"><span class="eyebrow">WEEKEND WORK</span><h3>${p.job}</h3><p>${p.name} · 本次收入 <strong>${money(p.pay)}</strong></p><small>${s.identity==='ordinary'?'咖啡店工作时，也许会遇见熟悉的同学。':'完成身份对应的周末工作后，收入直接进入零用钱。'}</small><button class="campus-secondary" data-weekend-work ${allowed?'':'disabled'}>${work?.type==='work'?'今天已完成工作':work?.type==='date'?'今天已安排约会':schoolDate().weekend?'开始今天的工作':'周末开放'}</button>${work?.type==='work'?`<div class="school-settlement"><strong>${money(work.pay)} 已到账</strong><p>${work.id?`在咖啡店遇到了${C[work.id].name}，聊了一会儿。好感 +${work.gains.affection}。`:'今天的工作顺利结束了。'}</p></div>`:''}</section>`}
function specialSchoolDay(){const type=Sim.special(game.school.day);return type==='sports'?sportsPage():type==='exam'?examPage():festivalPage()}
function sportsPage(){const s=game.school,r=s.sports;const list=`<p class="school-copy">体育课累计 ${s.attendance['体育']} 节。上满 4 节得第三名（₩150,000），7 节得第二名（₩300,000），10 节得第一名（₩500,000）。</p>`;if(!r)return `<div class="semester-event-heading"><span class="eyebrow">9.12 / SPORTS DAY</span><h3>跑道边，<br>有你想被看见的人。</h3><p>今天不排普通课程。你可以报名比赛，也可以在场边为大家加油。</p></div>${list}<form class="campus-form" id="sportsForm"><label class="semester-choice"><input type="radio" name="sportsJoin" value="yes" checked>报名参加运动会</label><label class="semester-choice"><input type="radio" name="sportsJoin" value="no">不报名，在场边观看</label><button class="campus-primary">开始运动会</button></form>`;
 if(r.legacySkipped)return '<div class="school-tip">运动会已随旧校历结束，原有进度已保留。</div>';
 const event=r.featured;return `<div class="semester-event-heading"><span class="eyebrow">SPORTS DAY / RESULTS</span><h3>${r.registered?r.rank?'你的努力被看见了。':'这一次，跑到了终点。':'在看台上，也留下了回忆。'}</h3></div>${list}<div class="school-settlement"><strong>${r.rank?'获得第 '+r.rank+' 名':r.registered?'完成比赛，未获得名次':'本次没有报名参赛'}</strong><p>${r.reward?`奖金 ${money(r.reward)}。${Object.entries(r.gains).map(([id,change])=>C[id].name+'：'+relationText(change)).join('；')}`:'没有扣除金钱或好感。'}</p></div><div class="semester-sport-members">${Sim.IDS.map(id=>`<span>${av(id)}<small>${C[id].name}</small></span>`).join('')}</div><article class="campus-card semester-story"><header>${av(event.id)}<strong>${C[event.id].name}</strong></header>${event.type==='award'?`<h3>他也站上了领奖台。</h3><p>${C[event.id].name}拿到了第 ${event.rank} 名。人群的掌声里，他朝看台望了一眼。</p><button class="campus-secondary" data-school-chat="${event.id}">去和他说句话</button>`:`<h3>比赛后，他停在了跑道边。</h3><p>${C[event.id].name}在比赛中受了伤，需要到医务室处理。你可以陪他过去，或者请校医来照看。</p>${event.helped===null?`<button class="campus-primary" data-sports-help="yes">送他去医务室</button><button class="campus-secondary" data-sports-help="no">请校医前来照看</button>`:`<div class="school-settlement">${event.helped?'你陪他去了医务室。'+relationText(event.gains):'校医已经前来照看他。'}</div>`}`}</article>`}
function examPage(){const s=game.school,r=s.exam;return `<div class="semester-event-heading"><span class="eyebrow">9.23 / MIDTERM</span><h3>试卷翻开之前，<br>那些努力都有痕迹。</h3><p>今天不排普通课程，期中满分 750，450 分为合格线。未合格会被退学，本轮校园生活立即结束。</p></div><div class="semester-exam-score"><small>${r?'期中成绩':'根据当前成长预测'}</small><strong>${r?r.score:Sim.midtermScore(s)}<span>/ 750</span></strong><p>学识 ×3.4 + 逻辑 ×2 + 情商 ×2</p></div>${r?`<div class="school-settlement"><strong>${r.passed?'考试合格，继续你的校园生活。':'考试未合格，已触发退学结局。'}</strong></div>`:`<button class="campus-primary" data-take-exam>参加期中考试并结算</button>`}`}
function festivalPage(){const s=game.school,r=s.festival;if(r)return `<div class="semester-event-heading"><span class="eyebrow">9.25 / SCHOOL FESTIVAL</span><h3>把今天，<br>夹进学期的书页里。</h3></div><div class="school-settlement"><strong>${r.id?C[r.id].name+'和你一起去了'+r.stall:'今天独自逛了逛校园祭'}</strong><p>${r.id?`好感 +${r.gains.affection}，警戒 −${r.gains.guard}。`:'自由逛逛也很好。'}</p></div>`;return `<div class="semester-event-heading"><span class="eyebrow">9.25 / SCHOOL FESTIVAL</span><h3>期中考完两天后，<br>校园热闹了起来。</h3><p>期中考试两天后的校园祭。今天不排普通课程，可以找一位同学一起逛，也可以独自走走。</p></div><form class="campus-form" id="festivalForm"><label for="festivalWho">和谁一起<select id="festivalWho">${Sim.IDS.map(id=>`<option value="${id}">${C[id].name}</option>`).join('')}<option value="solo">独自逛逛</option></select></label><label for="festivalStall">想去哪里<select id="festivalStall"><option>舞台演出</option><option>摄影摊位</option><option>校园小吃</option></select></label><small>把这一天安排成你想留下的回忆。</small><button class="campus-primary">留下这一天的回忆</button></form>`}
growth=function(){const s=game.school;let html=beforeSemesterGrowth();html=html.replace('<h3>今天的你</h3>',semesterNotice()+'<h3>今天的你</h3><p class="school-copy">体育课累计 '+s.attendance['体育']+' 节 · 入学身份：'+Sim.profile(s).name+'</p>');for(const id of Sim.IDS){const c=C[id],r=s.relations[id];html=html.replace(`<small>${c.grade} · ${Sim.stage(r)}</small>`,`<small>${c.grade} · ${Sim.stage(r)} · 称呼：${escapeHTML(Sim.address(s,id,game.player.name).preferred)}</small>`)}html=html.replace(/<details class="school-rules">[\s\S]*?<\/details>/,`<details class="school-rules"><summary>查看属性与关系规则</summary><p>当前身份：${Sim.profile(s).name}。常规好感成长为 ${Math.round(Sim.profile(s).rate*100)}%。体育获奖固定 +10，医务室帮助固定 +5，不受该倍率影响。</p><p>每天首次成功聊天基础好感 +2、警戒 −1；社团 +8／−7；成功约会 +7／−4。每25点情商额外增加1点基础好感，每35点逻辑额外降低1点警戒。好感35后直呼名字，70后可使用昵称。</p><p>每节课学识+2，数学逻辑+3，语文情商+3，其他科目才华+3；才艺课每3节奖励₩30,000。名气随才华提高，增加论坛话题。</p><p>周末一天只能约会或打工。低于50好感或高于30警戒必拒绝，发出邀请即使用当天机会。9/12运动会、9/23期中、9/25校园祭为特别日，不排普通课程。</p></details>`);return html};
schoolMe=function(){return beforeSemesterMe().replace('<select id="playerSchoolGrade">','<select id="playerSchoolGrade" disabled>').replace('我的年级','入学年级（本轮固定）')};
ending=function(){const s=game.school;if(!s.expelled)return beforeSemesterEnding()+'<button class="campus-primary" data-new-round>重开一轮</button>';return schoolBanner()+`<div class="campus-card school-ending semester-expelled"><span class="eyebrow">MIDTERM / ENDING</span><h3>这一学期，<br>在这里暂时停下。</h3><p>期中成绩 ${s.exam.score} / 750，未达到 450 分合格线。你已被退学，本轮不再推进日期或领取成长。</p><p>聊天、关系、金钱和校园记录都已保留。可以导出这段经历，或重新入学，尝试另一份课表。</p><button class="campus-secondary" data-school-settings>查看或导出存档</button><button class="campus-primary" data-new-round>重开一轮</button></div>`};
bindSchoolForms=function(){beforeSemesterBind();if($('#sportsForm'))$('#sportsForm').onsubmit=e=>{e.preventDefault();semesterAction(()=>{const r=Sim.sports(game.school,app.querySelector('[name="sportsJoin"]:checked').value==='yes');semesterMessage('sports',r)})};if($('#festivalForm'))$('#festivalForm').onsubmit=e=>{e.preventDefault();semesterAction(()=>{const who=$('#festivalWho').value;const r=Sim.festival(game.school,who==='solo'?null:who,$('#festivalStall').value);semesterMessage('festival',r)})};};
function semesterAction(action){try{action();saveCampus();refreshHome();renderSchool()}catch(error){toast(error.message)}}
function semesterMessage(type,r){const name=game.player.name;let id=r.id,text='';if(type==='work'&&id)text=Sim.address(game.school,id,name).preferred+'，没想到会在这家店遇到你。今天辛苦了，下次再来找你。';if(type==='help'){id=r.id;if(r.helped)text=Sim.address(game.school,id,name).preferred+'，谢谢你刚才陪我去医务室。已经处理好了，不用太担心。'}if(type==='festival'&&id)text=Sim.address(game.school,id,name).preferred+'，今天一起逛'+r.stall+'很开心。我们也算一起留下校园祭的回忆了。';if(type==='sports'){id=r.featured.id;if(r.featured.type==='award')text=Sim.address(game.school,id,name).preferred+'，刚才在领奖台上看见你了。今天的运动会很难忘。'}if(id&&text)receiveScripted(id,text,type,{},'semester-'+type+'-'+game.school.day+'-'+id)}
app.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.hasAttribute('data-weekend-work'))semesterAction(()=>{const r=Sim.work(game.school);semesterMessage('work',r)});if(b.dataset.sportsHelp)semesterAction(()=>{const r=Sim.helpInjury(game.school,b.dataset.sportsHelp==='yes');semesterMessage('help',r)});if(b.hasAttribute('data-take-exam'))semesterAction(()=>Sim.exam(game.school));if(b.hasAttribute('data-semester-restart')){openApp('settings');$('#resetCampus')?.scrollIntoView({block:'center'})}});

function startNewRound(){if(sending.size){toast('请等当前回复完成后再重开。');return}confirmGameAction('重开一轮会清空本轮校历与聊天，重新选择姓名、年级和身份。需要留念的话请先导出存档。确定重开吗？',()=>{localStorage.removeItem(CAMPUS_KEY);location.reload()})}
app.addEventListener('click',e=>{if(e.target.closest('[data-new-round]'))startNewRound()});

onboarding=function(step=1,draft={name:game.player?.name||'',grade:game.school.grade,identity:game.school.identity}){
 document.querySelector('.onboard')?.remove();locked=false;$('#lock').hidden=true;$('#lock').inert=true;$('#homeButton').inert=true;$('#lockToggle').disabled=true;
 const el=document.createElement('section');el.className='onboard admission';el.setAttribute('role','dialog');el.setAttribute('aria-label','入学登记');screen.append(el);$('#home').inert=true;app.inert=true;
 const intro=`<img class="admission-crest" src="${window.CAMPUS_CREST}" alt="得比高中校徽"><div class="eyebrow">ADMISSION / 0${step}</div>`;
 if(step===1)el.innerHTML=intro+`<h1>先写下<br>你的名字。</h1><p class="lead">这会成为你的 KKT 名字。</p><form class="campus-form" id="newNameForm"><label for="newPlayerName">玩家姓名</label><input id="newPlayerName" required maxlength="16" autocomplete="off" value="${escapeHTML(draft.name)}" placeholder="你的名字"><button class="campus-primary">下一步　→</button></form>`;
 if(step===2)el.innerHTML=intro+`<h1>今年，<br>你读几年级。</h1><p class="lead">${escapeHTML(draft.name)}，年级会决定大家初见时喊你学姐、学妹，还是同学。</p><form class="campus-form" id="newGradeForm"><label for="admissionGrade">入学年级</label><select id="admissionGrade">${['高一','高二','高三'].map(g=>`<option ${draft.grade===g?'selected':''}>${g}</option>`).join('')}</select><small>关系变亲近后，会逐渐直呼你的名字或使用昵称。年级与身份在本轮固定。</small><button class="campus-primary">选择我的身份　→</button><button type="button" class="campus-secondary" id="admissionBackName">返回修改姓名</button></form>${game.player?'<p class="admission-migration">原聊天与校园成长会保留；本次登记会补入身份初始资金，并将已获得的关系成长应用到新起点。</p>':''}`;
 if(step===3)el.innerHTML=intro+`<h1>以怎样的你，<br>开始这段校园生活。</h1><form class="campus-form" id="newIdentityForm">${Object.entries(Sim.PROFILES).map(([id,p])=>`<label class="admission-choice"><input type="radio" name="admissionIdentity" value="${id}" ${draft.identity===id?'checked':''}><span><strong>${p.name}</strong><small>${money(p.money)} · 初始好感 ${p.affection} / 警戒 ${p.guard}</small><small>${id==='heiress'?'家族企业实践':id==='president'?'维持学生会的日常 · 家教兼职':'从普通的日子开始 · 咖啡店兼职'}</small></span></label>`).join('')}<button class="campus-primary">以${escapeHTML(draft.grade)}学生的身份入学</button><button type="button" class="campus-secondary" id="admissionBackGrade">返回修改年级</button></form>`;
 el.insertAdjacentHTML('beforeend','<p id="admissionError" role="alert"></p>');
 if(step===1){$('#newNameForm').onsubmit=e=>{e.preventDefault();const name=$('#newPlayerName').value.trim();if(!name)return;onboarding(2,{...draft,name})};$('#newPlayerName').focus()}
 if(step===2){$('#newGradeForm').onsubmit=e=>{e.preventDefault();onboarding(3,{...draft,grade:$('#admissionGrade').value})};$('#admissionBackName').onclick=()=>onboarding(1,draft)}
 if(step===3){$('#admissionBackGrade').onclick=()=>onboarding(2,draft);$('#newIdentityForm').onsubmit=e=>{e.preventDefault();try{const identity=el.querySelector('[name="admissionIdentity"]:checked')?.value;if(!identity)throw Error('请选择一个身份');Sim.configure(game.school,identity,draft.grade);game.player={...(game.player||{}),name:draft.name,grade:draft.grade,identity:Sim.PROFILES[identity].name};schoolGrade=draft.grade;seedAdmissionGreetings();game.needsFirstUnlock=true;if(!saveCampus())return;el.remove();app.inert=false;$('#homeButton').inert=false;$('#lockToggle').disabled=false;lockPhone();toast('欢迎入学，输入密码后进入手机')}catch(error){$('#admissionError').textContent=error.message}}}
};
function seedAdmissionGreetings(){const first={jae:'我是李贤在。新学期有需要帮忙的地方，可以来找我。',ju:'我是李柱延。刚从图书馆出来。你好。',young:'我是金泳勋。刚陪bori公主散完步，开学资料收到了吗？',sun:'金善旴。名字先存好，别下次又问我是谁。',q:'我是池昌民。以后有机会一起拍照吧。'};for(const id of Sim.IDS)if(game.chats[id].length===1&&game.chats[id][0].seed)game.chats[id][0].content=Sim.address(game.school,id,game.player.name).preferred+'，'+first[id]}

const homeWithoutCrest=installCampusHome;installCampusHome=function(){homeWithoutCrest();const icon=$('#home [data-open="school"] .app-icon');if(icon){icon.innerHTML='<img src="'+window.CAMPUS_CREST+'" alt="得比高中校徽">';icon.classList.add('school-crest-icon')}};

let fundingTab='总览',giftRecipient='jae',fundingReceipt='';
Sim.hydrateFunding(game.school);
const saveBeforeFunding=saveCampus;
saveCampus=function(){flushFundingMessages();return saveBeforeFunding()};
function flushFundingMessages(){const f=game.school?.funding;if(!f)return;while(f.delivered<f.outbox.length){const m=f.outbox[f.delivered++];if(!C[m.id])continue;const call=Sim.address(game.school,m.id,game.player?.name||'同学').preferred;let text='';if(m.type==='sponsor')text=call+'，企划资料我收到了。谢谢你愿意支持我的校园生活，我会认真对待。';if(m.type==='weekly')text='这周的资助收到了，谢谢你。';if(m.type==='gift'||m.type==='support'){const item=(m.type==='gift'?Sim.GIFTS:Sim.SUPPORT_ITEMS)[m.itemId];const words=m.liked?'这个很合我的心意。':'我收到了，你费心了。';text=m.id==='sun'?`${call}，${item.name}收到了。${m.liked?'挺会挑啊，确实喜欢。':'谢了，我会好好留着。'}`:m.id==='ju'?`${call}，刚看到你送的${item.name}。谢谢。${words}`:m.id==='q'?`${call}，${item.name}我收到了。${words}`:`谢谢你，${call}。${item.name}收到了。${words}`;if(m.guardIncrease>0)text+='这次花得有点多，下次不用这么贵。'}if(m.type==='reservation')text=call+'，'+Sim.date(m.serviceDay).label+'晚上的'+Sim.SERVICES[m.kind].name+'预约确认了，到时候见。';if(m.type==='service')text=m.kind==='tutoring'?call+'，今天讲的题记得再看一遍。有不懂的地方，下次一起整理。':call+'，今天一起出去走走很开心。谢谢你留了这段时间。';if(text)receiveScripted(m.id,text,m.type,{itemId:m.itemId,kind:m.kind,serviceDay:m.serviceDay},'funding-'+(f.delivered-1))}}
function nextSupportDay(){const n=game.school.day+(7-game.school.day%7);return n<Sim.LIMIT?n:null}
function fundingSummary(){const s=game.school,next=nextSupportDay();return `<div class="funding-wallet"><span>可用余额<strong>${money(s.attributes.money)}</strong></span><small>${s.funding.target?next===null?'本轮已无后续周扣款':'下次资助费 '+Sim.date(next).label+' · '+money(Sim.WEEKLY_FEE):'每周资助费 '+money(Sim.WEEKLY_FEE)}</small></div>`}
renderAid=function(t=fundingTab){fundingTab=t;app.className='app aid-app';const pages={总览:fundOverview,礼物商城:giftStore,定向商城:supportStore,周末预约:reservationStore,账单:fundLedger};if(!pages[fundingTab])fundingTab='总览';app.innerHTML=campusTop('贫困生资助企划')+`<nav class="school-nav funding-nav">${Object.keys(pages).map(n=>`<button data-funding-tab="${n}" class="${n===fundingTab?'active':''}">${n}</button>`).join('')}</nav><div class="campus-body funding-body">${fundingSummary()}${game.school.bankrupt?bankruptcyAidNotice():game.school.completed?'<div class="school-tip">本轮已经结束，商城与预约停止结算。可以查看账单或重开一轮。</div>':''}${fundingReceipt?`<div class="school-settlement" role="status">${fundingReceipt}</div>`:''}${pages[fundingTab]()}</div>`;bindFundingForms()};
function fundOverview(){const s=game.school,f=s.funding;if(f.target)return `<div class="campus-card funding-target"><span class="eyebrow">YOUR SPONSORED STUDENT</span><div>${av(f.target)}<span><h3>${C[f.target].name}</h3><small>${C[f.target].grade} · 本轮已锁定</small></span></div><p>每周资助费 ${money(Sim.WEEKLY_FEE)}。选定当周先扣一次，以后每周一自动扣款，不能更换对象。</p><button class="campus-secondary" data-funding-tab="定向商城">为他添置一些用品</button><button class="campus-secondary" data-funding-tab="周末预约">预约周末补课或出游</button></div><div class="funding-budget"><h3>把日子安排得从容一点。</h3><p>普通学生一次咖啡店工作收入 ₩120,000，可以支付一周资助费并留下余量。正常课表的才艺奖励也可以支付支出。</p><p>建议留下至少 ${money(Sim.WEEKLY_FEE)} 的下周预算。余额耗尽，或周扣款时余额不足，会触发破产退学。</p></div>`;return `<div class="funding-intro"><span class="eyebrow">ONE PERSON / ONE TERM</span><h3>把一份支持，<br>送到一个人身边。</h3><p>每轮只能定向资助一位男主，选择后不可更改。现在扣本周 ${money(Sim.FIRST_FEE)}，以后每周一扣₩100,000。</p></div>${Sim.IDS.map(id=>`<article class="campus-card funding-select">${av(id)}<div><strong>${C[id].name}</strong><small>${C[id].grade}</small></div><button data-choose-sponsor="${id}" ${s.completed?'disabled':''}>选择资助</button></article>`).join('')}<p class="funding-copy">礼物商城可以给所有男主送礼；定向商城和周末预约只对本轮资助对象开放。</p>`}
function giftStore(){return `<div class="campus-form"><label for="giftRecipient">礼物想送给谁</label><select id="giftRecipient">${Sim.IDS.map(id=>`<option value="${id}" ${giftRecipient===id?'selected':''}>${C[id].name}</option>`).join('')}</select></div><div id="giftGrid">${giftCards()}</div><p class="funding-copy">挑一件礼物，让他从KKT消息里收到你的心意。</p>`}
function giftCards(){return Object.entries(Sim.GIFTS).map(([id,item])=>{const liked=item.likes.includes(giftRecipient),gain=Math.round((item.affection+(liked?2:0)+Math.floor(game.school.attributes.eq/25))*Sim.profile(game.school).rate*10)/10;return `<article class="campus-card funding-product"><div class="funding-product-top"><span>${item.guard?'✧':'✿'}</span><div><h3>${item.name}</h3><small>${liked?'♥ 他喜欢这件礼物':'心意可以慢慢传达'}</small></div><b>${money(item.cost)}</b></div><button data-buy-gift="${id}" ${game.school.completed||game.school.attributes.money<item.cost?'disabled':''}>${game.school.attributes.money<item.cost?'余额不足':'购买并送给'+C[giftRecipient].name}</button></article>`}).join('')}
function requireSponsor(){return '<div class="school-tip">先在总览里选择本轮唯一的资助对象。</div><button class="campus-secondary" data-funding-tab="总览">去选择资助对象</button>'}

function reservationStore(){const s=game.school,f=s.funding;if(!f.target)return requireSponsor();const days=Array.from({length:Sim.LIMIT},(_,i)=>i).filter(i=>i>=s.day&&Sim.date(i).weekend);return `<div class="funding-exclusive">${av(f.target)}<div><strong>预约和${C[f.target].name}的时间</strong><small>周末晚间额外时段，每天一次。</small></div></div><p class="funding-copy">不占普通约会或打工的日间名额。预约时付费；可以事先取消并全额退还，错过当日预约也会自动退款。</p>${!s.completed&&days.length?`<form class="campus-form" id="fundServiceForm"><label for="fundServiceKind">预约项目<select id="fundServiceKind"><option value="tutoring">一对一补课 · ₩20,000</option><option value="outing">陪伴出游 · ₩30,000</option></select></label><label for="fundServiceDay">选择周末<select id="fundServiceDay">${days.map(day=>`<option value="${day}" ${f.bookings[day]&&['booked','completed'].includes(f.bookings[day].status)?'disabled':''}>${Sim.date(day).label} ${Sim.date(day).weekLabel}${f.bookings[day]&&['booked','completed'].includes(f.bookings[day].status)?' · 已安排':''}</option>`).join('')}</select></label><small>补课可以一起整理学习内容；出游可以留一点时间一起走走。预约不占日间约会或打工时段。</small><button class="campus-primary">付费确认预约</button></form>`:''}<h3>我的预约</h3>${Object.values(f.bookings).sort((a,b)=>a.day-b.day).map(b=>`<article class="campus-card funding-booking"><strong>${Sim.date(b.day).label} · ${Sim.SERVICES[b.kind].name}</strong><p>${C[b.id].name} · 晚间额外时段 · ${money(b.cost)}</p><small>${{booked:'预约已确认',completed:'已赴约',cancelled:'已取消，全额退款',missed:'未赴约，已自动退款'}[b.status]}</small>${b.status==='booked'&&!s.completed?`<div>${b.day===s.day?'<button class="campus-primary" data-fund-attend>现在去赴约</button>':''}<button class="campus-secondary" data-fund-cancel="${b.day}">取消并退费</button></div>`:''}</article>`).join('')||'<p class="funding-copy">还没有预约。</p>'}`}
function fundLedger(){const items=game.school.funding.transactions;return `<h3>每一笔心意，都记在这里。</h3>${items.slice().reverse().map(t=>`<div class="funding-transaction"><span><strong>${escapeHTML(t.text)}</strong><small>${Sim.date(t.day).label}${C[t.id]?' · '+C[t.id].name:''}</small></span><b class="${t.amount>0?'income':''}">${t.amount>0?'+':'−'}${money(Math.abs(t.amount))}</b></div>`).join('')||'<p class="funding-copy">还没有支出或退款记录。</p>'}<p class="funding-copy">这里记录资助、商城和预约的消费及退款。打工、才艺与运动会收入保存在校园成长记录里。</p>`}
function bankruptcyAidNotice(){return '<div class="school-settlement bankruptcy-notice"><strong>余额耗尽，触发破产退学。</strong><p>本轮停止扣款与消费，已保留所有记录。</p><button class="campus-secondary" data-new-round>重开一轮</button></div>'}

const endingBeforeFunding=ending;ending=function(){if(!game.school.bankrupt)return endingBeforeFunding();return schoolBanner()+`<div class="campus-card school-ending semester-expelled"><span class="eyebrow">BALANCE / ENDING</span><h3>余额归零，<br>这一轮暂时停在这里。</h3><p>你已因破产被退学。本轮不再扣款、上课或结算活动，聊天与资助记录都保留。</p><button class="campus-secondary" data-school-settings>查看或导出存档</button><button class="campus-primary" data-new-round>重开一轮</button></div>`};

const ChatFlow=window.CampusDialogue;
function inferLegacyScript(row){for(const [itemId,item] of Object.entries(Sim.GIFTS))if(row.content.includes(item.name))return {kind:'gift',meta:{itemId}};if(row.seed)return {kind:'greeting'};if(row.content.includes('预约确认'))return {kind:'reservation'};if(row.content.includes('资助'))return {kind:row.content.includes('企划资料')?'sponsor':'weekly'};if(row.content.includes('医务室'))return {kind:'help'};if(row.content.includes('领奖台'))return {kind:'sports'};if(row.content.includes('校园祭'))return {kind:'festival'};if(row.content.includes('社')||row.content.includes('读书会')||row.content.includes('炸鸡部'))return {kind:'club'};if(row.content.includes('下次再')||row.content.includes('不太方便')||row.content.includes('去不了'))return {kind:'dateDeclined'};return {kind:'event'}}

ChatFlow.upgrade(game);
const fixedReplyTimers=new Map();
let kktBanner=null,kktBannerTimer=null,notificationDestination='',noticeSerial=0;
function notifyKkt(id,text){if(!C[id])return;if(document.querySelector('.onboard'))return;const previous=kktBanner?.dataset.contact===id?Number(kktBanner.dataset.count||1):0;kktBanner?.remove();clearTimeout(kktBannerTimer);const el=document.createElement('section');el.className='kkt-notification';el.dataset.contact=id;el.dataset.count=String(previous+1);el.setAttribute('role','status');el.innerHTML=`<button class="kkt-notification-open" aria-label="查看${C[id].name}的KKT消息">${av(id)}<span><small>KKT${previous?' · '+(previous+1)+'条新消息':''}</small><strong>${C[id].name}</strong><span>${escapeHTML(text)}</span></span></button><button class="kkt-notification-dismiss" aria-label="关闭消息通知">×</button>`;screen.append(el);kktBanner=el;el.querySelector('.kkt-notification-dismiss').onclick=()=>dismissKktNotice();el.querySelector('.kkt-notification-open').onclick=()=>{dismissKktNotice();if(locked){notificationDestination=id;toast('解锁后查看这条消息');return}openNotificationChat(id)};kktBannerTimer=setTimeout(()=>{if(kktBanner===el)dismissKktNotice()},6500)}

new MutationObserver(()=>{if(!locked&&game.needsFirstUnlock){delete game.needsFirstUnlock;saveCampus()}if(notificationDestination&&!locked){const id=notificationDestination;notificationDestination='';openNotificationChat(id)}}).observe(screen,{attributes:true,attributeFilter:['class']});
function receiveScripted(id,text,kind='event',meta={},token=null){const row=window.CampusDialogue.appendFixed(game,id,text,kind,meta,token);if(row&&window.__campusMessagingReady){notifyKkt(id,text);if(current==='kakao'&&activeContact===id)queueMicrotask(()=>paintChat(id))}return row}

function signed(n){return n===0?'±0':n>0?'+'+n:'−'+Math.abs(n)}

const paintBeforeChoices=paintChat;
paintChat=function(id){paintBeforeChoices(id);if(current!=='kakao'||activeContact!==id||!$('#campusCompose'))return;$('#fixedReplyPanel')?.remove();const f=ChatFlow.head(game,id),busy=sending.has(id);$('#campusInput').disabled=!!f||busy;$('#campusInput').placeholder=f?'请先完成这段对话…':'发送消息…';$('#campusSend').disabled=!!f||busy;if(!f)return;const panel=document.createElement('section');panel.className='fixed-reply-panel';panel.id='fixedReplyPanel';panel.setAttribute('aria-label','剧情回复选项');if(f.phase==='male'){panel.innerHTML='<header><span>'+C[id].name+' 正在回复…</span></header>';$('#campusTyping').textContent=C[id].name+' 正在输入…';$('#campusSend').textContent='等待';scheduleFixedClosing(id)}else{const row=game.chats[id].find(m=>m.choiceId===f.key),count=game.dialogue.pending[id].length;panel.innerHTML=`<header><span>回复${C[id].name}</span><small>${f.kind==='romance'?'第 '+((f.meta.round||0)+1)+' / 3 轮':count>1?'还有 '+count+' 条待回复':'选择回复后，等他把话说完'}</small></header><p>${escapeHTML(row?.content||f.preview)}</p><div>${f.options.map((option,index)=>`<button data-fixed-contact="${id}" data-fixed-key="${f.key}" data-fixed-index="${index}" ${busy?'disabled':''}>${escapeHTML(option)}</button>`).join('')}</div>`;}$('#campusCompose').before(panel);const error=$('#campusChatError');if(error&&chatErrors[id])error.innerHTML='';}

app.addEventListener('click',e=>{const b=e.target.closest('[data-fixed-key]');if(!b)return;const id=b.dataset.fixedContact;if(sending.has(id)||ChatFlow.head(game,id)?.phase!=='player')return;try{if(typeof applyFixedChoice==='function')applyFixedChoice(ChatFlow.head(game,id),id,Number(b.dataset.fixedIndex));ChatFlow.reply(game,id,b.dataset.fixedKey,Number(b.dataset.fixedIndex));saveCampus();paintChat(id);scheduleFixedClosing(id)}catch(error){toast(error.message)}});

function scheduleFixedClosing(id){const f=ChatFlow.head(game,id);if(!f||f.phase!=='male'||fixedReplyTimers.get(id)?.key===f.key)return;const key=f.key;const timer=setTimeout(()=>{fixedReplyTimers.delete(id);if(ChatFlow.head(game,id)?.key!==key||ChatFlow.head(game,id)?.phase!=='male')return;const row=ChatFlow.completeReply(game,id,key);window.CampusStories.pause(game,id);saveCampus();notifyKkt(id,row.content);if(current==='kakao'&&activeContact===id)paintChat(id);if(typeof refreshFestivalPlanning==='function')refreshFestivalPlanning();const next=ChatFlow.head(game,id);if(next?.phase==='male')scheduleFixedClosing(id)},900);fixedReplyTimers.set(id,{key,timer})}

festivalPage=function(){const s=game.school,p=s.festivalPlan,r=s.festival;if(r){const activity=r.activity||({'舞台演出':'罗密欧与朱丽叶','摄影摊位':'性转咖啡厅','校园小吃':'炒年糕店铺'})[r.stall]||'性转咖啡厅';return `<div class="semester-event-heading"><span class="eyebrow">SCHOOL FESTIVAL / OUR STORY</span><h3>${r.id?C[r.id].name+'和你一起留下的这一天':'属于你自己的校园祭'}</h3></div><div class="campus-card"><p class="festival-story-text">${escapeHTML(ProactiveStories.festivalScene(r.id,activity))}</p></div><div class="school-settlement">${r.id?C[r.id].name+'：'+relationText(r.gains):'你独立完成了活动策划。'}</div>`}
 const heading=`<div class="semester-event-heading"><span class="eyebrow">9.25 / FESTIVAL PLANNING</span><h3>想和谁，<br>一起把这一天准备好。</h3><p>三项活动选一项，再向一位同学发出KKT邀请。收到答复、确定搭档后，完成策划并留下校园祭剧情。</p></div>`;
 if(p&&['ready','sponsor-choice'].includes(p.status)){const waiting=festivalConversationPending();return heading+`<div class="campus-card"><h3>${p.activity}</h3><p>当前搭档：${C[p.selectedId].name}</p><p>${p.status==='sponsor-choice'?C[p.sponsorId].name+'也想和你一起策划，请先到KKT做出回应。':p.sponsorDecision===true?'搭档已调整，已经向原同学发去道歉。':'搭档已确认，准备的事情可以一起分担。'}</p><button class="campus-secondary" data-school-chat="${p.status==='sponsor-choice'?p.sponsorId:p.selectedId}">去KKT确认</button></div><button class="campus-primary" data-complete-festival ${p.status!=='ready'||waiting?'disabled':''}>${waiting?'先完成KKT里的准备对话':'完成策划并开始校园祭'}</button>`}
 return heading+(p?.status==='refused'?`<div class="school-tip">${C[p.selectedId].name}这次没有答应，可以邀请其他同学，也可以独立策划。答复已经送到KKT。</div>`:'')+`<form class="campus-form" id="festivalPlanningForm"><label for="festivalActivity">活动策划<select id="festivalActivity">${Sim.FESTIVAL_ACTIVITIES.map(a=>`<option ${p?.activity===a?'selected':''}>${a}</option>`).join('')}</select></label><p class="school-copy">性转咖啡厅：男主穿女仆装一起经营。<br>话剧：你饰演朱丽叶，他饰演罗密欧，舞台吻戏使用借位。<br>炒年糕店铺：男主教你烹饪，一起经营小店。</p><label for="festivalPartner">邀请同学<select id="festivalPartner">${Sim.IDS.map(id=>`<option value="${id}" ${p?.attempts?.[id]?'disabled':''}>${C[id].name}${p?.attempts?.[id]?' · 已邀请':''}</option>`).join('')}</select></label><button class="campus-primary">发送校园祭邀请</button><button class="campus-secondary" type="button" data-festival-solo>独立完成这项策划</button></form>`};
function sendFestivalInvitation(p){const id=p.originalId;game.chats[id].push({role:'user',content:C[id].name+'，这次校园祭想邀请你和我一起策划'+p.activity+'，你愿意吗？',at:Date.now(),gameDay:game.school.day,festivalInvitation:true});const text=p.accepted?({jae:'好，我们一起准备，我会认真把要做的事安排好。',ju:'好。那这次我们一起慢慢准备。',young:'愿意，准备的事情我们一起分担。',sun:'行，这次我可会认真准备，别到时候反悔。',q:'愿意。那我们一起把这次的活动做好。'})[id]:({jae:'抱歉，这次可能没办法一起策划，你也可以再问问其他同学。',ju:'这次不太方便，抱歉。希望你能找到合适的搭档。',young:'这次可能安排不过来，抱歉。祝你的活动顺利。',sun:'这次先算了，我这边有点安排。你也去问问别人吧。',q:'这次可能去不了，抱歉。希望你这次活动玩得开心。'})[id];receiveScripted(id,text,p.accepted?'festivalInviteAccepted':'festivalInviteDeclined',{festivalToken:p.token,activity:p.activity},p.token);if(p.sponsorId){const request=ProactiveStories.FESTIVAL_REQUESTS[p.sponsorId];receiveScripted(p.sponsorId,request.open,'festivalSponsorRequest',{festivalToken:p.token,previousId:p.originalId,activity:p.activity},p.token+'-sponsor')}}
function applyFixedChoice(f,id,index){if(f.kind!=='festivalSponsorRequest'||game.school.completed)return;const p=game.school.festivalPlan;if(!p||p.token!==f.meta?.festivalToken)return;const result=Sim.resolveFestivalChoice(game.school,index===0);if(!result.changed)return;const old=result.previousId;const removed=ChatFlow.cancel(game,old,flow=>flow.kind==='festivalInviteAccepted'&&flow.meta?.festivalToken===p.token);if(removed.length){const t=fixedReplyTimers.get(old);if(t&&removed.includes(t.key)){clearTimeout(t.timer);fixedReplyTimers.delete(old)}}game.chats[old].push({role:'user',content:'真的很抱歉，校园祭的策划临时调整，这次没办法和你一起准备了，谢谢你之前愿意答应。',at:Date.now(),gameDay:game.school.day,festivalApology:true});const apology={jae:'知道了，别一直放在心上，祝你们准备顺利。',ju:'嗯，没关系。希望这次的活动顺利。',young:'好，临时调整也没关系，祝你们活动顺利。',sun:'行，我知道了，这次不和你计较，认真把活动做好吧。',q:'知道了，没关系，祝你们这次准备顺利。'}[old];game.chats[old].push({role:'assistant',content:apology,at:Date.now(),gameDay:game.school.day,event:true,terminal:true});ProactiveStories.pause(game,old);notifyKkt(old,apology)}

const playerApiPreferences=window.CampusApiPreferences;
const initializeApiBeforePlayerChoice=initializeApi;
let playerApiInitialization=null;
initializeApi=function(){if(!playerApiInitialization)playerApiInitialization=initializeApiBeforePlayerChoice().finally(()=>{playerApiInitialization=null});return playerApiInitialization};
const apiProviderNames={gemini:'Gemini',deepseek:'DeepSeek',openai:'OpenAI',custom:'自定义兼容接口'};
function apiConnectionFields(prefix){
 const c=playerApiPreferences.connection(),own=playerApiPreferences.hasPersonalKey();
 return `<label for="${prefix}Provider">服务商</label><select id="${prefix}Provider">${Object.entries(apiProviderNames).map(([id,name])=>`<option value="${id}" ${c.provider===id?'selected':''}>${name}</option>`).join('')}</select><label for="${prefix}Protocol">API 协议</label><select id="${prefix}Protocol">${[['gemini','Gemini 原生'],['chat-completions','OpenAI Chat Completions 兼容'],['responses','OpenAI Responses']].map(([id,name])=>`<option value="${id}" ${c.protocol===id?'selected':''}>${name}</option>`).join('')}</select><label for="${prefix}Model">模型名称</label><input id="${prefix}Model" required maxlength="160" value="${escapeHTML(c.model)}" placeholder="填写服务商提供的模型 ID" autocomplete="off" autocapitalize="none" spellcheck="false"><label for="${prefix}Base">API 接口地址</label><input id="${prefix}Base" type="url" required value="${escapeHTML(c.baseUrl)}" placeholder="https://服务商域名/v1" autocomplete="off" autocapitalize="none" spellcheck="false"><label for="${prefix}Key">${own?'替换个人密钥':'个人 API 密钥'}</label><input id="${prefix}Key" type="password" maxlength="2048" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="${own?'已保存密钥；同服务商同域名下可留空复用':'粘贴所选服务商的密钥'}"><small>消息和密钥由浏览器直接发送到上面填写的接口。密钥只保存在当前浏览器，不进入导出存档。费用与额度以服务商账户为准。</small><details><summary>高级设置</summary><label for="${prefix}Tokens">单次回复 token 上限</label><input id="${prefix}Tokens" type="number" min="128" max="8192" step="1" value="${c.maxOutputTokens||2200}"><small>部分推理模型需要更高上限。提高上限可能增加实际用量。更换服务商或接口域名时，请重新填写对应密钥。</small></details>`;
}
function bindApiConnectionFields(prefix){
 $('#'+prefix+'Provider').onchange=e=>{const c=playerApiPreferences.preset(e.target.value);$('#'+prefix+'Protocol').value=c.protocol;$('#'+prefix+'Model').value=c.model;$('#'+prefix+'Base').value=c.baseUrl;$('#'+prefix+'Tokens').value=c.maxOutputTokens;$('#'+prefix+'Key').value=''};
}
function saveApiConnection(prefix){return playerApiPreferences.usePersonal($('#'+prefix+'Key').value,{provider:$('#'+prefix+'Provider').value,protocol:$('#'+prefix+'Protocol').value,model:$('#'+prefix+'Model').value,baseUrl:$('#'+prefix+'Base').value,maxOutputTokens:Number($('#'+prefix+'Tokens').value)})}
function resumeCampusEntry(){if(!game.player)onboarding();else if(!game.school.configured)onboarding(2);else if(game.needsFirstUnlock)lockPhone();else unlockCampus()}
function startCampusWithApiSetup(){if(!game.player&&!playerApiPreferences.chosen()){showInitialApiSetup();return}if(game.player&&!playerApiPreferences.chosen())playerApiPreferences.useDefault();resumeCampusEntry()}
function showInitialApiSetup(){
 document.querySelector('.onboard')?.remove();locked=false;$('#lock').hidden=true;$('#lock').inert=true;$('#homeButton').inert=true;$('#lockToggle').disabled=true;$('#home').inert=true;app.inert=true;
 const el=document.createElement('section');el.className='onboard admission api-admission';el.setAttribute('role','dialog');el.setAttribute('aria-label','聊天连接设置');screen.append(el);
 el.innerHTML=`<img class="admission-crest" src="${window.CAMPUS_CREST}" alt="得比高中校徽"><div class="eyebrow">CHAT / CONNECTION</div><h1>先选择<br>聊天连接。</h1><p class="lead">支持 Gemini、DeepSeek、OpenAI 和自定义兼容接口。填写个人连接，或跳过使用站长提供的默认连接。</p><button class="campus-secondary" type="button" id="skipPersonalApi">跳过，使用默认连接</button><p class="campus-muted" id="initialSharedStatus">正在检查默认连接…</p><form class="campus-form" id="initialApiForm">${apiConnectionFields('initialApi')}<button class="campus-primary">保存个人连接并继续</button></form><p class="api-form-error" id="initialApiError" role="alert"></p><p class="campus-muted">之后可在“设置与存档”中修改服务商、模型、接口与密钥。</p>`;
 bindApiConnectionFields('initialApi');
 initializeApi().then(()=>{const hint=$('#initialSharedStatus');if(hint&&el.isConnected)hint.textContent=apiState.configured?'站长默认连接可用。':'默认连接暂未就绪；可先进入游戏体验固定剧情，或填写个人连接。'});
 const next=async()=>{await initializeApi();el.remove();app.inert=false;$('#homeButton').inert=false;$('#lockToggle').disabled=false;resumeCampusEntry()};
 $('#initialApiForm').onsubmit=async e=>{e.preventDefault();try{saveApiConnection('initialApi');$('#initialApiKey').value='';await next()}catch(error){$('#initialApiError').textContent=error.message}};
 $('#skipPersonalApi').onclick=async()=>{playerApiPreferences.useDefault();await next()};
}
const settingsBeforePersonalApi=renderCampusSettings;
renderCampusSettings=function(){
 settingsBeforePersonalApi();const card=$('#apiStatusText')?.closest('.campus-card');if(!card)return;
 const own=playerApiPreferences.hasPersonalKey(),c=playerApiPreferences.connection(),defaultReady=!!apiState.configured&&!own;
 const status=apiState.error|| (own?'个人连接：'+apiProviderNames[c.provider]+' · '+c.model:defaultReady?'当前使用：站长默认连接':'共享连接暂未配置；可先使用个人连接');
 card.innerHTML=`<span class="eyebrow">CHAT CONNECTION</span><h3>聊天连接</h3><p id="apiStatusText">${escapeHTML(status)}</p><p class="campus-muted">个人连接直接访问你填写的服务商，不消耗站长共享额度。暂不使用 AI 也能继续课程和固定剧情。</p><form class="campus-form" id="personalApiForm">${apiConnectionFields('personalApi')}<button class="campus-primary">保存并使用个人连接</button><button type="button" class="campus-secondary" id="useDefaultCampusApi">${apiState.backendAvailable?'使用站长默认连接':'清除个人密钥，暂不使用 AI'}</button></form><p class="api-form-error" id="personalApiError" role="alert"></p><button class="campus-secondary" id="checkCampusApi">检查连接配置</button><small class="campus-muted">配置检查不消耗模型额度，实际能否回复请在聊天中验证。${!playerApiPreferences.persistent()?' 浏览器未允许保存，目前只在本次页面临时生效。':''}</small>`;
 bindApiConnectionFields('personalApi');
 const available=()=>{if(sending.size){toast('请等当前回复完成再更改连接。');return false}return true};
 $('#personalApiForm').onsubmit=async e=>{e.preventDefault();if(!available())return;try{const result=saveApiConnection('personalApi');$('#personalApiKey').value='';await initializeApi();renderCampusSettings();toast(result.persistent?'个人连接已保存。':'本次页面已使用个人连接，浏览器暂未允许保存。')}catch(error){$('#personalApiError').textContent=error.message}};
 $('#useDefaultCampusApi').onclick=async()=>{if(!available())return;playerApiPreferences.useDefault();await initializeApi();renderCampusSettings();toast('已清除个人密钥。共享连接可用时会使用共享连接。')};
 $('#checkCampusApi').onclick=async e=>{e.target.disabled=true;await initializeApi();renderCampusSettings()};
};

installCampusHome();initializeApi();startCampusWithApiSetup();
</script><script>(() => {
  const root=document.documentElement,screen=document.getElementById('screen');
  if(!screen)return;
  let pending=0;
  const set=(el,name,value)=>{if(el.style.getPropertyValue(name)!==value)el.style.setProperty(name,value)};
  function sync(){
    pending=0;
    const view=window.visualViewport,unscaled=!view||Math.abs(view.scale-1)<.05;
    const height=Math.max(1,unscaled&&view?view.height:window.innerHeight);
    const top=unscaled&&view?Math.max(0,view.offsetTop):0;
    set(root,'--viewport-h',height.toFixed(2)+'px');
    set(root,'--viewport-top',top.toFixed(2)+'px');
    const rect=screen.getBoundingClientRect();
    if(rect.width>0)set(screen,'--phone-u',(rect.width/100).toFixed(5)+'px');
    if(rect.height>0)set(screen,'--phone-v',(rect.height/100).toFixed(5)+'px');
  }
  function schedule(){if(!pending)pending=requestAnimationFrame(sync)}
  sync();
  if(window.ResizeObserver)new ResizeObserver(schedule).observe(screen);
  window.addEventListener('resize',schedule,{passive:true});
  window.addEventListener('orientationchange',schedule,{passive:true});
  window.visualViewport?.addEventListener('resize',schedule,{passive:true});
  window.visualViewport?.addEventListener('scroll',schedule,{passive:true});
  document.addEventListener('focusin',schedule);
  document.addEventListener('focusout',schedule);
})();
</script></body></html>
