.ig-search-person span:last-child{display:flex;flex-direction:column;gap:1cqw;font-size:3.7cqw}
.ig-search-person small{font-size:3.2cqw;color:#777}
.ig-message-heading{padding:4cqw;font-size:5cqw}
.ig-sheet{background:white;border-radius:6cqw 6cqw 0 0;color:#111}
.ig-sheet-handle{width:10cqw;height:4px;background:#ddd;border-radius:5px;margin:2cqw auto}
.ig-sheet-heading{display:flex;align-items:center;justify-content:space-between;padding:3cqw 5cqw 5cqw;border-bottom:1px solid #eee;font-size:4.5cqw}
.ig-sheet-heading button{width:6cqw;height:6cqw;padding:0}
.ig-sheet-heading svg{width:100%;height:100%}
.ig-sheet-body{padding:5cqw;overflow:auto;flex:1}
.ig-account-card{display:flex;align-items:center;gap:3cqw;font-size:3.5cqw}
.ig-account-card .ig-avatar-wrap{width:16cqw;height:16cqw}
.ig-account-card p{margin:1cqw 0;color:#777}
.ig-account-card>span:last-child{margin-left:auto;color:#0095f6}
.ig-sheet label{display:block;font-size:3.5cqw;color:#555}
.ig-sheet input:not([type=file]),.ig-sheet textarea{display:block;background:#f4f5f7;border:1px solid #e9e9eb;width:100%;border-radius:3cqw;margin:2cqw 0 5cqw;padding:3cqw;font-size:4cqw;color:#111}
.ig-sheet textarea{min-height:25cqw;resize:vertical}
.ig-save{display:block;width:100%;border-radius:3cqw;background:#0095f6;color:white!important;padding:3cqw;text-align:center;font-size:4cqw}
.ig-share-card{display:flex;flex-direction:column;align-items:center}
.ig-share-card .ig-avatar-wrap{width:28cqw;height:28cqw}
.ig-share-card h2{font-size:5.5cqw;margin:5cqw 0 1cqw}
.ig-share-card p{margin:0 0 4cqw;font-size:4cqw}
.ig-story-identity{display:flex;align-items:center;gap:3cqw;font-size:4cqw;margin-bottom:6cqw}
.ig-story-identity .ig-avatar-wrap{width:15cqw;height:15cqw}
.ig-story-preview{display:block;max-height:90cqw;width:100%;object-fit:contain;margin-bottom:4cqw;border-radius:3cqw}
.ig-upload{cursor:pointer}

.ig-home-header{display:grid;grid-template-columns:9cqw 1fr 9cqw;align-items:center;padding:0 5cqw;height:17cqw;gap:0}
.ig-home-header .ig-wordmark{text-align:center;font-size:8.4cqw;letter-spacing:-.55cqw;font-style:normal;font-family:"Arial Rounded MT Bold","Trebuchet MS",sans-serif;font-weight:750;transform:scaleX(.94)}
.ig-home-header button{width:8cqw;height:9cqw}.ig-home-header svg{width:7cqw;height:7cqw}
.ig-stories{gap:5cqw;padding:2cqw 4cqw 5cqw;align-items:flex-start}
.ig-story-entry{width:25cqw;gap:2cqw;font-size:3.6cqw;flex-shrink:0}
.ig-stories .ig-avatar-wrap{width:24cqw;height:24cqw;margin:1cqw 0}
.ig-stories .ig-avatar-plus{width:8cqw;height:8cqw;bottom:0;right:-.7cqw;border:1cqw solid white}
.ig-stories .ig-avatar-plus svg{width:4.5cqw;height:4.5cqw}
.ig-story-ring{display:grid;place-items:center;width:26cqw;height:26cqw;border-radius:50%;padding:1cqw;background:conic-gradient(from 190deg,#ffd600,#ff7a00,#ff005e,#dc00c8,#ff005e,#ffd600)}
.ig-story-ring>span{display:block;border:1cqw solid white;background:#000;width:100%;height:100%;border-radius:50%}
.ig-story-view{position:absolute;inset:7.2% 0 3%;z-index:35;background:#080808;color:white;display:flex;flex-direction:column;overflow:hidden}
.screen.story-open .status{background:#080808!important;color:#fff!important}.screen.story-open{color:white}
.ig-story-progress{display:flex;gap:1cqw;padding:2cqw 3cqw 1cqw;flex:none}.ig-story-progress span{height:2px;background:#ffffff40;flex:1;border-radius:2px}.ig-story-progress .seen{background:white}
.ig-view-header{display:flex;align-items:center;gap:2.5cqw;padding:2cqw 3cqw 3cqw;flex:none}
.ig-view-header>img,.ig-black-avatar{width:9cqw;height:9cqw;border-radius:50%;object-fit:cover;flex-shrink:0}.ig-black-avatar{background:#000;border:1px solid #ffffff55;display:block}
.ig-view-header>div{display:flex;flex-direction:column;gap:1cqw}.ig-view-header strong{font-size:3.5cqw}.ig-view-header time{font-size:2.8cqw;color:#d2d2d2}
.ig-view-header button{margin-left:auto;width:7cqw;height:7cqw;padding:1cqw;color:white}.ig-view-header svg{width:100%;height:100%}
.ig-view-media{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center}.ig-view-media>img{display:block;width:100%;height:100%;object-fit:contain}
.ig-view-media>button{position:absolute;top:0;bottom:0;width:30%;background:transparent}.ig-story-prev{left:0}.ig-story-next{right:0}
.ig-view-footer{display:flex;align-items:center;justify-content:space-between;padding:0 5cqw;height:9cqw;flex:none}.ig-view-footer button{font-size:8cqw;line-height:1;padding:0 4cqw;color:white}.ig-view-footer span{font-size:3cqw;color:#bbb}
.calendar-jump{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12px;color:#888;margin:4px 0}.calendar-jump input{font:inherit;font-size:13px;background:#e9e9ed;color:#333;padding:7px 9px;border-radius:8px;max-width:65%}
.monthgrid .day{position:relative}.event-dot{position:absolute;bottom:1px;left:calc(50% - 2px);width:4px;height:4px;border-radius:50%;background:#fa5269}.day.chosen .event-dot{background:white}
.calendar-event-list{margin-top:18px}.calendar-event{display:flex;align-items:center;gap:12px;padding:14px 0;border-top:1px solid #e2e2e7}.calendar-event>span{font-size:12px;color:#888;flex:none}.calendar-event>div{border-left:3px solid var(--event-color);padding:2px 0 2px 12px;display:flex;flex-direction:column;gap:6px}.calendar-event strong{font-size:15px;font-weight:600}.calendar-event small{font-size:11px;color:#909095}

">3</text><text x="51.05255888325765" y="45.99999999999999" text-anchor="middle" font-family="Arial" font-size="6.5" fill="#111">4</text><text x="43" y="54.05255888325765" text-anchor="middle" font-family="Arial" font-size="6.5" fill="#111">5</text><text x="32" y="57" text-anchor="middle" font-family="Arial" font-size="6.5" fill="#111">6</text><text x="21.000000000000007" y="54.05255888325765" text-anchor="middle" font-family="Arial" font-size="6.5" fill="#111">7</text><text x="12.947441116742354" y="46.000000000000014" text-anchor="middle" font-family="Arial" font-size="6.5" fill="#111">8</text><text x="10" y="35.00000000000001" text-anchor="middle" font-family="Arial" font-size="6.5" fill="#111">9</text><text x="12.94744111674235" y="24" text-anchor="middle" font-family="Arial" font-size="6.5" fill="#111">10</text><text x="20.99999999999999" y="15.947441116742354" text-anchor="middle" font-family="Arial" font-size="6.5" fill="#111">11</text><text x="31.999999999999993" y="13" text-anchor="middle" font-family="Arial" font-size="6.5" fill="#111">12</text><path d="M32 17v15l13 14" fill="none" stroke="#191919" stroke-width="1.5"/><path d="m32 32-6 19" stroke="#e3aa30" stroke-width="1"/><circle cx="32" cy="32" r="1.8" fill="#222"/></svg></span><span class="app-label">시계</span></button><button class="app-shortcut " data-open="calendar" aria-label="日历"><span class="app-icon"><span class="calendar-face"><span>수요일</span><strong>21</strong></span></span><span class="app-label">캘린더</span></button><button class="app-shortcut " data-open="notes" aria-label="备忘录"><span class="app-icon"><svg viewBox="0 0 64 64" aria-hidden="true" ><rect width="64" height="64" rx="15" fill="#fffef9"/><path d="M15 0h34a15 15 0 0 1 15 15v5H0v-5A15 15 0 0 1 15 0" fill="#ffd621"/><path d="M0 21h64" stroke="#d4b44e" stroke-dasharray="1 1"/><path d="M0 31h64" stroke="#e9e4d8"/><path d="M0 42h64" stroke="#e9e4d8"/><path d="M0 53h64" stroke="#e9e4d8"/></svg></span><span class="app-label">메모</span></button><button class="app-shortcut " data-open="x" aria-label="X"><span class="app-icon"><svg viewBox="0 0 64 64" aria-hidden="true" ><rect width="64" height="64" rx="15" fill="#050505"/><path d="M16 14h10l24 36H40ZM16 50l15-18m4-5 13-13" stroke="white" stroke-width="2.5" fill="none"/></svg></span><span class="app-label">X</span></button></div><button class="anniversary" data-open="widget" aria-label="纪念日，976天"><span>♡</span><strong>976일</strong></button><div class="dock"><button class="app-shortcut dock-shortcut" data-open="phone" aria-label="电话"><span class="app-icon"><svg viewBox="0 0 64 64" aria-hidden="true" ><defs><linearGradient id="green" x2="0" y2="1"><stop stop-color="#65fa6e"/><stop offset="1" stop-color="#05b82d"/></linearGradient></defs><rect width="64" height="64" rx="15" fill="url(#green)"/><path d="m19 12 9 12-6 6c3 6 7 10 13 13l6-6 12 9c-1 7-5 10-11 9-19-4-31-17-33-32-1-5 4-10 10-11" fill="white" transform="translate(3 -1) scale(.9)"/></svg></span></button><button class="app-shortcut dock-shortcut" data-open="messages" aria-label="信息"><span class="app-icon"><svg viewBox="0 0 64 64" aria-hidden="true" ><rect width="64" height="64" rx="15" fill="url(#green)"/><ellipse cx="32" cy="30" rx="24" ry="20" fill="white"/><path d="m16 43-4 12 17-7" fill="white"/></svg></span></button><button class="app-shortcut dock-shortcut" data-open="photos" aria-label="照片"><span class="app-icon"><svg viewBox="0 0 64 64" aria-hidden="true" ><rect width="64" height="64" rx="15" fill="white"/><ellipse cx="32" cy="19" rx="8" ry="13" fill="#fbc62c" opacity=".78" transform="rotate(0 32 32)"/><ellipse cx="32" cy="19" rx="8" ry="13" fill="#f49c32" opacity=".78" transform="rotate(45 32 32)"/><ellipse cx="32" cy="19" rx="8" ry="13" fill="#ef425b" opacity=".78" transform="rotate(90 32 32)"/><ellipse cx="32" cy="19" rx="8" ry="13" fill="#cd4c93" opacity=".78" transform="rotate(135 32 32)"/><ellipse cx="32" cy="19" rx="8" ry="13" fill="#8d73b5" opacity=".78" transform="rotate(180 32 32)"/>< <script>
'use strict';
// 后续的聊天、相册及人物内容可在对应渲染函数中扩充。此版本不预置故事内容。
const PASSCODE='980115';
const $=s=>document.querySelector(s),app=$('#app'),screen=$('#screen');
let locked=true,pin='',pinBusy=false,current='',tab='',notes=[],photos=[],selectedDate=new Date(),month=new Date(new Date().getFullYear(),new Date().getMonth(),1),dial='',stopwatchStart=0,stopwatchElapsed=0,stopwatchRunning=false,timerEnd=0,timerRemaining=0,timerRunning=false,toastTimer,clockInterval,chatData={messages:[],kakao:[]},chatRecipient={messages:'',kakao:''};
try{notes=JSON.parse(localStorage.getItem('found-phone-notes')||'[]');if(!Array.isArray(notes))notes=[]}catch{notes=[]}
const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(t){$('#toast').textContent=t;$('#toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').hidden=true,2400)}
function timeString(d){return d.getHours()+':'+String(d.getMinutes()).padStart(2,'0')}
function updateTime(){const d=new Date();$('#statusTime').textContent=timeString(d);document.querySelectorAll('[data-live-time]').forEach(el=>{el.textContent=new Intl.DateTimeFormat('zh-CN',{hour:'2-digit',minute:'2-digit',hour12:false,timeZone:el.dataset.liveTime||undefined}).format(d)});if(timerRunning&&Date.now()>=timerEnd){timerRunning=false;timerRemaining=0;toast('计时结束');if(current==='clock'&&tab==='计时器')renderClock(tab)}}
updateTime();setInterval(updateTime,1000);document.addEventListener('visibilitychange',updateTime);
const letters=['','','ABC','DEF','GHI','JKL','MNO','PQRS','TUV','WXYZ'];
$('#keypad').innerHTML=[1,2,3,4,5,6,7,8,9,'',0,''].map(n=>n===''?'<span></span>':`<button class="key ${n==='删除'?'utility':''}" data-pin="${n}" aria-label="${n}">${n}${typeof n==='number'?`<small>${letters[n]}</small>`:''}</button>`).join('');
function updateDots(){[...$('#dots').children].forEach((el,i)=>el.classList.toggle('on',i<pin.length));$('#dots').setAttribute('aria-label',`已输入${pin.length}位密码`);$('#lockCancel').textContent=pin.length?'删除':'取消'}
function inputPin(n){if(!locked||pinBusy)return;if(n==='删除'){pin=pin.slice(0,-1);updateDots();return}if(!/^\d$/.test(n))return;pin+=n;updateDots();if(pin.length===PASSCODE.length){pinBusy=true;setTimeout(()=>{if(pin===PASSCODE){locked=false;screen.classList.remove('is-locked');$('#lock').classList.add('unlocked');$('#lock').inert=true;$('#home').inert=false;$('#pinMessage').textContent='';setTimeout(()=>{if(!locked)$('#lock').hidden=true},350);$('#homeButton').focus()}else{$('#pinMessage').textContent='密码不正确，请重试';$('#dots').classList.add('shake');setTimeout(()=>$('#dots').classList.remove('shake'),350)}pin='';pinBusy=false;updateDots()},180)}}
$('#lockCancel').onclick=()=>{if(pinBusy)return;pin=pin.slice(0,-1);updateDots()};
$('#keypad').onclick=e=>{const b=e.target.closest('[data-pin]');if(b)inputPin(b.dataset.pin)};
document.addEventListener('keydown',e=>{if(locked&&/^\d$/.test(e.key)){e.preventDefault();inputPin(e.key)}else if(locked&&e.key==='Backspace'){e.preventDefault();inputPin('删除')}else if(e.key==='Escape'){document.querySelectorAll('.sheet,.photo-view,.ig-story-view').forEach(x=>x.remove());goHome()}});
function goHome(){if(locked)return;app.inert=false;clearInterval(clockInterval);app.hidden=true;app.innerHTML='';current='';screen.className='screen';$('#home').inert=false;document.querySelectorAll('.sheet,.photo-view,.ig-story-view').forEach(x=>x.remove())}
function lockPhone(){goHome();locked=true;pin='';pinBusy=false;updateDots();$('#home').inert=true;$('#lock').hidden=false;$('#lock').inert=false;$('#lock').classList.remove('unlocked');screen.classList.add('is-locked');$('#pinMessage').textContent='';$('#keypad button').focus()}
$('#homeButton').onclick=goHome;$('#homeButton').ondblclick=()=>{if(!current&&!locked)lockPhone()};$('#lockToggle').onclick=lockPhone;
$('#home').onclick=e=>{const b=e.target.closest('[data-open]');if(b&&!locked)openApp(b.dataset.open)};
function header(title,action=''){return `<div class="topline"><button class="back" data-action="home">‹ 主屏幕</button>${action}</div><h1 class="title">${title}</h1>`}
function empty(symbol,title,desc){return `<div class="empty"><div class="symbol">${symbol}</div><strong>${title}</strong><p>${desc}</p></div>`}
function tabs(items,active){return `<nav class="tabs">${items.map(([label,icon])=>`<button class="${label===active?'selected':''}" data-tab="${label}"><b>${icon}</b>${label}</button>`).join('')}</nav>`}
function openApp(name){app.inert=false;clearInterval(clockInterval);current=name;tab='';app.style.background='';app.hidden=false;$('#home').inert=true;screen.className='screen light';app.className='app '+name+'-app';const render={safari:renderSafari,instagram:renderInstagram,x:renderX,clock:renderClock,calendar:renderCalendar,notes:renderNotes,phone:renderPhone,messages:renderMessages,photos:renderPhotos,kakao:renderMessages,widget:renderWidget};render[name]();app.querySelector('button')?.focus()}

// Birthdays repeat on the same month/day; dated trips use a specific year.
const CALENDAR_EVENTS=[
 {id:'busan-trip',year:2026,month:1,day:15,title:'釜山旅游',type:'日程',color:'#5084f5'},
 {id:'juyeon-birthday',month:1,day:15,title:'李柱延的生日',type:'生日',color:'#f25269'},
 {id:'my-birthday',month:9,day:13,title:'我的生日',type:'生日',color:'#f25269'}
];
function calendarEvents(date){return CALENDAR_EVENTS.filter(e=>e.month===date.getMonth()+1&&e.day===date.getDate()&&(!e.year||e.year===date.getFullYear()))}
function renderCalendar(){
 const today=new Date(),year=month.getFullYear(),m=month.getMonth(),offset=(new Date(year,m,1).getDay()+6)%7,count=new Date(year,m+1,0).getDate(),events=calendarEvents(selectedDate);
 const iso=selectedDate.getFullYear()+'-'+String(selectedDate.getMonth()+1).padStart(2,'0')+'-'+String(selectedDate.getDate()).padStart(2,'0');
 app.innerHTML=header('日历','<button class="action" id="today">今天</button>')+`<div class="scroll"><div class="month-head"><button id="prevMonth" aria-label="上个月">‹</button><strong>${year}年 ${m+1}月</strong><button id="nextMonth" aria-label="下个月">›</button></div><label class="calendar-jump">前往日期<input type="date" id="calendarJump" aria-label="前往日期" value="${iso}"></label><div class="week">${['一','二','三','四','五','六','日'].map(x=>`<span>${x}</span>`).join('')}</div><div class="monthgrid">${'<span></span>'.repeat(offset)}${Array.from({length:count},(_,i)=>{
 const d=i+1,date=new Date(year,m,d),s=date.toDateString(),entries=calendarEvents(date);
 return `<button data-day="${d}" aria-label="${m+1}月${d}日${entries.length?'，'+entries.map(e=>e.title).join('，'):''}" class="day ${s===today.toDateString()?'today':''} ${s===selectedDate.toDateString()?'chosen':''}">${d}${entries.length?'<i class="event-dot"></i>':''}</button>`;
 }).join('')}</div><div class="agenda"><strong>${selectedDate.toLocaleDateString('zh-CN',{month:'long',day:'numeric',weekday:'long'})}</strong>${events.length?`<div class="calendar-event-list">${events.map(e=>`<article class="calendar-event" style="--event-color:${e.color||'#5084f5'}"><span>全天</span><div><strong>${escapeHTML(e.title)}</strong><small>${escapeHTML(e.type||'日程')}</small></div></article>`).join('')}</div>`:empty('▦','没有日程','这一天还没有安排')}</div></div>`;
 const changeMonth=delta=>{month=new Date(year,m+delta,1);selectedDate=new Date(month.getFullYear(),month.getMonth(),Math.min(selectedDate.getDate(),new Date(month.getFullYear(),month.getMonth()+1,0).getDate()));renderCalendar()};
 $('#prevMonth').onclick=()=>changeMonth(-1);$('#nextMonth').onclick=()=>changeMonth(1);
 $('#today').onclick=()=>{selectedDate=new Date();month=new Date(today.getFullYear(),today.getMonth(),1);renderCalendar()};
 $('#calendarJump').onchange=e=>{const [y,mo,d]=e.target.value.split('-').map(Number);if(!y||!mo||!d)return;selectedDate=new Date(y,mo-1,d);month=new Date(y,mo-1,1);renderCalendar()};
 app.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{selectedDate=new Date(year,m,Number(b.dataset.day));renderCalendar()});
}

function saveNotes(){try{localStorage.setItem('found-phone-notes',JSON.stringify(notes))}catch{toast('浏览器无法保存，本次内容仅保留在当前页面')}}
function renderNotes(){app.innerHTML=header('备忘录','<button class="action" id="newNote" aria-label="新建备忘录">＋</button>')+`<div class="scroll"><input id="noteSearch" class="search" placeholder="搜索" aria-label="搜索备忘录"><div id="noteList"></div></div><div style="text-align:center;padding:15px;font-size:11px;color:#92928d">${notes.length} 则备忘录</div>`;$('#newNote').onclick=()=>{const note={id:Date.now(),text:'',date:new Date().toLocaleDateString('zh-CN')};notes.unshift(note);editNote(note.id)};$('#noteSearch').oninput=()=>noteList($('#noteSearch').value);noteList('')}

function renderClock(t='世界时钟'){clearInterval(clockInterval);tab=t;app.className='app dark';screen.className='screen app-dark';app.innerHTML=header(t)+`<div class="scroll" id="clockContent"></div>`+tabs([['世界时钟','◎'],['闹钟','◷'],['秒表','◴'],['计时器','◶']],t);const content=$('#clockContent');if(t==='世界时钟'){content.innerHTML=[['本地时间',''],['首尔','Asia/Seoul'],['巴黎','Europe/Paris'],['伦敦','Europe/London'],['纽约','America/New_York']].map(([n,z])=>`<div class="clock-row"><div><small>${n==='本地时间'?'跟随系统':'世界时间'}</small>${n}</div><strong data-live-time="${z}"></strong></div>`).join('');updateTime()}if(t==='闹钟')content.innerHTML=empty('◷','没有闹钟','闹钟内容即将加入');if(t==='秒表'){content.innerHTML='<div class="clock-big" id="watchValue"></div><div class="round-actions"><button id="watchReset">复位</button><button class="go" id="watchToggle"></button></div>';const refresh=()=>{$('#watchValue').textContent=formatDuration(stopwatchElapsed+(stopwatchRunning?Date.now()-stopwatchStart:0),true);$('#watchToggle').textContent=stopwatchRunning?'停止':'启动';$('#watchToggle').className=stopwatchRunning?'stop':'go'};refresh();clockInterval=setInterval(refresh,40);$('#watchReset').onclick=()=>{stopwatchElapsed=0;stopwatchStart=Date.now();refresh()};$('#watchToggle').onclick=()=>{if(stopwatchRunning)stopwatchElapsed+=Date.now()-stopwatchStart;else stopwatchStart=Date.now();stopwatchRunning=!stopwatchRunning;refresh()}}if(t==='计时器'){content.innerHTML=`<div class="clock-big" id="timerValue"></div><div class="timer-inputs"><input id="timerMinutes" type="number" min="0" max="999" value="5" aria-label="分钟">分<input id="timerSeconds" type="number" min="0" max="59" value="0" aria-label="秒">秒</div><div class="round-actions"><button id="timerCancel">取消</button><button class="go" id="timerToggle">${timerRunning?'暂停':timerRemaining?'继续':'开始'}</button></div>`;const refresh=()=>{if($('#timerValue'))$('#timerValue').textContent=formatDuration(timerRunning?Math.max(0,timerEnd-Date.now()):timerRemaining||300000)};refresh();clockInterval=setInterval(refresh,200);$('#timerToggle').onclick=()=>{if(timerRunning){timerRemaining=Math.max(0,timerEnd-Date.now());timerRunning=false}else{const ms=timerRemaining||(Math.max(0,Math.min(999,Number($('#timerMinutes').value)||0))*60+Math.max(0,Math.min(59,Number($('#timerSeconds').value)||0)))*1000;if(ms<=0){toast('请设置计时时长');return}timerEnd=Date.now()+ms;timerRunning=true;timerRemaining=ms}renderClock(t)};$('#timerCancel').onclick=()=>{timerRunning=false;timerRemaining=0;renderClock(t)}}}
function formatDuration(ms,hundredths=false){const total=Math.floor(ms/1000),min=Math.floor(total/60),sec=total%60;return String(min).padStart(2,'0')+':'+String(sec).padStart(2,'0')+(hundredths?'.'+String(Math.floor(ms%1000/10)).padStart(2,'0'):'')}
function renderPhone(t='拨号键盘'){tab=t;app.innerHTML=header('电话')+`<div class="scroll">${t==='拨号键盘'?'<div class="dial-number" id="dialNumber"></div><div class="dial-grid">'+[1,2,3,4,5,6,7,8,9,'*',0,'#','', 'call','delete'].map(n=>n===''?'<span></span>':`<button class="key ${n==='call'?'call':n==='delete'?'utility':''}" data-dial="${n}" aria-label="${n==='call'?'拨号':n==='delete'?'删除':n}">${n==='call'?'☎':n==='delete'?'⌫':n}${typeof n==='number'?`<small>${letters[n]|| (n===0?'+':'')}</small>`:''}</button>`).join('')+'</div>':empty('♙',t==='最近通话'?'没有最近通话':'暂无联系人','内容即将加入')}</div>`+tabs([['个人收藏','☆'],['最近通话','◷'],['通讯录','♙'],['拨号键盘','⠿']],t);if($('#dialNumber'))$('#dialNumber').textContent=dial;app.querySelectorAll('[data-dial]').forEach(b=>b.onclick=()=>{const v=b.dataset.dial;if(v==='delete')dial=dial.slice(0,-1);else if(v==='call'){if(!dial){toast('请先输入号码');return}showCall();return}else if(dial.length<19)dial+=v;$('#dialNumber').textContent=dial})}
function showCall(){const sheet=document.createElement('div');sheet.className='sheet';sheet.style.cssText='background:#192427;color:white;align-items:center;padding-top:60px';sheet.innerHTML=`<div style="font-size:30px">${escapeHTML(dial)}</div><p class="subtitle">呼叫演示 · 未连接电话网络</p><button id="endCall" style="margin-top:auto;margin-bottom:50px;border-radius:50%;background:#ff453a;width:70px;height:70px;font-size:28px" aria-label="结束呼叫">☎</button>`;screen.append(sheet);$('#endCall').onclick=()=>sheet.remove()}
function renderMessages(t='聊天'){tab=t;const isKakao=current==='kakao',name=isKakao?'KakaoTalk':'信息';app.className='app '+(isKakao?'kakao-app':'');app.innerHTML=header(name,`<button class="action" id="newChat" aria-label="新建对话">＋</button>`)+`<div class="scroll">${isKakao&&t!=='聊天'?empty('♙',t==='好友'?'暂无好友':'更多内容','内容即将加入'):`<input class="search" placeholder="搜索" id="chatSearch" aria-label="搜索对话"><div id="chatList">${chatRecipient[current]?`<button class="row" id="openConversation"><div><strong>${escapeHTML(chatRecipient[current])}</strong><p class="subtitle">${escapeHTML(chatData[current].at(-1)||'新对话')}</p></div><span>›</span></button>`:empty(isKakao?'☏':'☍','还没有对话','聊天内容即将加入')}</div>`}</div>`+(isKakao?tabs([['好友','♙'],['聊天','☏'],['更多','•••']],t):'');$('#newChat').onclick=newChat;if($('#openConversation'))$('#openConversation').onclick=renderConversation;if($('#chatSearch'))$('#chatSearch').oninput=e=>{const row=$('#openConversation');if(row)row.hidden=!chatRecipient[current].includes(e.target.value)}}
function newChat(){const kind=current,sheet=document.createElement('div');sheet.className='sheet';sheet.innerHTML='<div class="topline"><button class="back" id="cancelChat">取消</button><strong>新建对话</strong><button class="action" id="createChat">开始</button></div><input id="recipient" placeholder="收件人姓名或号码" aria-label="收件人"><p class="subtitle" style="padding:0 20px">对话保留在本次体验中。</p>';screen.append(sheet);$('#cancelChat').onclick=()=>sheet.remove();$('#createChat').onclick=()=>{const value=$('#recipient').value.trim();if(!value){toast('请填写收件人');return}if(chatRecipient[kind]&&chatRecipient[kind]!==value){toast('当前版本先保留一个对话，请继续已有对话');return}chatRecipient[kind]=value;sheet.remove();renderConversation()};$('#recipient').focus()}
function renderConversation(){const kind=current;app.style.background=kind==='kakao'?'#b5c8d6':'';app.innerHTML=`<div class="topline"><button class="back" id="chatBack">‹ 返回</button><strong>${escapeHTML(chatRecipient[kind])}</strong><span style="width:35px"></span></div><div class="chat" id="chatBody">${chatData[kind].map(text=>`<div class="bubble">${escapeHTML(text)}</div>`).join('')}</div><form class="compose" id="compose"><input id="messageInput" placeholder="${kind==='kakao'?'输入消息':'iMessage'}" aria-label="消息内容" autocomplete="off"><button aria-label="发送">↑</button></form>`;$('#chatBack').onclick=()=>{app.style.background='';renderMessages()};$('#compose').onsubmit=e=>{e.preventDefault();const text=$('#messageInput').value.trim();if(!text)return;chatData[kind].push(text);renderConversation();$('#messageInput').focus()};$('#chatBody').scrollTop=$('#chatBody').scrollHeight}
function renderPhotos(t='图库'){tab=t;app.innerHTML=header('照片','<button class="action" id="addPhotos" aria-label="导入照片">＋</button>')+`<div class="scroll">${photos.length?`<p class="subtitle">${photos.length} 张照片</p><div class="photo-grid">${photos.map((p,i)=>`<button data-photo="${i}" aria-label="查看照片 ${i+1}"><img src="${p.url}" alt="${escapeHTML(p.name)}"></button>`).join('')}</div>`:empty('❀',t==='相簿'?'相簿是空的':'还没有照片','点击 ＋ 添加照片到本次体验')}<input type="file" id="photoInput" accept="image/*" multiple hidden></div>`+tabs([['图库','▦'],['相簿','▣']],t);$('#addPhotos').onclick=()=>$('#photoInput').click();$('#photoInput').onchange=e=>{[...e.target.files].filter(f=>f.type.startsWith('image/')).forEach(f=>photos.push({url:URL.createObjectURL(f),name:f.name}));renderPhotos(t)};app.querySelectorAll('[data-photo]').forEach(b=>b.onclick=()=>{const overlay=document.createElement('div');overlay.className='photo-view';overlay.innerHTML=`<img src="${photos[Number(b.dataset.photo)].url}" alt="照片预览"><button aria-label="关闭照片">×</button>`;screen.append(overlay);overlay.querySelector('button').onclick=()=>overlay.remove()})}
function renderWidget(){app.innerHTML=header('纪念日')+`<div class="scroll" style="display:flex;flex-direction:column;align-items:center;justify-content:center;padding-bottom:100px"><span style="font-size:45px;color:#aaa">♡</span><strong style="font-size:70px;font-weight:300;margin:20px 0">976<span style="font-size:20px"> 天</span></strong><p class="subtitle">关于这一天的故事，待续。</p></div>`}

function renderX(t='首页'){
tab=t;app.className='app x-app';
app.innerHTML='<div class="topline"><button class="back" data-action="home">‹ 主屏幕</button><span class="x-brand">𝕏</span><button class="action" id="xProfile" aria-label="个人主页">◉</button></div>'+(t==='首页'?'<div class="x-feed-tabs"><button class="active" data-feed="推荐">为你推荐</button><button data-feed="关注">正在关注</button></div>':'')+'<div class="scroll">'+(t==='搜索'?'<input class="search" id="xSearch" placeholder="搜索 X" aria-label="搜索 X">':'')+empty(t==='通知'?'♧':t==='私信'?'✉':'𝕏',({首页:'还没有帖子',搜索:'探索 X',通知:'暂无通知',私信:'还没有私信',个人主页:'个人主页'})[t],'')+'</div>'+tabs([['首页','⌂'],['搜索','⌕'],['通知','♧'],['私信','✉']],t);
$('#xProfile').onclick=()=>renderX('个人主页');
app.querySelectorAll('[data-feed]').forEach(b=>b.onclick=()=>{app.querySelectorAll('[data-feed]').forEach(a=>a.classList.toggle('active',a===b));app.querySelector('.empty strong').textContent=b.dataset.feed==='关注'?'还没有关注的动态':'还没有帖子'});
if($('#xSearch'))$('#xSearch').oninput=e=>{app.querySelector('.empty strong').textContent=e.target.value?'暂无相关结果':'探索 X'};
}
const IG_STORIES=[
 {id:'self',username:'leejaehyunow',date:'2026年10月3日',image:'./media-2aa286977083f8d9020a.jpg',alt:'leejaehyunow 于2026年10月3日发布的快拍'},
 {id:'tbzuyeon',username:'tbzuyeon',date:'2026年10月3日',image:'./media-1a6c5f85e8fae9099eb6.jpg',alt:'tbzuyeon 于2026年10月3日发布的快拍'}
];
let igStoryIndex=0;
function closeIgStory(){app.inert=false;document.querySelector('.ig-story-view')?.remove();screen.classList.remove('story-open');app.querySelector('[data-ig="story"]')?.focus()}
function openIgStory(index=0){
 document.querySelectorAll('.ig-story-view,.ig-sheet').forEach(x=>x.remove());
 igStoryIndex=Math.max(0,Math.min(IG_STORIES.length-1,index));
 const story=IG_STORIES[igStoryIndex],viewer=document.createElement('section');
 viewer.className='ig-story-view';viewer.setAttribute('role','dialog');viewer.setAttribute('aria-modal','true');viewer.setAttribute('aria-label',story.username+'的快拍');
 viewer.innerHTML=`<div class="ig-story-progress" aria-hidden="true">${IG_STORIES.map((_,i)=>`<span class="${i<=igStoryIndex?'seen':''}"></span>`).join('')}</div><header class="ig-view-header">${story.id==='self'?`<img src="${IG_AVATAR}" alt="你的头像">`:'<span class="ig-black-avatar" aria-label="tbzuyeon的黑色头像"></span>'}<div><strong>${escapeHTML(story.id==='self'?igProfile.id:story.username)}</strong><time datetime="2026-10-03">${story.date}</time></div><button id="igStoryClose" aria-label="关闭快拍">${igIcon('close')}</button></header><div class="ig-view-media"><img src="${story.image}" alt="${story.alt}"><button class="ig-story-prev" id="igStoryPrev" aria-label="上一个快拍" ${igStoryIndex===0?'disabled':''}></button><button class="ig-story-next" id="igStoryNext" aria-label="下一个快拍" ${igStoryIndex===IG_STORIES.length-1?'disabled':''}></button></div><footer class="ig-view-footer"><button id="igStoryPrevious" ${igStoryIndex===0?'disabled':''} aria-label="查看你的快拍">‹</button><span>${igStoryIndex+1} / ${IG_STORIES.length}</span><button id="igStoryFollowing" ${igStoryIndex===IG_STORIES.length-1?'disabled':''} aria-label="查看 tbzuyeon 的快拍">›</button></footer>`;
 screen.append(viewer);app.inert=true;screen.classList.add('story-open');
 $('#igStoryClose').onclick=closeIgStory;
 for(const id of ['igStoryPrev','igStoryPrevious'])$('#'+id).onclick=()=>openIgStory(igStoryIndex-1);
 for(const id of ['igStoryNext','igStoryFollowing'])$('#'+id).onclick=()=>openIgStory(igStoryIndex+1);
 $('#igStoryClose').focus();
}
document.addEventListener('keydown',e=>{
 if(!document.querySelector('.ig-story-view'))return;
 if(['Escape','ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();e.stopImmediatePropagation();if(e.key==='Escape')closeIgStory();else openIgStory(igStoryIndex+(e.key==='ArrowRight'?1:-1))}
},true);

</script>
</body></html>
